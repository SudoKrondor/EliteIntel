# The commander's answer to a destructive-action confirmation (see ConfirmationReplies)
# An answer must OPEN with one of these phrases. A negative wins over an affirmative. English applies in every language.
affirmative=sim, claro, pode, confirmo, confirmado, afirmativo, correto, com certeza, ok, okay, vai, prossiga, faça, pode fazer, isso, certo, avança
negative=não, nao, negativo, espera, espere, pare, alto, deixa, esquece, cancela isso, nem pensar, melhor não
