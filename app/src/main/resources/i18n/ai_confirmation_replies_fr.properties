# The commander's answer to a destructive-action confirmation (see ConfirmationReplies)
# An answer must OPEN with one of these phrases. A negative wins over an affirmative. English applies in every language.
affirmative=oui, ouais, d'accord, vas-y, allez-y, confirme, confirmé, affirmatif, exact, bien sûr, ok, okay, c'est bon, fais-le, procède, absolument, parfait, entendu
negative=non, négatif, attends, attendez, stop, arrête, annule ça, laisse tomber, pas question, surtout pas, oublie, pas maintenant
