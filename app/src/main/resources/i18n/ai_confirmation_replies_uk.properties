# The commander's answer to a destructive-action confirmation (see ConfirmationReplies)
# An answer must OPEN with one of these phrases. A negative wins over an affirmative. English applies in every language.
affirmative=так, звісно, підтверджую, підтверджено, давай, виконуй, роби, добре, гаразд, окей, ок, згоден, авжеж, дій, дозволяю
negative=ні, не, відставити, стій, зачекай, почекай, стоп, забудь, відбій, в жодному разі, не треба
