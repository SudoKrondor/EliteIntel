# The commander's answer to a destructive-action confirmation (see ConfirmationReplies)
# An answer must OPEN with one of these phrases. A negative wins over an affirmative. English applies in every language.
affirmative=yes, yeah, yep, yup, yes please, sure, affirmative, confirm, confirmed, do it, go ahead, proceed, correct, absolutely, of course, please do, make it so, roger, ok, okay, engage, execute, carry on, that's right
negative=no, nope, nah, negative, belay, hold on, hold it, hold, wait, don't, do not, never mind, nevermind, stop, cancel that, abort that, forget it, scratch that, not now
