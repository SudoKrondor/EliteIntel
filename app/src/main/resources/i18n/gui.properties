speech.bindingConflictsBlocking=Commander, critical binding conflict. Your galaxy map movement and your interface navigation are on the same {0,choice,1#key|1<keys} - {1}. Route plotting cannot work until the map and the interface have separate keys. The exact bindings are under BindForge, then Bind Editor, then Anomalies.
