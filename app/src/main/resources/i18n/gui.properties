# Display names and descriptions of the built-in commands and queries (Actions > Built-in Commands, details dialog).
# CommandCatalog reads command.<id>.name/.description and query.<id>.name/.description - every registered id needs both in every bundle.
command.activate_ui_control.name=Activate UI Control
command.activate_ui_control.description=Presses the in-game select key on whatever control currently has focus.
command.add_mining_target.name=Add Mining Target
command.add_mining_target.description=Adds a mineable commodity, such as Platinum or Painite, to the prospecting list, so VEGA calls it out when a prospector finds it.
command.allow_star_system_in_searches_again.name=Allow System in Searches Again
command.allow_star_system_in_searches_again.description=Lets the current star system appear in searches again after it was excluded.
command.bookmark_current_location.name=Bookmark Current Location
command.bookmark_current_location.description=Saves where you are now - system, station, planet or surface spot - as a bookmark to navigate back to later.
command.calculate_fleet_carrier_route.name=Calculate Fleet Carrier Route
command.calculate_fleet_carrier_route.description=Plots a new multi-jump route for your fleet carrier to the system copied to the clipboard, replacing any route already plotted.
command.calculate_neutron_star_route.name=Calculate Neutron Star Route
command.calculate_neutron_star_route.description=Plots a neutron-boosted route to the system copied from the galaxy map; you can name the route efficiency and ask for supercharging.
command.calculate_trade_route.name=Calculate Trade Route
command.calculate_trade_route.description=Calculates a profitable multi-stop trade route from your saved trade profile: budget, cargo capacity, stops and distance.
command.cancel_navigation.name=Cancel Navigation
command.cancel_navigation.description=Turns off the active navigation or surface-target guidance.
command.cancel_trade_route.name=Cancel Trade Route
command.cancel_trade_route.description=Clears the trade route currently planned.
command.clear_active_missions.name=Clear Active Missions
command.clear_active_missions.description=Clears the app's list of tracked missions; the missions themselves stay active in the game.
command.clear_fleet_carrier_route.name=Clear Fleet Carrier Route
command.clear_fleet_carrier_route.description=Abandons the plotted fleet carrier route, so no legs, destination or jump countdown remain.
command.clear_mining_targets.name=Clear Mining Targets
command.clear_mining_targets.description=Removes every commodity from the prospecting list.
command.clear_neutron_route.name=Clear Neutron Route
command.clear_neutron_route.description=Deletes the stored neutron-star route waypoints.
command.clear_reminders.name=Clear Reminders
command.clear_reminders.description=Deletes every reminder: the saved errand, all timed reminders, the route trade tip and the last commodity search result.
command.close_location_bookmarks.name=Close Bookmarks
command.close_location_bookmarks.description=Closes the bookmark list on the HUD overlay.
command.cycle_next_page.name=Next Page
command.cycle_next_page.description=Moves to the next page inside the in-game panel that is open.
command.cycle_next_panel.name=Next Tab
command.cycle_next_panel.description=Moves to the next tab of the in-game panel that is open.
command.cycle_previous_page.name=Previous Page
command.cycle_previous_page.description=Moves to the previous page inside the in-game panel that is open.
command.cycle_previous_panel.name=Previous Tab
command.cycle_previous_panel.description=Moves to the previous tab of the in-game panel that is open.
command.decrease_speed.name=Decrease Speed
command.decrease_speed.description=Lowers the throttle by the number of notches you name.
command.delete_codex_entry.name=Delete Codex Entry
command.delete_codex_entry.description=Deletes the codex or bio-sample entry being tracked and stops guiding to it.
command.delete_location_bookmark.name=Delete Bookmark
command.delete_location_bookmark.description=Deletes the bookmark with the number you name, as numbered on the bookmark list.
command.deploy_chaff.name=Deploy Chaff
command.deploy_chaff.description=Launches chaff to break missile and gimballed-weapon locks.
command.deploy_fighter.name=Deploy Fighter
command.deploy_fighter.description=Launches a ship-launched fighter from the fighter bay while you fly the main ship.
command.deploy_hardpoints.name=Deploy Hardpoints
command.deploy_hardpoints.description=Deploys the hardpoints: weapons, but also mining lasers, limpet controllers and scanners need them out.
command.deploy_heat_sink.name=Deploy Heat Sink
command.deploy_heat_sink.description=Launches a heat sink to dump heat and cool the ship.
command.deploy_landing_gear.name=Deploy Landing Gear
command.deploy_landing_gear.description=Lowers the landing gear for docking or landing.
command.deploy_shield_cell.name=Deploy Shield Cell
command.deploy_shield_cell.description=Fires a shield cell bank to recharge the shields.
command.deploy_vehicle_srv.name=Deploy SRV
command.deploy_vehicle_srv.description=Deploys an SRV from the ship's vehicle hangar; name the vehicle or the bay, otherwise bay 1 is used.
command.disembark.name=Disembark
command.disembark.description=Leaves the ship or SRV to go on foot.
command.dismiss_construction_site.name=Dismiss Construction Site
command.dismiss_construction_site.description=Stops tracking the construction site you last docked at: it leaves the HUD and VEGA stops offering to shop or navigate for it.
command.dismiss_ship_to_orbit.name=Dismiss Ship
command.dismiss_ship_to_orbit.description=Sends the ship away to orbit while you are in the SRV or on foot.
command.display_fleet_carrier_management_panel.name=Fleet Carrier Management
command.display_fleet_carrier_management_panel.description=Opens the fleet carrier management panel.
command.display_open_galaxy_map.name=Open Galaxy Map
command.display_open_galaxy_map.description=Opens the galaxy map.
command.display_open_system_map.name=Open System Map
command.display_open_system_map.description=Opens the system map.
command.display_radar_panel.name=Radar Panel
command.display_radar_panel.description=Opens the radar and sensors panel.
command.drive_assist.name=Drive Assist
command.drive_assist.description=Turns SRV drive assist on or off, or toggles it if you do not say which.
command.drop_from_super_cruise.name=Drop from Supercruise
command.drop_from_super_cruise.description=Drops out of supercruise into normal space.
command.enter_fleet_carrier_destination.name=Enter Fleet Carrier Destination
command.enter_fleet_carrier_destination.description=Types the next carrier route leg's system into the carrier navigation field and confirms it; use it after calculating a carrier route.
command.enter_super_cruise.name=Enter Supercruise
command.enter_super_cruise.description=Engages supercruise; if already in supercruise, targets the next route system and jumps.
command.equalize_power.name=Equalize Power
command.equalize_power.description=Resets the power distributor to balanced pips across systems, engines and weapons.
command.exclude_star_system_from_searches.name=Exclude System from Searches
command.exclude_star_system_from_searches.description=Leaves a star system out of every search from now on, for when a station a search named there does not exist or cannot be used.
command.exit_close.name=Close Panel or Map
command.exit_close.description=Closes or backs out of the panel, menu or map that is open.
command.fighter_attack_target.name=Fighter: Attack My Target
command.fighter_attack_target.description=Orders the deployed fighter to attack your current target.
command.fighter_defend.name=Fighter: Defend Ship
command.fighter_defend.description=Orders the deployed fighter to defend your ship.
command.fighter_fire_at_will.name=Fighter: Fire at Will
command.fighter_fire_at_will.description=Orders the deployed fighter to engage targets freely.
command.fighter_hold_fire.name=Fighter: Hold Fire
command.fighter_hold_fire.description=Orders the deployed fighter to hold fire.
command.fighter_return_to_ship.name=Fighter: Return to Ship
command.fighter_return_to_ship.description=Orders the deployed fighter to return and dock with your ship.
command.find_bounty_hunting_ground.name=Find Bounty Hunting Ground
command.find_bounty_hunting_ground.description=Plots a route to a system with resource extraction sites for bounty hunting, chosen from systems you have already visited within the range you name.
command.find_commodity.name=Find Commodity to Buy
command.find_commodity.description=Finds where to buy a commodity or module within the distance you name and plots a route there, to the nearest market or the best price.
command.find_conflict_zone_for_combat_bonds.name=Find Conflict Zone
command.find_conflict_zone_for_combat_bonds.description=Plots a route to a system with active conflict zones to fight for a faction and earn combat bonds, from wars sighted in the last week within the range you name.
command.find_construction_site_commodity.name=Find Construction Commodity
command.find_construction_site_commodity.description=Finds where to buy what your construction site still needs most and plots a route to that market; it reads the site's own list, so no commodity needs naming.
command.find_encoded_material_trader.name=Find Encoded Material Trader
command.find_encoded_material_trader.description=Plots a route to the nearest encoded material trader.
command.find_fuel_station.name=Find Fuel Station
command.find_fuel_station.description=Plots a route to the nearest station where the ship can dock and refuel - for a ship with no fuel scoop.
command.find_guardian_technology_broker.name=Find Guardian Technology Broker
command.find_guardian_technology_broker.description=Plots a route to the nearest Guardian technology broker, which unlocks Guardian modules and weapons.
command.find_human_technology_broker.name=Find Human Technology Broker
command.find_human_technology_broker.description=Plots a route to the nearest human technology broker, which unlocks tech-broker modules.
command.find_interstellar_factor.name=Find Interstellar Factors
command.find_interstellar_factor.description=Plots a route to the nearest Interstellar Factors contact to pay off bounties and fines.
command.find_manufactured_material_trader.name=Find Manufactured Material Trader
command.find_manufactured_material_trader.description=Plots a route to the nearest manufactured material trader.
command.find_mining_site.name=Find Mining Site
command.find_mining_site.description=Plots a route to the nearest pristine ring or asteroid field that yields the commodity you name, within the distance you name.
command.find_mission_commodity.name=Find Mission Commodity
command.find_mission_commodity.description=Finds where to buy the cargo an active mission still needs and plots a route there; it reads the mission board, so no commodity needs naming.
command.find_nearest_fleet_carrier.name=Find Nearest Fleet Carrier
command.find_nearest_fleet_carrier.description=Reports the nearest fleet carrier in range other than your own.
command.find_pirate_massacre_missions.name=Find Pirate Massacre Missions
command.find_pirate_massacre_missions.description=Reports where pirate massacre missions can be stacked - a provider system whose factions target a system with resource extraction sites - within the range you name.
command.find_powerplay_conflict_zone_for_merits.name=Find Powerplay Conflict Zone
command.find_powerplay_conflict_zone_for_merits.description=Plots a route to a powerplay conflict zone where your pledged power is fighting, to earn merits.
command.find_raw_material_trader.name=Find Raw Material Trader
command.find_raw_material_trader.description=Plots a route to the nearest raw material trader.
command.find_shipyard_selling_ship.name=Find Shipyard Selling a Ship
command.find_shipyard_selling_ship.description=Finds a shipyard selling the ship you name within the distance you name and plots a route there, to the nearest or the cheapest.
command.find_vista_genomics.name=Find Vista Genomics
command.find_vista_genomics.description=Plots a route to the nearest Vista Genomics to sell exobiology data.
command.find_where_to_collect_raw_material.name=Find Where to Collect Raw Material
command.find_where_to_collect_raw_material.description=Plots a route to the best place to collect the raw material you name, such as tellurium: a Brain Tree site, otherwise the richest planet surface.
command.find_where_to_sell_commodity.name=Find Where to Sell Commodity
command.find_where_to_sell_commodity.description=Finds a market with demand for the commodity you name within the distance you name and plots a route there, to the nearest or the best-paying buyer.
command.flag_exo_mastery_system_harvested.name=Mark System as Harvested
command.flag_exo_mastery_system_harvested.description=Records that you already sampled every exobiology body in this system in an earlier session, so the Exo-Mastery route stops offering it.
command.forget_hunting_ground.name=Forget Hunting Ground
command.forget_hunting_ground.description=Forgets the current system as a pirate hunting ground, so it is never recommended again along with the mission providers that targeted it.
command.hide_hud_overlay.name=Hide HUD Overlay
command.hide_hud_overlay.description=Takes the HUD overlay off screen.
command.ignore_nonsensical_input.name=Ignore Nonsensical Input
command.ignore_nonsensical_input.description=Used when a transcript makes no sense, so VEGA lets it pass without acting on it.
command.increase_speed.name=Increase Speed
command.increase_speed.description=Raises the throttle by the number of notches you name.
command.interrupt.name=Interrupt
command.interrupt.description=Stops VEGA speaking at once.
command.jump_to_hyperspace.name=Jump to Hyperspace
command.jump_to_hyperspace.description=Engages the frame shift drive to jump to the next system on the plotted route.
command.launch_deploy_nomad.name=Deploy Nomad
command.launch_deploy_nomad.description=Deploys the Nomad aerial scout while flying low over a planet.
command.launch_ship_detach_from_station.name=Launch Ship
command.launch_ship_detach_from_station.description=Undocks the ship and launches it from the landing pad.
command.monetize_route.name=Monetize Route
command.monetize_route.description=Finds a profitable buy-and-sell pair along the plotted route and saves it as a reminder, to earn credits on the way.
command.move_hud_overlay_to_screen_section.name=Move HUD Overlay
command.move_hud_overlay_to_screen_section.description=Moves the HUD overlay card to the part of the screen you name by compass direction: north is the top, south the bottom, east the right, west the left.
command.navigate_from_memory.name=Navigate from Clipboard
command.navigate_from_memory.description=Plots a route to the star system name copied to the clipboard from a site such as INARA or Spansh.
command.navigate_to_active_mission.name=Navigate to Active Mission
command.navigate_to_active_mission.description=Plots a route to an active mission's destination; name a mission by keyword, or the newest one with a destination is used.
command.navigate_to_bio_sample_codex_entry.name=Navigate to Bio Sample Codex Entry
command.navigate_to_bio_sample_codex_entry.description=Guides you across the current planet to the nearest saved biological sample or codex location.
command.navigate_to_construction_site.name=Navigate to Construction Site
command.navigate_to_construction_site.description=Plots a route back to the construction site you are hauling to - the one you last docked at.
command.navigate_to_coordinates.name=Navigate to Coordinates
command.navigate_to_coordinates.description=Starts surface guidance to the latitude and longitude you name on the current planet.
command.navigate_to_exo_mastery_site.name=Navigate to Exobiology Site
command.navigate_to_exo_mastery_site.description=Plots a route to the best-paying exobiology system on the Exo-Mastery list you have not sampled yet, and leaves a reminder naming the planets to land on.
command.navigate_to_fleet_carrier.name=Navigate to Fleet Carrier
command.navigate_to_fleet_carrier.description=Plots a route to your fleet carrier's last known location, or to your home system if no carrier is known.
command.navigate_to_home_system.name=Navigate to Home System
command.navigate_to_home_system.description=Plots a route to your saved home system.
command.navigate_to_landing_zone.name=Navigate to Landing Zone
command.navigate_to_landing_zone.description=Starts surface guidance back to the saved landing zone on the current planet.
command.navigate_to_location_bookmark.name=Navigate to Bookmark
command.navigate_to_location_bookmark.description=Plots a route to the bookmark with the number you name, as numbered on the bookmark list.
command.navigate_to_next_trade_stop.name=Navigate to Next Trade Stop
command.navigate_to_next_trade_stop.description=Plots a route to the next stop of the active trade route, to buy or to sell depending on your cargo.
command.navigate_to_pirate_mission_provider.name=Navigate to Pirate Mission Provider
command.navigate_to_pirate_mission_provider.description=Plots a route to a system that hands out pirate massacre missions, for the missions you hold, the hunting ground you are in, or the best pairing on record.
command.navigate_to_pirate_mission_target.name=Navigate to Pirate Mission Target
command.navigate_to_pirate_mission_target.description=Plots a route to the system where the pirates of your active massacre mission are hunted.
command.navigate_to_squadron_carrier.name=Navigate to Squadron Carrier
command.navigate_to_squadron_carrier.description=Plots a route to your squadron's fleet carrier.
command.navigate_to_star_system_or_place_named_aloud.name=Navigate to Named Place
command.navigate_to_star_system_or_place_named_aloud.description=Plots a route to a star system, station or place you name aloud.
command.next_location_bookmarks_page.name=Next Bookmarks Page
command.next_location_bookmarks_page.description=Shows the next page of bookmarks on the HUD overlay.
command.open_fss_scan_system.name=Open FSS
command.open_fss_scan_system.description=Opens the Full Spectrum System scanner to resolve bodies in detail; works in supercruise.
command.pause_music_playback.name=Pause Music
command.pause_music_playback.description=Pauses your music, keeping your place in the track.
command.play_music.name=Play Music
command.play_music.description=Plays your own music from the Jukebox playlist, or resumes it where it was paused.
command.play_music_track_by_name.name=Play Track by Name
command.play_music_track_by_name.description=Plays one track from your playlist, named by its title or artist.
command.play_previous_music_track.name=Previous Track
command.play_previous_music_track.description=Goes back to the previous track in your playlist.
command.plot_route_next_neutron_star_waypoint.name=Plot Route to Next Neutron Waypoint
command.plot_route_next_neutron_star_waypoint.description=Plots a route to the next waypoint of the calculated neutron-star route.
command.previous_location_bookmarks_page.name=Previous Bookmarks Page
command.previous_location_bookmarks_page.description=Shows the previous page of bookmarks on the HUD overlay.
command.recover_srv_vehicle_get_on_board_ship.name=Recover SRV
command.recover_srv_vehicle_get_on_board_ship.description=Drives the SRV back aboard the ship and stows it in the hangar.
command.remove_mining_target.name=Remove Mining Target
command.remove_mining_target.description=Removes the commodity you name from the prospecting list.
command.request_docking.name=Request Docking
command.request_docking.description=Asks the nearby station or outpost for a landing pad.
command.reset_head_look_ahead.name=Reset Head Look
command.reset_head_look_ahead.description=Recentres the head-look camera to face straight ahead.
command.restart_music_playlist_from_first_track.name=Restart Playlist
command.restart_music_playlist_from_first_track.description=Starts your playlist again from its first track.
command.retract_hardpoints.name=Retract Hardpoints
command.retract_hardpoints.description=Retracts the hardpoints.
command.retract_landing_gear.name=Retract Landing Gear
command.retract_landing_gear.description=Raises the landing gear.
command.return_to_surface.name=Recall Ship to My Position
command.return_to_surface.description=Calls the ship down to pick you up where you are, while you are in the SRV or on foot.
command.run_discovery_scan.name=Discovery Scan
command.run_discovery_scan.description=Fires the discovery scanner (the honk) to reveal how many bodies and signals the system has.
command.scan_journals_for_hunting_grounds.name=Learn Hunting Grounds from Journals
command.scan_journals_for_hunting_grounds.description=Reads your saved game journals and learns every system with resource extraction sites and every pirate massacre mission provider you have met.
command.select_fire_group_by_nato.name=Select Fire Group
command.select_fire_group_by_nato.description=Switches to the fire group you name by NATO letter: Alpha is the first, Bravo the second, and so on.
command.set_carrier_fuel_reserve.name=Set Carrier Fuel Reserve
command.set_carrier_fuel_reserve.description=Sets your fleet carrier's tritium reserve to the amount you name.
command.set_current_body_exobiology_survey_complete.name=Mark Body as Sampled
command.set_current_body_exobiology_survey_complete.description=Records by hand that you already sampled every organism on this body in an earlier session, or takes that record back; only the app's own bookkeeping changes.
command.set_home_system.name=Set Home System
command.set_home_system.description=Makes the current star system your home system.
command.set_optimal_speed.name=Set Optimal Approach Speed
command.set_optimal_speed.description=Sets the throttle to 75%, the sweet spot for slowing down on approach in supercruise.
command.set_reminder.name=Set Reminder
command.set_reminder.description=Saves a spoken note to recall later, with no timer.
command.set_speed_100.name=Full Throttle
command.set_speed_100.description=Sets the throttle to 100%.
command.set_speed_25.name=Quarter Throttle
command.set_speed_25.description=Sets the throttle to 25%.
command.set_speed_50.name=Half Throttle
command.set_speed_50.description=Sets the throttle to 50%.
command.set_speed_75.name=Three-Quarter Throttle
command.set_speed_75.description=Sets the throttle to 75%.
command.set_speed_to_zero_0_stop_ship.name=Full Stop
command.set_speed_to_zero_0_stop_ship.description=Sets the throttle to zero to stop the ship.
command.set_timed_reminder.name=Set Timed Reminder
command.set_timed_reminder.description=Schedules a reminder to be spoken after the number of minutes you name.
command.show_central_panel.name=Commander Panel
command.show_central_panel.description=Opens the central panel with your commander information.
command.show_chat_comms_panel.name=Comms Panel
command.show_chat_comms_panel.description=Opens the comms and chat panel.
command.show_contacts_panel.name=Contacts Panel
command.show_contacts_panel.description=Opens the contacts panel: nearby ships, stations and signal sources.
command.show_crew_panel.name=Crew Panel
command.show_crew_panel.description=Opens the crew panel.
command.show_email_inbox_panel.name=Inbox Panel
command.show_email_inbox_panel.description=Opens the inbox in the comms panel.
command.show_fighter_panel.name=Fighter Panel
command.show_fighter_panel.description=Opens the fighter panel.
command.show_fire_groups_panel.name=Fire Groups Panel
command.show_fire_groups_panel.description=Opens the fire groups panel.
command.show_history_panel.name=History Panel
command.show_history_panel.description=Opens the comms history panel with earlier messages.
command.show_hud_overlay.name=Show HUD Overlay
command.show_hud_overlay.description=Shows the HUD overlay where it was last placed.
command.show_internal_panel.name=Internal Panel
command.show_internal_panel.description=Opens the right-hand internal panel on its main tab.
command.show_inventory_panel.name=Inventory Panel
command.show_inventory_panel.description=Opens the inventory panel: materials and consumables on board.
command.show_location_bookmarks.name=Show Bookmarks
command.show_location_bookmarks.description=Shows your saved bookmarks on the HUD overlay, numbered in list order.
command.show_modules_panel.name=Modules Panel
command.show_modules_panel.description=Opens the modules panel: installed modules and their power priority.
command.show_navigation_panel.name=Navigation Panel
command.show_navigation_panel.description=Opens the left-hand navigation panel: route and nearby systems and bodies.
command.show_social_panel.name=Social Panel
command.show_social_panel.description=Opens the social panel in comms.
command.show_squadron_panel.name=Squadron Panel
command.show_squadron_panel.description=Opens the squadron panel in comms.
command.show_station_services_panel.name=Station Services
command.show_station_services_panel.description=Opens the station services menu while docked.
command.show_status_panel.name=Status Panel
command.show_status_panel.description=Opens the status panel: ranks, reputation and commander status.
command.show_storage_panel.name=Storage Panel
command.show_storage_panel.description=Opens the storage panel: modules and ships stored at this station.
command.show_transactions_panel.name=Transactions Panel
command.show_transactions_panel.description=Opens the transactions panel: active missions and transactions.
command.shuffle_music_tracks.name=Shuffle Music
command.shuffle_music_tracks.description=Plays your music in random order, or back in playlist order.
command.skip_to_next_music_track.name=Next Track
command.skip_to_next_music_track.description=Skips to the next track in your playlist.
command.sleep_ignore_do_not_monitor.name=Sleep
command.sleep_ignore_do_not_monitor.description=Puts VEGA to sleep: it stops listening and answering until you wake it.
command.switch_to_analysis_mode.name=Switch to Analysis Mode
command.switch_to_analysis_mode.description=Switches the HUD to analysis mode for scanners and exploration.
command.switch_to_combat_mode.name=Switch to Combat Mode
command.switch_to_combat_mode.description=Switches the HUD to combat mode.
command.target_destination.name=Target Destination
command.target_destination.description=Targets the next system on the plotted route as the jump destination.
command.target_hostile_highest_threat.name=Target Highest Threat
command.target_hostile_highest_threat.description=Targets the most dangerous hostile ship in range.
command.target_subsystem.name=Target Subsystem
command.target_subsystem.description=Targets a subsystem you name on the enemy ship, such as the power plant, FSD, drives or shield generator.
command.target_wingman_1.name=Target Wingman 1
command.target_wingman_1.description=Targets the first wingmate.
command.target_wingman_2.name=Target Wingman 2
command.target_wingman_2.description=Targets the second wingmate.
command.target_wingman_3.name=Target Wingman 3
command.target_wingman_3.description=Targets the third wingmate.
command.taxi_to_landing_pad.name=Taxi to Landing Pad
command.taxi_to_landing_pad.description=Hands the ship to the docking computer to taxi onto the assigned landing pad.
command.toggle_all_announcements.name=All Announcements On/Off
command.toggle_all_announcements.description=Turns every spoken announcement category on or off at once.
command.toggle_cargo_scoop.name=Cargo Scoop
command.toggle_cargo_scoop.description=Opens or closes the cargo scoop.
command.toggle_cargo_scoop_pickup_announcements.name=Cargo Pickup Announcements On/Off
command.toggle_cargo_scoop_pickup_announcements.description=Turns announcements of what the cargo scoop just picked up on or off; the scoop itself is not touched.
command.toggle_discovery_announcements.name=Discovery Announcements On/Off
command.toggle_discovery_announcements.description=Turns exploration and discovery-scan announcements on or off.
command.toggle_lights_on_off.name=Lights On/Off
command.toggle_lights_on_off.description=Turns the ship or SRV lights on or off.
command.toggle_mining_announcements.name=Mining Announcements On/Off
command.toggle_mining_announcements.description=Turns prospecting and mining target announcements on or off.
command.toggle_night_vision_on_off.name=Night Vision On/Off
command.toggle_night_vision_on_off.description=Turns night vision on or off, in the ship, the SRV or on foot.
command.toggle_planetary_approach_announcements.name=Planetary Approach Announcements On/Off
command.toggle_planetary_approach_announcements.description=Turns the gravity, atmosphere and temperature briefing given on approach to a planet on or off.
command.toggle_radar_announcements.name=Radar Contact Announcements On/Off
command.toggle_radar_announcements.description=Turns radar contact announcements on or off.
command.toggle_radio.name=Radio Traffic On/Off
command.toggle_radio.description=Turns VEGA's ambient radio chatter between systems on or off.
command.toggle_route_announcements.name=Route Announcements On/Off
command.toggle_route_announcements.description=Turns route and jump announcements on or off.
command.trade_profile_set_budget.name=Trade Profile: Set Starting Budget
command.trade_profile_set_budget.description=Sets the starting budget the trade route search may spend.
command.trade_profile_set_max_distance.name=Trade Profile: Set Max Distance
command.trade_profile_set_max_distance.description=Sets how far from the arrival point, in light seconds, a trade station may be.
command.trade_profile_set_max_stops.name=Trade Profile: Set Max Stops
command.trade_profile_set_max_stops.description=Sets the most stops a trade route may have.
command.trade_profile_toggle_permit_systems.name=Trade Profile: Permit Systems On/Off
command.trade_profile_toggle_permit_systems.description=Allows or forbids permit-locked systems in trade route searches.
command.trade_profile_toggle_planetary_ports.name=Trade Profile: Planetary Ports On/Off
command.trade_profile_toggle_planetary_ports.description=Allows or forbids planetary ports in trade route searches.
command.trade_profile_toggle_prohibited_cargo.name=Trade Profile: Prohibited Cargo On/Off
command.trade_profile_toggle_prohibited_cargo.description=Allows or forbids illegal commodities in trade route searches.
command.trade_profile_toggle_strongholds.name=Trade Profile: Strongholds On/Off
command.trade_profile_toggle_strongholds.description=Allows or forbids powerplay stronghold systems in trade route searches.
command.transfer_power_to_engines.name=Power to Engines
command.transfer_power_to_engines.description=Puts maximum power pips into engines for speed and boost.
command.transfer_power_to_shields.name=Power to Shields
command.transfer_power_to_shields.description=Puts maximum power pips into systems, which strengthens the shields.
command.transfer_power_to_ship_systems.name=Power to Systems
command.transfer_power_to_ship_systems.description=Puts maximum power pips into systems; the same as power to shields.
command.transfer_power_to_weapons.name=Power to Weapons
command.transfer_power_to_weapons.description=Puts maximum power pips into weapons.
command.wakeup.name=Wake Up
command.wakeup.description=Wakes VEGA so it listens to voice commands again.
command.wing_nav_lock.name=Wing Nav Lock
command.wing_nav_lock.description=Locks onto a wingmate's frame shift drive to follow them into supercruise and jumps.
query.query_bio_scans_and_samples_in_star_system.name=Bio Scans in System
query.query_bio_scans_and_samples_in_star_system.description=Reports biological scanning progress across this system: which bodies carry bio signals and which still need scanning.
query.query_biome_analysis.name=Biome Analysis
query.query_biome_analysis.description=Analyses a planet's biome, or every bio-signal planet in the system, and predicts which organisms are likely there.
query.query_cargo_hold_contents.name=Cargo Hold Contents
query.query_cargo_hold_contents.description=Reports what is in the cargo hold and the total cargo capacity.
query.query_carrier_departure_eta.name=Fleet Carrier Jump ETA
query.query_carrier_departure_eta.description=Reports how long until the carrier's next scheduled jump.
query.query_carrier_status.name=Fleet Carrier Status
query.query_carrier_status.description=Reports a carrier's tritium supply and reserve, jump range and finances - your own, or the squadron's when you say so.
query.query_carrier_voyage.name=Fleet Carrier Route Progress
query.query_carrier_voyage.description=Analyses the route a carrier already has: destination, jumps left, travel time, tritium needed and where it can refuel on the way.
query.query_carriers.name=Fleet Carriers in System
query.query_carriers.description=Reports the fleet carriers in this system: how many, their names, and their markets and services.
query.query_construction_site_progress.name=Construction Site Progress
query.query_construction_site_progress.description=Reports how far your construction site has come: what it still needs, how many tonnes of each, and what you already carry for it.
query.query_current_location.name=Current Location
query.query_current_location.description=Reports where you are and what it is like: system, body, docked or landed, security, factions, gravity, atmosphere and temperature.
query.query_distance_to_bio_sample.name=Distance to Last Bio Sample
query.query_distance_to_bio_sample.description=Reports how far you are from the last biological sample, to keep the spacing between samples.
query.query_distance_to_body.name=Distance to Body
query.query_distance_to_body.description=Reports the distance in light seconds to a body or station you name in this system.
query.query_distance_to_bubble_earth_sol_civilization.name=Distance to the Bubble
query.query_distance_to_bubble_earth_sol_civilization.description=Reports how far you are from inhabited space: the Bubble around Sol.
query.query_distance_to_carrier.name=Distance to Fleet Carrier
query.query_distance_to_carrier.description=Reports how far you are from your own fleet carrier.
query.query_exobiology_samples.name=Exobiology on This Planet
query.query_exobiology_samples.description=Reports the organic scans on this planet: which species are sampled and what is left to scan.
query.query_exploration_profits.name=Exploration Profits
query.query_exploration_profits.description=Reports exobiology earnings: credits earned this session against what the system could still pay if every species were scanned.
query.query_fsd_target.name=FSD Target
query.query_fsd_target.description=Reports on the targeted jump destination: the star, its class, and whether it can be fuel-scooped.
query.query_general_conversation.name=General Conversation
query.query_general_conversation.description=Plain conversation with VEGA, for anything that is not a command or a question about the game.
query.query_geo_signals.name=Geological Signals
query.query_geo_signals.description=Reports the geological and volcanic sites detected on bodies in this system.
query.query_last_scan.name=Last Scan
query.query_last_scan.description=Reports the body you scanned most recently and its details.
query.query_local_outfitting.name=Local Outfitting
query.query_local_outfitting.description=Reports the modules for sale at this station's outfitting.
query.query_markets.name=Local Markets
query.query_markets.description=Lists the stations and settlements in this system and which have a market, shipyard or outfitting; it does not give prices.
query.query_material_inventory.name=Material Inventory
query.query_material_inventory.description=Reports how much of an engineering material or commodity you hold.
query.query_missions_and_rewards.name=Missions and Rewards
query.query_missions_and_rewards.description=Reports your active missions: faction, objective, destination, reward and expiry, optionally for one system.
query.query_pirate_mission.name=Massacre Mission Progress
query.query_pirate_mission.description=Reports massacre mission progress: kills left per faction and in total, and the combined reward.
query.query_planet_materials.name=Materials on Planet
query.query_planet_materials.description=Reports the raw materials on the current or targeted planet and their percentages.
query.query_player_profile_rank_progress.name=Rank Progress
query.query_player_profile_rank_progress.description=Reports your ranks and how close you are to the next one in each.
query.query_population.name=Population
query.query_population.description=Reports how many people live where you are: the system, or an estimate for the station or planet.
query.query_reminder.name=Reminder
query.query_reminder.description=Reports your active reminder: the errand you saved - where to go, what to buy or pick up, where to sell it.
query.query_ship_loadout.name=Ship Loadout
query.query_ship_loadout.description=Reports the ship's installed modules and weapons, or whether a given module is on board.
query.query_ship_route_remaining_jumps.name=Plotted Route
query.query_ship_route_remaining_jumps.description=Reports your plotted ship route: next waypoint, jumps left, distance to go, and whether the next star can be scooped.
query.query_signals_in_star_system.name=Signals in System
query.query_signals_in_star_system.description=Reports notable signals in this system: resource extraction sites, conflict zones, mining hotspots and surface signal counts.
query.query_station_details.name=Station Details
query.query_station_details.description=Reports the services at the station you are at, or whether a given service is offered.
query.query_stations.name=Stations in System
query.query_stations.description=Reports the stations, outposts and settlements you can dock at in this system.
query.query_stellar_objects.name=Bodies in System
query.query_stellar_objects.description=Lists the bodies in this system - which are landable, their type, gravity, atmosphere, rings and signals - or details of one you name.
query.query_system_security.name=System Security
query.query_system_security.description=Reports this system's security level, controlling faction, allegiance and powerplay control.
query.query_time.name=Current Time
query.query_time.description=Reports the current real-world UTC time and the in-game galactic time.
query.query_total_bounties.name=Bounties Collected
query.query_total_bounties.description=Reports the bounty vouchers you have collected this session.
query.query_trade_profile.name=Trade Profile
query.query_trade_profile.description=Reports the trade route search settings: budget, stops, distance, and which kinds of systems and cargo are allowed.
query.query_trade_route.name=Current Trade Route
query.query_trade_route.description=Reports the planned trade route: its stops, what to buy and sell, and the expected profit.
query.query_vega_self_diagnostic.name=VEGA Self-Diagnostic
query.query_vega_self_diagnostic.description=Tests the connection to the AI model and reports whether it answers and how quickly.

# FrameShift Command integration (integration socket)
command.frameshift_open_page.name=Open FrameShift Page
command.frameshift_open_page.description=Opens a page in the FrameShift Command app, while it is running and connected to Elite Intel.
