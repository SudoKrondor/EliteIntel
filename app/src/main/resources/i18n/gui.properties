# Preset Editor (P4)
bindings.tab.presetEditor=Preset Editor
bindings.presetEditor.title=Active preset configuration
bindings.presetEditor.intro=The game reads four sections of controls separately, and each loads the binds file its line names. Point each at a binds file, or set them all to the same one. The lists show BindNames, not file names: Custom.4.2.binds appears as Custom. Changes are written when you press APPLY above.\n\nVEGA reads the keys it presses from one binds file only. When these four sections use different binds files, a control on another file can have other keys, and VEGA will press the wrong keys in the game. Set all four to the same file - you have been warned.
