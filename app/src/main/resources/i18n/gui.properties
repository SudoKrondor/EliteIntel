# HUD overlay cards. Row labels are drawn in a fixed-width column - on a progress row the bar
# starts at a fixed offset and nothing wraps or clips - so keep these about as short as the
# English and abbreviate rather than let a label read as a sentence.
# Never use "|" in these values. It is variant syntax, picked at random on every lookup, and a card
# is re-derived once a second, so a variant here would redraw and flicker the card forever.
