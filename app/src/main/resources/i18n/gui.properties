# Game clock disagreement dialog (GameClockWarning)
gameClock.dialog.title=Game and PC clocks disagree
gameClock.dialog.body=Elite Dangerous and your PC disagree about the current time by {0}.
gameClock.dialog.cause.timeZone=This often happens after a Windows update changes the time zone or the daylight saving setting.
gameClock.dialog.cause.drift=Most likely the PC clock has drifted, because Windows checks it against the correct time only now and then.
gameClock.dialog.amount.hours={0,choice,1#1 hour|1<{0} hours}
gameClock.dialog.amount.minutes={0,choice,1#about 1 minute|1<about {0} minutes}
gameClock.dialog.consequences=EliteIntel makes up for the difference, but not at every moment. Until the clock is fixed, expect:\n  - game events missed in the first moments after EliteIntel starts\n  - game events missed for a while after the PC clock changes\nOther Elite Dangerous tools on this PC may not make up for it at all.
gameClock.dialog.fix.timeZone=To fix it:\n  1. Open Windows Settings > Time & language > Date & time.\n  2. Choose your correct time zone.\n  3. Turn on "Set time automatically" and "Adjust for daylight saving time automatically".\n  4. Press "Sync now".\n  5. Restart Elite Dangerous.
gameClock.dialog.fix.sync=To fix it:\n  1. Open Windows Settings > Time & language > Date & time.\n  2. Turn on "Set time automatically".\n  3. Press "Sync now".\n  4. Restart Elite Dangerous.
gameClock.dialog.check=To check: the clock on the game HUD and the clock on the EliteIntel front tab should show the same time.

