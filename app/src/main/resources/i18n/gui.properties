speech.bindingReservedGameMenu=Commander, your game menu is on {1}. Elite opens that menu on any combination ending in {1}, so {0,choice,1#the control on {2} cannot be pressed|1<the {0} controls on {2} cannot be pressed} without dropping you into the options screen. The fix is one change: clear the game menu binding in the game options under Controls. Escape opens that menu anyway. The exact bindings are in the system readout.
speech.bindingReservedOsChord=Commander, {0,choice,1#a control is|1<{0} controls are} bound to a key combination your operating system takes before the game ever sees it - {1}. Pressing it closes the game, or leaves your session entirely. The fix is to bind {0,choice,1#that control|1<those controls} to a different key in the game options under Controls. The exact bindings are in the system readout.
