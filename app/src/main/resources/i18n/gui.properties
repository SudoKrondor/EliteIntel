journalImport.title=Import Old Journals
journalImport.intro=Elite Intel learns from your journals as you fly: pirate massacre mission providers, resource extraction sites, the bodies you discovered and mapped, the exobiology you sampled, and the names of new materials and goods. If you kept older journals somewhere else, add the folders or archives here and the app learns from them too. Zip, 7z and tar archives are read, plain or compressed with gzip, bzip2 or xz, and anything that is not a journal is skipped. Every commander found is imported into their own records. Nothing about where you are or what you carry now is changed, and importing the same journals twice does no harm.
