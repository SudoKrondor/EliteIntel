journalImport.title=Importar diarios antiguos
journalImport.intro=Elite Intel aprende de tus diarios mientras vuelas: proveedores de misiones de masacre pirata, zonas de extracción de recursos, los cuerpos que descubriste y cartografiaste, la exobiología que muestreaste y los nombres de nuevos materiales y mercancías. Si guardaste diarios antiguos en otro sitio, añade aquí las carpetas o archivos comprimidos y la aplicación aprenderá también de ellos. Se leen archivos zip, 7z y tar, sin comprimir o comprimidos con gzip, bzip2 o xz, y todo lo que no sea un diario se omite. Cada comandante encontrado se importa en sus propios registros. No cambia nada de dónde estás ni de lo que llevas ahora, e importar los mismos diarios dos veces no causa ningún daño.
