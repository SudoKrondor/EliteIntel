bindings.tab.presetEditor=Editor de presets
bindings.presetEditor.title=Configuración de preset activa
bindings.presetEditor.intro=El juego lee cuatro secciones de controles por separado, y cada una carga el archivo binds que nombra su línea. Apunta cada una a un archivo binds, o ponlas todas en el mismo. Las listas muestran BindNames, no nombres de archivo: Custom.4.2.binds aparece como Custom. Los cambios se escriben al pulsar APPLY arriba.\n\nVEGA lee las teclas que pulsa de un solo archivo binds. Si estas cuatro secciones usan archivos binds distintos, un control de otro archivo puede tener otras teclas, y VEGA pulsará las teclas equivocadas en el juego. Pon las cuatro en el mismo archivo: quedas advertido.
