query.query_geo_signals.name=Señales geológicas
query.query_geo_signals.description=Informa de los sitios geológicos y volcánicos detectados en los cuerpos del sistema.
query.query_last_scan.name=Último escaneo
query.query_last_scan.description=Informa del último cuerpo celeste escaneado y sus detalles.
query.query_local_outfitting.name=Equipamiento local
query.query_local_outfitting.description=Informa de los módulos a la venta en el equipamiento de esta estación.
query.query_markets.name=Mercados locales
query.query_markets.description=Enumera las estaciones y asentamientos del sistema y cuáles tienen mercado, astillero o equipamiento; no da precios.
query.query_material_inventory.name=Inventario de materiales
query.query_material_inventory.description=Informa de cuánto tiene de un material de ingeniería o una mercancía.
query.query_missions_and_rewards.name=Misiones y recompensas
query.query_missions_and_rewards.description=Informa de sus misiones activas: facción, objetivo, destino, recompensa y vencimiento, opcionalmente para un sistema.
query.query_pirate_mission.name=Progreso de la misión de masacre
query.query_pirate_mission.description=Informa del progreso de las misiones de masacre: bajas restantes por facción y en total, y la recompensa combinada.
query.query_planet_materials.name=Materiales del planeta
query.query_planet_materials.description=Informa de las materias primas del planeta actual o fijado y sus porcentajes.
query.query_player_profile_rank_progress.name=Progreso de rangos
query.query_player_profile_rank_progress.description=Informa de sus rangos y de cuánto le falta para el siguiente en cada uno.
query.query_population.name=Población
query.query_population.description=Informa de cuánta gente vive donde está: el sistema, o una estimación para la estación o el planeta.
query.query_reminder.name=Recordatorio
query.query_reminder.description=Informa de su recordatorio activo: el encargo guardado - adónde ir, qué comprar o recoger y dónde venderlo.
query.query_ship_loadout.name=Equipamiento de la nave
query.query_ship_loadout.description=Informa de los módulos y armas instalados en la nave, o de si un módulo concreto está a bordo.
query.query_ship_route_remaining_jumps.name=Ruta trazada
query.query_ship_route_remaining_jumps.description=Informa de la ruta trazada de la nave: siguiente punto, saltos restantes, distancia que falta y si la siguiente estrella permite recoger combustible.
query.query_signals_in_star_system.name=Señales del sistema
query.query_signals_in_star_system.description=Informa de las señales destacadas del sistema: zonas de extracción, zonas de conflicto, puntos calientes de minería y señales de superficie.
query.query_station_details.name=Detalles de la estación
query.query_station_details.description=Informa de los servicios de la estación en la que está, o de si se ofrece un servicio concreto.
query.query_stations.name=Estaciones del sistema
query.query_stations.description=Informa de las estaciones, puestos avanzados y asentamientos donde puede atracar en el sistema.
query.query_stellar_objects.name=Cuerpos celestes del sistema
query.query_stellar_objects.description=Enumera los cuerpos del sistema - cuáles admiten aterrizaje, tipo, gravedad, atmósfera, anillos y señales - o detalla el que nombre.
query.query_system_security.name=Seguridad del sistema
query.query_system_security.description=Informa del nivel de seguridad del sistema, la facción que lo controla, su lealtad y el control de Powerplay.
query.query_time.name=Hora actual
query.query_time.description=Informa de la hora UTC real y de la hora galáctica del juego.
query.query_total_bounties.name=Recompensas obtenidas
query.query_total_bounties.description=Informa de los vales de recompensa obtenidos en esta sesión.
query.query_trade_profile.name=Perfil comercial
query.query_trade_profile.description=Informa de los ajustes de búsqueda de rutas comerciales: presupuesto, paradas, distancia y qué sistemas y cargas se permiten.
query.query_trade_route.name=Ruta comercial actual
query.query_trade_route.description=Informa de la ruta comercial planificada: paradas, qué comprar y vender y el beneficio esperado.
query.query_vega_self_diagnostic.name=Autodiagnóstico de VEGA
query.query_vega_self_diagnostic.description=Prueba la conexión con el modelo de IA e informa de si responde y con qué rapidez.
