# Game clock disagreement dialog (GameClockWarning)
gameClock.dialog.title=Los relojes del juego y del PC no coinciden
gameClock.dialog.body=Elite Dangerous y tu PC no coinciden en la hora actual: hay una diferencia de {0}.
gameClock.dialog.cause.timeZone=Suele ocurrir después de que una actualización de Windows cambie la zona horaria o el ajuste del horario de verano.
gameClock.dialog.cause.drift=Lo más probable es que el reloj del PC se haya desviado, porque Windows solo lo compara con la hora correcta de vez en cuando.
gameClock.dialog.amount.hours={0,choice,1#1 hora|1<{0} horas}
gameClock.dialog.amount.minutes={0,choice,1#aproximadamente 1 minuto|1<aproximadamente {0} minutos}
gameClock.dialog.consequences=EliteIntel compensa la diferencia, pero no en todo momento. Hasta que se corrija el reloj, puedes esperar:\n  - eventos del juego que se pierden en los primeros momentos tras iniciar EliteIntel\n  - eventos del juego que se pierden durante un rato después de que cambie el reloj del PC\nEs posible que otras herramientas de Elite Dangerous en este PC no lo compensen en absoluto.
gameClock.dialog.fix.timeZone=Para solucionarlo:\n  1. Abre Configuración de Windows > Hora e idioma > Fecha y hora.\n  2. Elige tu zona horaria correcta.\n  3. Activa "Establecer la hora automáticamente" y "Ajustar automáticamente el horario de verano".\n  4. Pulsa "Sincronizar ahora".\n  5. Reinicia Elite Dangerous.
gameClock.dialog.fix.sync=Para solucionarlo:\n  1. Abre Configuración de Windows > Hora e idioma > Fecha y hora.\n  2. Activa "Establecer la hora automáticamente".\n  3. Pulsa "Sincronizar ahora".\n  4. Reinicia Elite Dangerous.
gameClock.dialog.check=Para comprobarlo: el reloj del HUD del juego y el reloj de la pestaña principal de EliteIntel deberían mostrar la misma hora.

