speech.bindingConflictsBlocking=Comandante, conflicto crítico de controles. El movimiento del mapa galáctico y la navegación de la interfaz están en {0,choice,1#la misma tecla|1<las mismas teclas} - {1}. El trazado de rutas no puede funcionar hasta que el mapa y la interfaz tengan teclas distintas. Las teclas exactas están en BindForge, luego Editor de bindings, luego Anomalías.
speech.bindingGeneralPresetNotRead=Comandante, sus controles generales usan el perfil {0}, que no tiene archivo guardado, así que estoy leyendo {1} en su lugar. Las teclas que pulso para el mapa galáctico y la interfaz pueden no ser las que usa el juego, y el trazado de rutas puede fallar. Para solucionarlo, abra Opciones y luego Controles en el juego, y ponga los controles generales en {1}.
speech.bindingSectionsNotRead=Comandante, estos controles usan un perfil distinto de {1}, el que estoy leyendo: {0}. Las teclas que pulso para ellos pueden no ser las que usa el juego. Para solucionarlo, abra Opciones y luego Controles en el juego, y póngalos en {1}. O abra la pestaña BindForge para elegir qué archivo leo.
speech.bindingReservedGameMenu=Comandante, su menú del juego está en {1}. Elite abre ese menú con cualquier combinación que termine en {1}, así que {0,choice,1#el control en {2} no se puede pulsar|1<los {0} controles en {2} no se pueden pulsar} sin sacarle a la pantalla de opciones. La solución es un solo cambio: borre la asignación del menú del juego en las opciones del juego, en Controles. Escape ya lo abre de todos modos. Las teclas exactas están en la lectura del sistema.
speech.bindingReservedOsChord=Comandante, {0,choice,1#un control usa|1<{0} controles usan} una combinación de teclas que su sistema operativo intercepta antes de que el juego llegue a verla - {1}. Pulsarla cierra el juego, o abandona su sesión por completo. La solución es asignar {0,choice,1#ese control|1<esos controles} a otra tecla en las opciones del juego, en Controles. Las teclas exactas están en la lectura del sistema.
