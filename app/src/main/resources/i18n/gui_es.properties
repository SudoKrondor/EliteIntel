speech.setup.noLlmProvider=Atención, comandante. Tiene configurado un modelo de lenguaje en la nube, pero no hay ningún proveedor seleccionado, así que no puedo responderle. Abra la pestaña Servicios de IA, elija su proveedor de la lista y guarde.
speech.setup.noJournals=Atención, comandante. No encuentro ningún archivo de diario de Elite Dangerous donde estoy buscando. Hasta que la carpeta de diarios esté bien configurada, estoy ciego a todo lo que ocurre alrededor de su nave. Puede configurarla en la pestaña Comandante.
speech.setup.noBindings=Atención, comandante. No encuentro ninguna asignación de controles donde estoy buscando. Hasta que la carpeta de asignaciones esté bien configurada, no puedo pilotar su nave. Puede configurarla en la pestaña BindForge.
speech.setup.noBindingsYet=Comandante, sus archivos de configuración de controles aún no se han creado. Complete su entrenamiento de comandante y luego, en Opciones, Controles, asigne el movimiento de la interfaz del mapa galáctico a las teclas de flecha y aplique los cambios. Cuando lo haga, podré leer sus controles. Hasta entonces no puedo pilotar su nave.
