# Display names and descriptions of the built-in commands and queries (Actions > Built-in Commands, details dialog).
# CommandCatalog reads command.<id>.name/.description and query.<id>.name/.description - every registered id needs both in every bundle.
command.activate_ui_control.name=Activar elemento de la interfaz
command.activate_ui_control.description=Pulsa la tecla de selección del juego sobre el control que tiene el foco.
command.add_mining_target.name=Añadir objetivo de minería
command.add_mining_target.description=Añade una mercancía minable, como platino o painita, a la lista de prospección, para que VEGA la anuncie cuando un prospector la encuentre.
command.allow_star_system_in_searches_again.name=Volver a permitir el sistema en búsquedas
command.allow_star_system_in_searches_again.description=Vuelve a permitir que el sistema estelar actual aparezca en las búsquedas después de haberlo excluido.
command.bookmark_current_location.name=Guardar ubicación actual en marcadores
command.bookmark_current_location.description=Guarda su ubicación actual (sistema, estación, planeta o punto de la superficie) como marcador para volver más tarde.
command.calculate_fleet_carrier_route.name=Calcular ruta del Fleet Carrier
command.calculate_fleet_carrier_route.description=Traza una nueva ruta de varios saltos para su Fleet Carrier hasta el sistema copiado en el portapapeles y sustituye la ruta ya trazada.
command.calculate_neutron_star_route.name=Calcular ruta de estrellas de neutrones
command.calculate_neutron_star_route.description=Traza una ruta impulsada por estrellas de neutrones hasta el sistema copiado del mapa galáctico; puede indicar la eficiencia y pedir sobrecarga.
command.calculate_trade_route.name=Calcular ruta comercial
command.calculate_trade_route.description=Calcula una ruta comercial rentable de varias paradas a partir de su perfil comercial guardado: presupuesto, capacidad de carga, paradas y distancia.
command.cancel_navigation.name=Cancelar navegación
command.cancel_navigation.description=Desactiva la guía de navegación o de objetivo en superficie activa.
command.cancel_trade_route.name=Cancelar ruta comercial
command.cancel_trade_route.description=Borra la ruta comercial planificada actualmente.
command.clear_active_missions.name=Borrar misiones activas
command.clear_active_missions.description=Vacía la lista de misiones que sigue la aplicación; las misiones siguen activas en el juego.
command.clear_fleet_carrier_route.name=Borrar ruta del Fleet Carrier
command.clear_fleet_carrier_route.description=Abandona la ruta trazada del Fleet Carrier: no quedan tramos, destino ni cuenta atrás de salto.
command.clear_mining_targets.name=Borrar objetivos de minería
command.clear_mining_targets.description=Quita todas las mercancías de la lista de prospección.
command.clear_neutron_route.name=Borrar ruta de neutrones
command.clear_neutron_route.description=Elimina los puntos de paso guardados de la ruta de neutrones.
command.clear_reminders.name=Borrar recordatorios
command.clear_reminders.description=Elimina todos los recordatorios: el encargo guardado, los recordatorios temporizados, el consejo comercial de la ruta y el último resultado de búsqueda de mercancía.
command.close_location_bookmarks.name=Cerrar marcadores
command.close_location_bookmarks.description=Cierra la lista de marcadores de la superposición del HUD.
command.cycle_next_page.name=Página siguiente
command.cycle_next_page.description=Pasa a la página siguiente del panel del juego abierto.
command.cycle_next_panel.name=Pestaña siguiente
command.cycle_next_panel.description=Pasa a la pestaña siguiente del panel del juego abierto.
command.cycle_previous_page.name=Página anterior
command.cycle_previous_page.description=Vuelve a la página anterior del panel del juego abierto.
command.cycle_previous_panel.name=Pestaña anterior
command.cycle_previous_panel.description=Vuelve a la pestaña anterior del panel del juego abierto.
command.decrease_speed.name=Reducir velocidad
command.decrease_speed.description=Reduce el acelerador el número de muescas indicado.
command.delete_codex_entry.name=Eliminar entrada del Códice
command.delete_codex_entry.description=Elimina la entrada del Códice o de muestra biológica seguida y deja de guiar hacia ella.
command.delete_location_bookmark.name=Eliminar marcador
command.delete_location_bookmark.description=Elimina el marcador con el número indicado en la lista de marcadores.
command.deploy_chaff.name=Desplegar chaff
command.deploy_chaff.description=Lanza chaff para romper el fijado de misiles y armas con cardán.
command.deploy_fighter.name=Desplegar caza
command.deploy_fighter.description=Lanza un caza desde el hangar mientras pilota la nave principal.
command.deploy_hardpoints.name=Desplegar armas
command.deploy_hardpoints.description=Despliega los anclajes: no solo las armas, también los láseres de minería, controladores de drones y escáneres los necesitan.
command.deploy_heat_sink.name=Desplegar disipador térmico
command.deploy_heat_sink.description=Lanza un disipador térmico para expulsar calor y enfriar la nave.
command.deploy_landing_gear.name=Bajar tren de aterrizaje
command.deploy_landing_gear.description=Baja el tren de aterrizaje para atracar o aterrizar.
command.deploy_shield_cell.name=Usar célula de escudo
command.deploy_shield_cell.description=Activa una célula de escudo para recargar los escudos.
command.deploy_vehicle_srv.name=Desplegar SRV
command.deploy_vehicle_srv.description=Despliega un SRV del hangar de vehículos; indique el vehículo o el compartimento, si no se usa el 1.
command.disembark.name=Desembarcar
command.disembark.description=Sale de la nave o del SRV para ir a pie.
command.dismiss_construction_site.name=Descartar obra de construcción
command.dismiss_construction_site.description=Deja de seguir la obra en la que atracó por última vez: sale del HUD y VEGA ya no ofrece compras ni navegación para ella.
command.dismiss_ship_to_orbit.name=Despedir la nave
command.dismiss_ship_to_orbit.description=Envía la nave a la órbita mientras está en el SRV o a pie.
command.display_fleet_carrier_management_panel.name=Gestión del Fleet Carrier
command.display_fleet_carrier_management_panel.description=Abre el panel de gestión del Fleet Carrier.
command.display_open_galaxy_map.name=Abrir mapa galáctico
command.display_open_galaxy_map.description=Abre el mapa galáctico.
command.display_open_system_map.name=Abrir mapa del sistema
command.display_open_system_map.description=Abre el mapa del sistema.
command.display_radar_panel.name=Panel del radar
command.display_radar_panel.description=Abre el panel de radar y sensores.
command.drive_assist.name=Asistencia a la conducción
command.drive_assist.description=Activa o desactiva la asistencia a la conducción del SRV, o la alterna si no se indica.
command.drop_from_super_cruise.name=Salir del supercrucero
command.drop_from_super_cruise.description=Sale del supercrucero al espacio normal.
command.enter_fleet_carrier_destination.name=Introducir destino del Fleet Carrier
command.enter_fleet_carrier_destination.description=Escribe el sistema del siguiente tramo en el campo de navegación del Fleet Carrier y lo confirma; úselo tras calcular la ruta.
command.enter_super_cruise.name=Entrar en supercrucero
command.enter_super_cruise.description=Activa el supercrucero; si ya está activo, fija el siguiente sistema de la ruta y salta.
command.equalize_power.name=Equilibrar energía
command.equalize_power.description=Restablece el distribuidor de energía a puntos equilibrados entre sistemas, motores y armas.
command.exclude_star_system_from_searches.name=Excluir sistema de las búsquedas
command.exclude_star_system_from_searches.description=Excluye un sistema estelar de todas las búsquedas a partir de ahora, cuando una estación indicada allí no existe o no se puede usar.
command.exit_close.name=Cerrar panel o mapa
command.exit_close.description=Cierra el panel, menú o mapa abierto, o retrocede.
command.fighter_attack_target.name=Caza: atacar mi objetivo
command.fighter_attack_target.description=Ordena al caza desplegado atacar su objetivo actual.
command.fighter_defend.name=Caza: defender la nave
command.fighter_defend.description=Ordena al caza desplegado defender su nave.
command.fighter_fire_at_will.name=Caza: fuego a discreción
command.fighter_fire_at_will.description=Ordena al caza desplegado atacar objetivos libremente.
command.fighter_hold_fire.name=Caza: alto el fuego
command.fighter_hold_fire.description=Ordena al caza desplegado no disparar.
command.fighter_return_to_ship.name=Caza: volver a la nave
command.fighter_return_to_ship.description=Ordena al caza desplegado volver y atracar en su nave.
command.find_bounty_hunting_ground.name=Buscar zona de caza de recompensas
command.find_bounty_hunting_ground.description=Traza una ruta a un sistema con zonas de extracción de recursos para cazar recompensas, elegido entre los sistemas ya visitados dentro del alcance indicado.
command.find_commodity.name=Buscar mercancía para comprar
command.find_commodity.description=Busca dónde comprar una mercancía o un módulo dentro de la distancia indicada y traza la ruta, al mercado más cercano o al mejor precio.
command.find_conflict_zone_for_combat_bonds.name=Buscar zona de conflicto
command.find_conflict_zone_for_combat_bonds.description=Traza una ruta a un sistema con zonas de conflicto activas para luchar por una facción y ganar bonos de combate, entre las guerras vistas la última semana dentro del alcance indicado.
command.find_construction_site_commodity.name=Buscar mercancía para la construcción
command.find_construction_site_commodity.description=Busca dónde comprar lo que más necesita aún su obra y traza la ruta a ese mercado; lee la lista de la propia obra, no hace falta nombrar la mercancía.
command.find_encoded_material_trader.name=Buscar comerciante de materiales codificados
command.find_encoded_material_trader.description=Traza una ruta al comerciante de materiales codificados más cercano.
command.find_fuel_station.name=Buscar estación de combustible
command.find_fuel_station.description=Traza una ruta a la estación más cercana donde la nave pueda atracar y repostar, para naves sin colector de combustible.
command.find_guardian_technology_broker.name=Buscar intermediario de tecnología Guardian
command.find_guardian_technology_broker.description=Traza una ruta al intermediario de tecnología Guardian más cercano, que desbloquea módulos y armas Guardian.
command.find_human_technology_broker.name=Buscar intermediario de tecnología humana
command.find_human_technology_broker.description=Traza una ruta al intermediario de tecnología humana más cercano, que desbloquea sus módulos.
command.find_interstellar_factor.name=Buscar Interstellar Factors
command.find_interstellar_factor.description=Traza una ruta al contacto de Interstellar Factors más cercano para pagar recompensas y multas.
command.find_manufactured_material_trader.name=Buscar comerciante de materiales fabricados
command.find_manufactured_material_trader.description=Traza una ruta al comerciante de materiales fabricados más cercano.
command.find_mining_site.name=Buscar zona de minería
command.find_mining_site.description=Traza una ruta al anillo o campo de asteroides prístino más cercano que contenga la mercancía indicada, dentro de la distancia indicada.
command.find_mission_commodity.name=Buscar mercancía de la misión
command.find_mission_commodity.description=Busca dónde comprar la carga que aún necesita una misión activa y traza la ruta; lee el tablón de misiones, no hace falta nombrar la mercancía.
command.find_nearest_fleet_carrier.name=Buscar el Fleet Carrier más cercano
command.find_nearest_fleet_carrier.description=Indica el Fleet Carrier más cercano al alcance que no sea el suyo.
command.find_pirate_massacre_missions.name=Buscar misiones de masacre de piratas
command.find_pirate_massacre_missions.description=Indica dónde acumular misiones de masacre de piratas: un sistema proveedor cuyas facciones apuntan a un sistema con zonas de extracción, dentro del alcance indicado.
command.find_powerplay_conflict_zone_for_merits.name=Buscar zona de conflicto de Powerplay
command.find_powerplay_conflict_zone_for_merits.description=Traza una ruta a una zona de conflicto de Powerplay donde lucha la potencia a la que está jurado, para ganar méritos.
command.find_raw_material_trader.name=Buscar comerciante de materias primas
command.find_raw_material_trader.description=Traza una ruta al comerciante de materias primas más cercano.
command.find_shipyard_selling_ship.name=Buscar astillero que venda una nave
command.find_shipyard_selling_ship.description=Busca un astillero que venda la nave indicada dentro de la distancia indicada y traza la ruta, al más cercano o al más barato.
command.find_vista_genomics.name=Buscar Vista Genomics
command.find_vista_genomics.description=Traza una ruta al Vista Genomics más cercano para vender datos de exobiología.
