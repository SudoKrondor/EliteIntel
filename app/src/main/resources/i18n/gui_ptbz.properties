speech.bindingConflictsBlocking=Comandante, conflito crítico de teclas. O movimento do mapa galáctico e a navegação da interface estão {0,choice,1#na mesma tecla|1<nas mesmas teclas} - {1}. O traçado de rota não vai funcionar até o mapa e a interface terem teclas diferentes. As teclas exatas estão em BindForge, depois Editor de atribuições, depois Anomalias.
speech.bindingGeneralPresetNotRead=Comandante, seus controles gerais usam a predefinição {0}, que não tem arquivo salvo, então estou lendo {1}. As teclas que pressiono para o mapa galáctico e a interface podem não ser as que o jogo usa, e o traçado de rota pode falhar. Para corrigir, abra Opções e depois Controles no jogo, e defina os controles gerais como {1}.
speech.bindingSectionsNotRead=Comandante, estes controles usam uma predefinição diferente de {1}, a que estou lendo: {0}. As teclas que pressiono para eles podem não ser as que o jogo usa. Para corrigir, abra Opções e depois Controles no jogo, e defina-os como {1}. Ou abra a aba BindForge para escolher qual arquivo eu leio.
speech.bindingReservedGameMenu=Comandante, o seu menu do jogo está em {1}. O Elite abre esse menu com qualquer combinação terminada em {1}, então {0,choice,1#um controle está em {2} e não pode ser apertado|1<{0} controles estão em {2} e não podem ser apertados} sem jogar você para a tela de opções. A solução é uma única mudança: apague a atribuição do menu do jogo nas opções do jogo, em Controles. O Escape abre esse menu de qualquer jeito. As teclas exatas estão na leitura do sistema.
speech.bindingReservedOsChord=Comandante, {0,choice,1#um controle usa|1<{0} controles usam} uma combinação de teclas que o seu sistema operacional intercepta antes de o jogo sequer ver - {1}. Apertar ela fecha o jogo, ou abandona por completo a sua sessão. A solução é atribuir {0,choice,1#esse controle|1<esses controles} a outra tecla nas opções do jogo, em Controles. As teclas exatas estão na leitura do sistema.
