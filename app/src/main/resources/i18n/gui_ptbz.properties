# Game clock disagreement dialog (GameClockWarning)
gameClock.dialog.title=Os relógios do jogo e do PC não batem
gameClock.dialog.body=O Elite Dangerous e o seu PC não concordam sobre a hora atual: a diferença é de {0}.
gameClock.dialog.cause.timeZone=Isso costuma acontecer depois que uma atualização do Windows muda o fuso horário ou a configuração do horário de verão.
gameClock.dialog.cause.drift=O mais provável é que o relógio do PC tenha adiantado ou atrasado, porque o Windows só o compara com a hora certa de vez em quando.
gameClock.dialog.amount.hours={0,choice,1#1 hora|1<{0} horas}
gameClock.dialog.amount.minutes={0,choice,1#cerca de 1 minuto|1<cerca de {0} minutos}
gameClock.dialog.consequences=O EliteIntel compensa a diferença, mas não em todos os momentos. Até o relógio ser corrigido, espere:\n  - eventos do jogo perdidos nos primeiros momentos depois que o EliteIntel inicia\n  - eventos do jogo perdidos por um tempo depois que o relógio do PC muda\nOutras ferramentas do Elite Dangerous neste PC podem não compensar isso de forma alguma.
gameClock.dialog.fix.timeZone=Para corrigir:\n  1. Abra Configurações do Windows > Hora e idioma > Data e hora.\n  2. Escolha o fuso horário correto.\n  3. Ative "Definir horário automaticamente" e "Ajustar automaticamente para o horário de verão".\n  4. Clique em "Sincronizar agora".\n  5. Reinicie o Elite Dangerous.
gameClock.dialog.fix.sync=Para corrigir:\n  1. Abra Configurações do Windows > Hora e idioma > Data e hora.\n  2. Ative "Definir horário automaticamente".\n  3. Clique em "Sincronizar agora".\n  4. Reinicie o Elite Dangerous.
gameClock.dialog.check=Para conferir: o relógio no HUD do jogo e o relógio na aba principal do EliteIntel devem mostrar a mesma hora.

