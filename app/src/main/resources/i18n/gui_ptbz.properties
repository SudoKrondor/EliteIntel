# Display names and descriptions of the built-in commands and queries (Actions > Built-in Commands, details dialog).
# CommandCatalog reads command.<id>.name/.description and query.<id>.name/.description - every registered id needs both in every bundle.
command.activate_ui_control.name=Ativar elemento da interface
command.activate_ui_control.description=Pressiona a tecla de seleção do jogo no controle que está em foco.
command.add_mining_target.name=Adicionar alvo de mineração
command.add_mining_target.description=Adiciona uma mercadoria minerável, como platina ou painite, à lista de prospecção, para que a VEGA a anuncie quando um prospector a encontrar.
command.allow_star_system_in_searches_again.name=Voltar a permitir o sistema nas buscas
command.allow_star_system_in_searches_again.description=Volta a deixar o sistema estelar atual aparecer nas buscas depois de ter sido excluído.
command.bookmark_current_location.name=Salvar local atual nos marcadores
command.bookmark_current_location.description=Salva o local atual (sistema, estação, planeta ou ponto na superfície) como marcador para voltar mais tarde.
command.calculate_fleet_carrier_route.name=Calcular rota do Fleet Carrier
command.calculate_fleet_carrier_route.description=Traça uma nova rota de vários saltos para o seu Fleet Carrier até o sistema copiado para a área de transferência, substituindo a rota já traçada.
command.calculate_neutron_star_route.name=Calcular rota por estrelas de nêutrons
command.calculate_neutron_star_route.description=Traça uma rota impulsionada por estrelas de nêutrons até o sistema copiado do mapa da galáxia; você pode indicar a eficiência e pedir sobrecarga.
command.calculate_trade_route.name=Calcular rota comercial
command.calculate_trade_route.description=Calcula uma rota comercial lucrativa com várias paradas a partir do perfil comercial salvo: orçamento, capacidade de carga, paradas e distância.
command.cancel_navigation.name=Cancelar navegação
command.cancel_navigation.description=Desliga a orientação de navegação ou de alvo na superfície em andamento.
command.cancel_trade_route.name=Cancelar rota comercial
command.cancel_trade_route.description=Apaga a rota comercial atualmente planejada.
command.clear_active_missions.name=Limpar missões ativas
command.clear_active_missions.description=Limpa a lista de missões acompanhadas pelo aplicativo; as missões continuam ativas no jogo.
command.clear_fleet_carrier_route.name=Limpar rota do Fleet Carrier
command.clear_fleet_carrier_route.description=Abandona a rota traçada do Fleet Carrier: não ficam etapas, destino nem contagem regressiva de salto.
command.clear_mining_targets.name=Limpar alvos de mineração
command.clear_mining_targets.description=Remove todas as mercadorias da lista de prospecção.
command.clear_neutron_route.name=Limpar rota de nêutrons
command.clear_neutron_route.description=Exclui os pontos de passagem salvos da rota de nêutrons.
command.clear_reminders.name=Limpar lembretes
command.clear_reminders.description=Exclui todos os lembretes: a tarefa salva, os lembretes temporizados, a dica comercial da rota e o último resultado de busca de mercadorias.
command.close_location_bookmarks.name=Fechar marcadores
command.close_location_bookmarks.description=Fecha a lista de marcadores na sobreposição do HUD.
command.cycle_next_page.name=Próxima página
command.cycle_next_page.description=Passa para a próxima página do painel do jogo aberto.
command.cycle_next_panel.name=Próxima aba
command.cycle_next_panel.description=Passa para a próxima aba do painel do jogo aberto.
command.cycle_previous_page.name=Página anterior
command.cycle_previous_page.description=Volta para a página anterior do painel do jogo aberto.
command.cycle_previous_panel.name=Aba anterior
command.cycle_previous_panel.description=Volta para a aba anterior do painel do jogo aberto.
command.decrease_speed.name=Reduzir velocidade
command.decrease_speed.description=Reduz a aceleração no número de níveis indicado.
command.delete_codex_entry.name=Excluir entrada do Codex
command.delete_codex_entry.description=Exclui a entrada do Codex ou de amostra biológica acompanhada e para de guiar até ela.
command.delete_location_bookmark.name=Excluir marcador
command.delete_location_bookmark.description=Exclui o marcador com o número indicado na lista de marcadores.
command.deploy_chaff.name=Lançar chaff
command.deploy_chaff.description=Lança chaff para quebrar a mira de mísseis e de armas com cardã.
command.deploy_fighter.name=Lançar caça
command.deploy_fighter.description=Lança um caça a partir do hangar enquanto você pilota a nave principal.
command.deploy_hardpoints.name=Ativar armamento
command.deploy_hardpoints.description=Ativa os pontos de montagem: armas, mas também lasers de mineração, controladores de drones e scanners precisam deles.
command.deploy_heat_sink.name=Lançar dissipador de calor
command.deploy_heat_sink.description=Lança um dissipador de calor para liberar calor e resfriar a nave.
command.deploy_landing_gear.name=Baixar trem de pouso
command.deploy_landing_gear.description=Baixa o trem de pouso para atracar ou pousar.
command.deploy_shield_cell.name=Usar célula de escudo
command.deploy_shield_cell.description=Ativa uma célula de escudo para recarregar os escudos.
command.deploy_vehicle_srv.name=Lançar SRV
command.deploy_vehicle_srv.description=Lança um SRV do hangar de veículos; indique o veículo ou o compartimento, senão é usado o 1.
command.disembark.name=Desembarcar
command.disembark.description=Sai da nave ou do SRV para seguir a pé.
command.dismiss_construction_site.name=Descartar canteiro de obras
command.dismiss_construction_site.description=Para de acompanhar o último canteiro de obras em que você atracou: ele sai do HUD e a VEGA deixa de oferecer compras ou navegação para ele.
command.dismiss_ship_to_orbit.name=Dispensar a nave
command.dismiss_ship_to_orbit.description=Envia a nave para a órbita enquanto você está no SRV ou a pé.
command.display_fleet_carrier_management_panel.name=Gerenciamento do Fleet Carrier
command.display_fleet_carrier_management_panel.description=Abre o painel de gerenciamento do Fleet Carrier.
command.display_open_galaxy_map.name=Abrir mapa da galáxia
command.display_open_galaxy_map.description=Abre o mapa da galáxia.
command.display_open_system_map.name=Abrir mapa do sistema
command.display_open_system_map.description=Abre o mapa do sistema.
command.display_radar_panel.name=Painel do radar
command.display_radar_panel.description=Abre o painel de radar e sensores.
command.drive_assist.name=Assistência de direção
command.drive_assist.description=Liga ou desliga a assistência de direção do SRV, ou a alterna se nada for indicado.
command.drop_from_super_cruise.name=Sair do supercruise
command.drop_from_super_cruise.description=Sai do supercruise para o espaço normal.
command.enter_fleet_carrier_destination.name=Inserir destino do Fleet Carrier
command.enter_fleet_carrier_destination.description=Digita o sistema da próxima etapa no campo de navegação do Fleet Carrier e o confirma; use depois de calcular a rota.
command.enter_super_cruise.name=Entrar em supercruise
command.enter_super_cruise.description=Ativa o supercruise; se já estiver ativo, mira no próximo sistema da rota e salta.
command.equalize_power.name=Equilibrar energia
command.equalize_power.description=Redefine o distribuidor de energia com pontos equilibrados entre sistemas, motores e armas.
command.exclude_star_system_from_searches.name=Excluir sistema das buscas
command.exclude_star_system_from_searches.description=Exclui um sistema estelar de todas as buscas a partir de agora, quando uma estação indicada lá não existe ou não pode ser usada.
command.exit_close.name=Fechar painel ou mapa
command.exit_close.description=Fecha o painel, menu ou mapa aberto, ou volta.
command.fighter_attack_target.name=Caça: atacar meu alvo
command.fighter_attack_target.description=Ordena ao caça lançado que ataque o seu alvo atual.
command.fighter_defend.name=Caça: defender a nave
command.fighter_defend.description=Ordena ao caça lançado que defenda a sua nave.
command.fighter_fire_at_will.name=Caça: fogo à vontade
command.fighter_fire_at_will.description=Ordena ao caça lançado que ataque alvos livremente.
command.fighter_hold_fire.name=Caça: cessar fogo
command.fighter_hold_fire.description=Ordena ao caça lançado que cesse fogo.
command.fighter_return_to_ship.name=Caça: voltar para a nave
command.fighter_return_to_ship.description=Ordena ao caça lançado que volte e atraque na sua nave.
command.find_bounty_hunting_ground.name=Encontrar zona de caça a recompensas
command.find_bounty_hunting_ground.description=Traça uma rota para um sistema com locais de extração de recursos para caçar recompensas, escolhido entre os sistemas já visitados dentro do alcance indicado.
command.find_commodity.name=Encontrar mercadoria para comprar
command.find_commodity.description=Encontra onde comprar uma mercadoria ou módulo dentro da distância indicada e traça a rota, para o mercado mais próximo ou o melhor preço.
command.find_conflict_zone_for_combat_bonds.name=Encontrar zona de conflito
command.find_conflict_zone_for_combat_bonds.description=Traça uma rota para um sistema com zonas de conflito ativas para lutar por uma facção e ganhar títulos de combate, entre as guerras vistas na última semana dentro do alcance indicado.
command.find_construction_site_commodity.name=Encontrar mercadoria para a construção
command.find_construction_site_commodity.description=Encontra onde comprar o que a sua construção ainda mais precisa e traça a rota até esse mercado; lê a lista da própria obra, sem precisar nomear a mercadoria.
command.find_encoded_material_trader.name=Encontrar comerciante de materiais codificados
command.find_encoded_material_trader.description=Traça uma rota para o comerciante de materiais codificados mais próximo.
command.find_fuel_station.name=Encontrar estação de combustível
command.find_fuel_station.description=Traça uma rota para a estação mais próxima onde a nave pode atracar e reabastecer, para naves sem coletor de combustível.
command.find_guardian_technology_broker.name=Encontrar corretor de tecnologia Guardian
command.find_guardian_technology_broker.description=Traça uma rota para o corretor de tecnologia Guardian mais próximo, que desbloqueia módulos e armas Guardian.
