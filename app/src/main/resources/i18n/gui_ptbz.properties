bindings.tab.presetEditor=Editor de presets
bindings.presetEditor.title=Configuração de preset ativa
bindings.presetEditor.intro=O jogo lê quatro seções de controles separadamente, e cada uma carrega o arquivo binds que sua linha indica. Aponte cada uma para um arquivo binds, ou coloque todas no mesmo. As listas mostram BindNames, não nomes de arquivo: Custom.4.2.binds aparece como Custom. As alterações são gravadas quando você pressiona APPLY acima.\n\nO VEGA lê as teclas que pressiona de um único arquivo binds. Se estas quatro seções usarem arquivos binds diferentes, um controle em outro arquivo pode ter outras teclas, e o VEGA vai pressionar as teclas erradas no jogo. Defina as quatro para o mesmo arquivo: você foi avisado.
