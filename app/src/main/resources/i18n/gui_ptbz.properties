journalImport.title=Importar diários antigos
journalImport.intro=O Elite Intel aprende com seus diários enquanto você voa: fornecedores de missões de massacre de piratas, locais de extração de recursos, os corpos que você descobriu e mapeou, a exobiologia que você coletou e os nomes de novos materiais e mercadorias. Se você guardou diários mais antigos em outro lugar, adicione aqui as pastas ou arquivos e o aplicativo também aprende com eles. São lidos arquivos zip, 7z e tar, sem compressão ou comprimidos com gzip, bzip2 ou xz, e tudo o que não for um diário é ignorado. Cada comandante encontrado é importado para os próprios registros. Nada muda quanto a onde você está ou ao que você carrega agora, e importar os mesmos diários duas vezes não causa problema.
