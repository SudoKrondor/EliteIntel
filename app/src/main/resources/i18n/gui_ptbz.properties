query.query_carrier_voyage.name=Progresso da rota do Fleet Carrier
query.query_carrier_voyage.description=Analisa a rota já traçada de um Fleet Carrier: destino, saltos restantes, tempo de viagem, trítio necessário e onde reabastecer no caminho.
query.query_carriers.name=Fleet Carriers no sistema
query.query_carriers.description=Informa os Fleet Carriers no sistema: quantos são, seus nomes e seus mercados e serviços.
query.query_construction_site_progress.name=Progresso da construção
query.query_construction_site_progress.description=Informa o progresso da sua construção: o que ainda falta, quantas toneladas de cada e o que você já transporta para ela.
query.query_current_location.name=Local atual
query.query_current_location.description=Informa onde você está e como é o local: sistema, corpo, atracado ou pousado, segurança, facções, gravidade, atmosfera e temperatura.
query.query_distance_to_bio_sample.name=Distância até a última amostra biológica
query.query_distance_to_bio_sample.description=Informa a distância até a última amostra biológica, para manter o espaçamento entre amostras.
query.query_distance_to_body.name=Distância até o corpo celeste
query.query_distance_to_body.description=Informa a distância em segundos-luz até um corpo ou estação do sistema que você nomear.
query.query_distance_to_bubble_earth_sol_civilization.name=Distância até a Bolha
query.query_distance_to_bubble_earth_sol_civilization.description=Informa a distância até o espaço habitado, a Bolha ao redor de Sol.
query.query_distance_to_carrier.name=Distância até o Fleet Carrier
query.query_distance_to_carrier.description=Informa a distância até o seu Fleet Carrier.
query.query_exobiology_samples.name=Exobiologia neste planeta
query.query_exobiology_samples.description=Informa as varreduras orgânicas neste planeta: quais espécies foram amostradas e o que falta varrer.
query.query_exploration_profits.name=Lucros de exploração
query.query_exploration_profits.description=Informa os ganhos de exobiologia: créditos obtidos nesta sessão frente ao que o sistema renderia se todas as espécies fossem varridas.
query.query_fsd_target.name=Alvo do FSD
query.query_fsd_target.description=Informa o destino de salto mirado: a estrela, sua classe e se permite coletar combustível.
query.query_general_conversation.name=Conversa geral
query.query_general_conversation.description=Uma conversa simples com a VEGA, para tudo que não seja um comando nem uma pergunta sobre o jogo.
query.query_geo_signals.name=Sinais geológicos
query.query_geo_signals.description=Informa os locais geológicos e vulcânicos detectados nos corpos do sistema.
query.query_last_scan.name=Última varredura
query.query_last_scan.description=Informa o último corpo celeste varrido e seus detalhes.
query.query_local_outfitting.name=Equipamento local
query.query_local_outfitting.description=Informa os módulos à venda no equipamento desta estação.
query.query_markets.name=Mercados locais
query.query_markets.description=Lista as estações e assentamentos do sistema e quais têm mercado, estaleiro ou equipamento; não informa preços.
query.query_material_inventory.name=Inventário de materiais
query.query_material_inventory.description=Informa quanto você tem de um material de engenharia ou mercadoria.
query.query_missions_and_rewards.name=Missões e recompensas
query.query_missions_and_rewards.description=Informa suas missões ativas: facção, objetivo, destino, recompensa e prazo, opcionalmente para um sistema.
query.query_pirate_mission.name=Progresso da missão de massacre
query.query_pirate_mission.description=Informa o progresso das missões de massacre: abates restantes por facção e no total, e a recompensa combinada.
query.query_planet_materials.name=Materiais no planeta
query.query_planet_materials.description=Informa as matérias-primas do planeta atual ou mirado e suas porcentagens.
query.query_player_profile_rank_progress.name=Progresso das patentes
query.query_player_profile_rank_progress.description=Informa suas patentes e quanto falta para a próxima em cada uma.
query.query_population.name=População
query.query_population.description=Informa quantas pessoas vivem onde você está: o sistema, ou uma estimativa para a estação ou o planeta.
query.query_reminder.name=Lembrete
query.query_reminder.description=Informa seu lembrete ativo: a tarefa salva - para onde ir, o que comprar ou pegar, onde vender.
query.query_ship_loadout.name=Configuração da nave
query.query_ship_loadout.description=Informa os módulos e armas instalados na nave, ou se um certo módulo está a bordo.
query.query_ship_route_remaining_jumps.name=Rota traçada
query.query_ship_route_remaining_jumps.description=Informa a rota traçada da nave: próximo ponto, saltos restantes, distância que falta e se a próxima estrela permite coletar combustível.
query.query_signals_in_star_system.name=Sinais no sistema
query.query_signals_in_star_system.description=Informa os sinais relevantes do sistema: locais de extração, zonas de conflito, pontos quentes de mineração e sinais de superfície.
query.query_station_details.name=Detalhes da estação
query.query_station_details.description=Informa os serviços da estação onde você está, ou se um certo serviço é oferecido.
query.query_stations.name=Estações no sistema
query.query_stations.description=Informa as estações, postos avançados e assentamentos do sistema onde você pode atracar.
query.query_stellar_objects.name=Corpos celestes no sistema
query.query_stellar_objects.description=Lista os corpos do sistema - quais permitem pouso, tipo, gravidade, atmosfera, anéis e sinais - ou detalha o que você nomear.
query.query_system_security.name=Segurança do sistema
query.query_system_security.description=Informa o nível de segurança do sistema, a facção que o controla, a lealdade e o controle de Powerplay.
query.query_time.name=Hora atual
query.query_time.description=Informa a hora UTC real e a hora galáctica do jogo.
query.query_total_bounties.name=Recompensas obtidas
query.query_total_bounties.description=Informa os vales de recompensa obtidos nesta sessão.
query.query_trade_profile.name=Perfil comercial
query.query_trade_profile.description=Informa as configurações da busca de rotas comerciais: orçamento, paradas, distância e quais sistemas e cargas são permitidos.
query.query_trade_route.name=Rota comercial atual
query.query_trade_route.description=Informa a rota comercial planejada: paradas, o que comprar e vender e o lucro esperado.
query.query_vega_self_diagnostic.name=Autodiagnóstico da VEGA
query.query_vega_self_diagnostic.description=Testa a conexão com o modelo de IA e informa se ele responde e com que rapidez.
