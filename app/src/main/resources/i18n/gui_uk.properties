gameClock.dialog.consequences=EliteIntel враховує різницю, але не в кожну мить. Доки годинник не виправлено, можливо:\n  - пропуск ігрових подій у перші миті після запуску EliteIntel\n  - пропуск ігрових подій на якийсь час після зміни годинника ПК\nІнші інструменти для Elite Dangerous на цьому ПК можуть зовсім не враховувати різницю.
gameClock.dialog.fix.timeZone=Як виправити:\n  1. Відкрийте Параметри Windows > Час і мова > Дата й час.\n  2. Виберіть правильний часовий пояс.\n  3. Увімкніть «Установлювати час автоматично» та «Автоматично переходити на літній час».\n  4. Натисніть «Синхронізувати».\n  5. Перезапустіть Elite Dangerous.
gameClock.dialog.fix.sync=Як виправити:\n  1. Відкрийте Параметри Windows > Час і мова > Дата й час.\n  2. Увімкніть «Установлювати час автоматично».\n  3. Натисніть «Синхронізувати».\n  4. Перезапустіть Elite Dangerous.
