speech.bindingConflictsBlocking=Командире, критичний конфлікт прив’язок. Керування галактичною картою та навігація інтерфейсом призначені на {0,choice,1#ту саму клавішу|1<ті самі клавіші} - {1}. Прокладання маршруту не працюватиме, поки карта та інтерфейс не матимуть окремих клавіш. Точні прив’язки наведено в системному виводі.
speech.bindingReservedGameMenu=Командире, ваше ігрове меню призначено на {1}. Elite відкриває його за будь-якої комбінації, що закінчується на {1}, тому {0,choice,1#команду на {2} не можна натиснути|1<{0} команд на {2} не можна натиснути}, не опинившись на екрані налаштувань. Рішення одне: видаліть прив’язку ігрового меню в налаштуваннях гри, у розділі керування. Escape відкриває це меню й так. Точні прив’язки наведено в системному виводі.
speech.bindingReservedOsChord=Командире, {0,choice,1#одна команда призначена|1<{0} команд призначено} на комбінацію клавіш, яку ваша операційна система перехоплює раніше за гру - {1}. Натискання закриває гру або взагалі завершує сеанс. Рішення: призначте {0,choice,1#цю команду|1<ці команди} на іншу клавішу в налаштуваннях гри, у розділі керування. Точні прив’язки наведено в системному виводі.
speech.warning.journalDirectoryMissing=Увага. Каталог журналів Elite Dangerous не знайдено. Будь ласка, перевірте каталог журналів у налаштуваннях.
speech.warning.journalFilesMissing=Увага. У вказаному каталозі не знайдено файлів журналу. Будь ласка, перевірте каталог журналів у налаштуваннях.
speech.warning.bindingsDirectoryMissing=Увага. Каталог призначень клавіш не знайдено. Будь ласка, перевірте каталог призначень у налаштуваннях.
speech.warning.bindingsFilesMissing=Увага. У вказаному каталозі не знайдено файлів призначень клавіш. Будь ласка, перевірте каталог призначень у налаштуваннях.
speech.warning.noGameSession=Командире, ігрову сесію не виявлено. Очікування.
speech.warning.journalReadError=Помилка читання журналу: {0}
speech.warning.bindingsDirectoryInaccessible=Помилка. Каталог призначень клавіш недоступний.
speech.warning.bindingsUpdateFailed=Не вдалося оновити призначення клавіш. Будь ласка, перевірте каталог призначень.
speech.warning.uncataloguedMissionDetected={0}, я виявив місію типу {1}, яку ще не занесено до каталогу.
speech.customCommandsLoaded={0}, завантажено власних команд: {1}.
