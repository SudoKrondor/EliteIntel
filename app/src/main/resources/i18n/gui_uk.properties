journalImport.intro=Elite Intel вчиться з ваших журналів, поки ви літаєте: замовники місій на знищення піратів, зони видобутку ресурсів, відкриті й картографовані вами тіла, зібрані зразки екзобіології, назви нових матеріалів і товарів. Якщо старі журнали зберігаються деінде, додайте сюди теки або архіви, і застосунок вивчить і їх. Читаються архіви zip, 7z і tar, як звичайні, так і стиснуті gzip, bzip2 або xz; усе, що не є журналом, пропускається. Кожного знайденого командира імпортовано до власних записів. Ваше поточне місцезнаходження й вантаж не змінюються, а повторний імпорт тих самих журналів нічому не шкодить.
