speech.customCommandsLoadedWithSkipped={0}, завантажено власних команд: {1}, пропущено через помилки: {2}. Дивіться журнал.
speech.customCommandsRestoredFromBackup={0}, файл власних команд пошкоджено; команди завантажено з резервної копії. Дивіться журнал.
speech.keyBindingNotFound=Не знайдено прив''язку клавіші для {0}.
speech.sleepModeOn=Я переходжу в режим сну.
speech.sleepModeOff=Я слухаю.
speech.sleepModeStartupNotice=Командере, я запускаюся в режимі сну й не слухаю голосове введення. Скажіть прокинься або натисніть ПРОКИНУТИСЯ, коли я знадоблюся.
speech.unsupportedLocalModel=Увага, командире. Ваша локальна модель не Gemma 4 E4B, яка потрібна цій версії. Застосунок може працювати некоректно або не працювати зовсім.
speech.missingController=Контролер {0} не під’єднано. Його прив’язки не завантажаться, доки його не під’єднано.
speech.missingControllers=Ці контролери не під’єднано: {0}. Їхні прив’язки не завантажаться, доки їх не під’єднано.
speech.bindforgeBackedUp=BindForge зберіг резервну копію всіх ваших файлів налаштування керування в тому вигляді, в якому вони були до будь-яких змін BindForge.
speech.notOdyssey=Увага, командире. Ваша гра запущена не в Odyssey. Цей застосунок створено для Elite Dangerous Odyssey, і більша його частина не працюватиме в Horizons.
speech.gameClockDisagreement=Увага, командире. Годинник вашого ПК розходиться з грою більш ніж на хвилину. Доки це не виправлено, деякі ігрові події можуть бути пропущені. Подробиці - у застосунку.
speech.setup.noLlm=Мовну модель ще не налаштовано, тож я не можу ні розуміти вас, ні відповідати. Налаштуйте безкоштовний тариф Mistral або локальну модель Gemma 4 E4B, інструкції є на сайті еліт інтел крапка орг.
speech.setup.noLlmProvider=Увага, коммандере. У вас обрано хмарну мовну модель, але не обрано хмарного провайдера, тож я не можу вам відповідати. Відкрийте вкладку Сервіси ШІ в налаштуваннях, оберіть провайдера зі списку та збережіть.
speech.setup.noJournals=Увага, коммандере. Я не знаходжу файлів журналу Elite Dangerous там, де шукаю. Доки теку журналів не вказано правильно, я не бачу нічого, що відбувається навколо вашого корабля. Вказати її можна на вкладці Налаштування.
speech.setup.noBindings=Увага, коммандере. Я не знаходжу файлів прив'язок керування там, де шукаю. Доки теку прив'язок не вказано правильно, я не можу керувати вашим кораблем. Вказати її можна на вкладці Прив'язки.
speech.setup.noSavedBindings=Увага, коммандере. Теку прив'язок вказано правильно, але Elite Dangerous ще не записав до неї файл прив'язок керування. Гра зберігає його лише після того, як ви налаштуєте керування. Відкрийте у грі Налаштування, потім Керування, змініть будь-яку прив'язку, і я її підхоплю. Доти я не можу керувати вашим кораблем.
speech.setup.noBindingsYet=Командире, файли налаштування вашого керування ще не створено. Завершіть навчання командира, потім у Налаштуваннях, Керування, призначте переміщення інтерфейсом галактичної карти на клавіші зі стрілками й застосуйте. Після цього я зможу прочитати ваше керування. А доти я не можу керувати вашим кораблем.
speech.bindforge.changedOutside=Ваші файли керування було змінено поза BindForge. Відкрийте BindForge, щоб перевірити їх.
speech.connectionSuccessful=Підключення успішне.
speech.shipDismissRejected=Не можу виконати. Ви на борту.
