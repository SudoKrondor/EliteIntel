# "stop", "next" and "previous" already belong to the engines and to page/panel cycling,
# and a phrase owned by two actions can never reflex-fire. Shuffle pins a literal state per
# phrase, because a trailing {state:true/false} binds only to the last phrase on the line.
play_music=play music, play the music, start the music, resume the music, music on, put some music on
pause_music_playback=pause the music, pause music, stop the music, stop music, music off, silence the music
skip_to_next_music_track=next track, next song, skip this track, skip this song, skip the track
play_previous_music_track=previous track, previous song, go back a track, previous music track
shuffle_music_tracks=shuffle the music {state:true}, shuffle music {state:true}, play the music at random {state:true}, random music order {state:true}, play the music in order {state:false}, stop shuffling the music {state:false}, music in playlist order {state:false}
play_music_track_by_name=play the track {key:X}, play the song {key:X}, play the music track {key:X}, play me the song {key:X}
