speech.warning.journalFilesMissing=Avviso. Nessun file di diario è stato trovato nella directory configurata. Verifica la directory del diario nella scheda Comandante.
speech.warning.bindingsDirectoryMissing=Avviso. La directory dei key bindings non è stata trovata. Controlla la directory dei bindings nella scheda BindForge.
speech.warning.bindingsFilesMissing=Avviso. Quella cartella non contiene alcun file StartPreset, quindi non è la cartella dei bindings del gioco. Scegli di nuovo la directory dei bindings nella scheda BindForge.
