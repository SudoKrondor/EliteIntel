# Game clock disagreement dialog (GameClockWarning)
gameClock.dialog.title=Gli orologi del gioco e del PC non coincidono
gameClock.dialog.body=Elite Dangerous e il tuo PC non sono d''accordo sull''ora attuale: la differenza è di {0}.
gameClock.dialog.cause.timeZone=Succede spesso dopo un aggiornamento di Windows che cambia il fuso orario o l'impostazione dell'ora legale.
gameClock.dialog.cause.drift=Molto probabilmente l'orologio del PC si è spostato, perché Windows lo confronta con l'ora esatta solo di tanto in tanto.
gameClock.dialog.amount.hours={0,choice,1#1 ora|1<{0} ore}
gameClock.dialog.amount.minutes={0,choice,1#circa 1 minuto|1<circa {0} minuti}
gameClock.dialog.consequences=EliteIntel compensa la differenza, ma non in ogni momento. Finché l'orologio non viene corretto, aspettati:\n  - eventi di gioco persi nei primi istanti dopo l'avvio di EliteIntel\n  - eventi di gioco persi per un po' dopo che l'orologio del PC cambia\nAltri strumenti per Elite Dangerous su questo PC potrebbero non compensarla affatto.
gameClock.dialog.fix.timeZone=Per risolvere:\n  1. Apri Impostazioni di Windows > Data/ora e lingua > Data e ora.\n  2. Scegli il fuso orario corretto.\n  3. Attiva "Imposta ora automaticamente" e "Regola automaticamente l'ora legale".\n  4. Premi "Sincronizza ora".\n  5. Riavvia Elite Dangerous.
gameClock.dialog.fix.sync=Per risolvere:\n  1. Apri Impostazioni di Windows > Data/ora e lingua > Data e ora.\n  2. Attiva "Imposta ora automaticamente".\n  3. Premi "Sincronizza ora".\n  4. Riavvia Elite Dangerous.
gameClock.dialog.check=Per controllare: l'orologio nell'HUD del gioco e quello nella scheda principale di EliteIntel devono mostrare la stessa ora.

