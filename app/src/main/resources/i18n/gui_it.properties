# Display names and descriptions of the built-in commands and queries (Actions > Built-in Commands, details dialog).
# CommandCatalog reads command.<id>.name/.description and query.<id>.name/.description - every registered id needs both in every bundle.
command.activate_ui_control.name=Attiva elemento dell'interfaccia
command.activate_ui_control.description=Preme il tasto di selezione del gioco sul controllo che ha il focus.
command.add_mining_target.name=Aggiungi obiettivo di estrazione
command.add_mining_target.description=Aggiunge una merce estraibile, come platino o painite, all'elenco di prospezione, così VEGA la segnala quando un prospettore la trova.
command.allow_star_system_in_searches_again.name=Consenti di nuovo il sistema nelle ricerche
command.allow_star_system_in_searches_again.description=Consente di nuovo al sistema stellare attuale di comparire nelle ricerche dopo che è stato escluso.
command.bookmark_current_location.name=Salva posizione attuale nei segnalibri
command.bookmark_current_location.description=Salva la tua posizione attuale (sistema, stazione, pianeta o punto in superficie) come segnalibro per tornarci in seguito.
command.calculate_fleet_carrier_route.name=Calcola rotta della Fleet Carrier
command.calculate_fleet_carrier_route.description=Traccia una nuova rotta a più salti per la tua Fleet Carrier verso il sistema copiato negli appunti, sostituendo quella già tracciata.
command.calculate_neutron_star_route.name=Calcola rotta per stelle di neutroni
command.calculate_neutron_star_route.description=Traccia una rotta potenziata dalle stelle di neutroni verso il sistema copiato dalla mappa galattica; puoi indicare l'efficienza e chiedere il supercharge.
command.calculate_trade_route.name=Calcola rotta commerciale
command.calculate_trade_route.description=Calcola una rotta commerciale redditizia a più tappe dal profilo commerciale salvato: budget, capacità di carico, tappe e distanza.
command.cancel_navigation.name=Annulla navigazione
command.cancel_navigation.description=Disattiva la guida di navigazione o verso un obiettivo in superficie in corso.
command.cancel_trade_route.name=Annulla rotta commerciale
command.cancel_trade_route.description=Cancella la rotta commerciale attualmente pianificata.
command.clear_active_missions.name=Cancella missioni attive
command.clear_active_missions.description=Svuota l'elenco delle missioni seguite dall'app; le missioni restano attive nel gioco.
command.clear_fleet_carrier_route.name=Cancella rotta della Fleet Carrier
command.clear_fleet_carrier_route.description=Abbandona la rotta tracciata della Fleet Carrier: non restano tappe, destinazione né conto alla rovescia del salto.
command.clear_mining_targets.name=Cancella obiettivi di estrazione
command.clear_mining_targets.description=Rimuove tutte le merci dall'elenco di prospezione.
command.clear_neutron_route.name=Cancella rotta per stelle di neutroni
command.clear_neutron_route.description=Elimina i punti di passaggio salvati della rotta per stelle di neutroni.
command.clear_reminders.name=Cancella promemoria
command.clear_reminders.description=Elimina tutti i promemoria: la commissione salvata, i promemoria a tempo, il suggerimento commerciale della rotta e l'ultimo risultato di ricerca merci.
command.close_location_bookmarks.name=Chiudi segnalibri
command.close_location_bookmarks.description=Chiude l'elenco dei segnalibri sull'overlay HUD.
command.cycle_next_page.name=Pagina successiva
command.cycle_next_page.description=Passa alla pagina successiva del pannello di gioco aperto.
command.cycle_next_panel.name=Scheda successiva
command.cycle_next_panel.description=Passa alla scheda successiva del pannello di gioco aperto.
command.cycle_previous_page.name=Pagina precedente
command.cycle_previous_page.description=Torna alla pagina precedente del pannello di gioco aperto.
command.cycle_previous_panel.name=Scheda precedente
command.cycle_previous_panel.description=Torna alla scheda precedente del pannello di gioco aperto.
command.decrease_speed.name=Riduci velocità
command.decrease_speed.description=Riduce la manetta del numero di tacche indicato.
command.delete_codex_entry.name=Elimina voce del Codex
command.delete_codex_entry.description=Elimina la voce del Codex o del campione biologico seguita e smette di guidarti verso di essa.
command.delete_location_bookmark.name=Elimina segnalibro
command.delete_location_bookmark.description=Elimina il segnalibro con il numero indicato nell'elenco dei segnalibri.
command.deploy_chaff.name=Lancia chaff
command.deploy_chaff.description=Lancia chaff per interrompere l'aggancio di missili e armi su cardano.
command.deploy_fighter.name=Lancia il caccia
command.deploy_fighter.description=Lancia un caccia dall'hangar mentre piloti la nave principale.
command.deploy_hardpoints.name=Dispiega le armi
command.deploy_hardpoints.description=Dispiega gli hardpoint: servono alle armi, ma anche a laser minerari, controller di droni e scanner.
command.deploy_heat_sink.name=Lancia dissipatore di calore
command.deploy_heat_sink.description=Lancia un dissipatore di calore per smaltire il calore e raffreddare la nave.
command.deploy_landing_gear.name=Abbassa il carrello
command.deploy_landing_gear.description=Abbassa il carrello per attraccare o atterrare.
command.deploy_shield_cell.name=Usa cella scudo
command.deploy_shield_cell.description=Attiva una cella scudo per ricaricare gli scudi.
command.deploy_vehicle_srv.name=Dispiega SRV
command.deploy_vehicle_srv.description=Dispiega un SRV dall'hangar dei veicoli; indica il veicolo o l'alloggiamento, altrimenti si usa il primo.
command.disembark.name=Sbarca
command.disembark.description=Lascia la nave o l'SRV per proseguire a piedi.
command.dismiss_construction_site.name=Ignora il cantiere
command.dismiss_construction_site.description=Smette di seguire l'ultimo cantiere a cui hai attraccato: esce dall'HUD e VEGA non propone più acquisti o navigazione per esso.
command.dismiss_ship_to_orbit.name=Congeda la nave
command.dismiss_ship_to_orbit.description=Manda la nave in orbita mentre sei sull'SRV o a piedi.
command.display_fleet_carrier_management_panel.name=Gestione della Fleet Carrier
command.display_fleet_carrier_management_panel.description=Apre il pannello di gestione della Fleet Carrier.
command.display_open_galaxy_map.name=Apri mappa galattica
command.display_open_galaxy_map.description=Apre la mappa galattica.
command.display_open_system_map.name=Apri mappa del sistema
command.display_open_system_map.description=Apre la mappa del sistema.
command.display_radar_panel.name=Pannello radar
command.display_radar_panel.description=Apre il pannello radar e sensori.
command.drive_assist.name=Assistenza alla guida
command.drive_assist.description=Attiva o disattiva l'assistenza alla guida dell'SRV, o la commuta se non specifichi.
command.drop_from_super_cruise.name=Esci dal supercruise
command.drop_from_super_cruise.description=Esce dal supercruise nello spazio normale.
command.enter_fleet_carrier_destination.name=Inserisci destinazione della Fleet Carrier
command.enter_fleet_carrier_destination.description=Scrive il sistema della prossima tappa nel campo di navigazione della Fleet Carrier e lo conferma; da usare dopo aver calcolato la rotta.
command.enter_super_cruise.name=Entra in supercruise
command.enter_super_cruise.description=Attiva il supercruise; se è già attivo, punta il prossimo sistema della rotta e salta.
command.equalize_power.name=Bilancia l'energia
command.equalize_power.description=Riporta il distributore di energia a punti bilanciati tra sistemi, motori e armi.
command.exclude_star_system_from_searches.name=Escludi il sistema dalle ricerche
command.exclude_star_system_from_searches.description=Esclude d'ora in poi un sistema stellare da tutte le ricerche, quando una stazione indicata lì non esiste o non è utilizzabile.
command.exit_close.name=Chiudi pannello o mappa
command.exit_close.description=Chiude il pannello, il menu o la mappa aperti, o torna indietro.
command.fighter_attack_target.name=Caccia: attacca il mio bersaglio
command.fighter_attack_target.description=Ordina al caccia schierato di attaccare il tuo bersaglio attuale.
command.fighter_defend.name=Caccia: difendi la nave
command.fighter_defend.description=Ordina al caccia schierato di difendere la tua nave.
command.fighter_fire_at_will.name=Caccia: fuoco a volontà
command.fighter_fire_at_will.description=Ordina al caccia schierato di ingaggiare liberamente i bersagli.
command.fighter_hold_fire.name=Caccia: cessate il fuoco
command.fighter_hold_fire.description=Ordina al caccia schierato di cessare il fuoco.
command.fighter_return_to_ship.name=Caccia: rientra nella nave
command.fighter_return_to_ship.description=Ordina al caccia schierato di rientrare e attraccare alla tua nave.
command.find_bounty_hunting_ground.name=Trova zona di caccia alle taglie
command.find_bounty_hunting_ground.description=Traccia una rotta verso un sistema con siti di estrazione di risorse per la caccia alle taglie, scelto tra i sistemi già visitati entro il raggio indicato.
command.find_commodity.name=Trova merce da acquistare
command.find_commodity.description=Trova dove acquistare una merce o un modulo entro la distanza indicata e traccia la rotta, verso il mercato più vicino o il prezzo migliore.
command.find_conflict_zone_for_combat_bonds.name=Trova zona di conflitto
command.find_conflict_zone_for_combat_bonds.description=Traccia una rotta verso un sistema con zone di conflitto attive per combattere per una fazione e guadagnare obbligazioni di guerra, tra le guerre avvistate nell'ultima settimana entro il raggio indicato.
command.find_construction_site_commodity.name=Trova merce per il cantiere
command.find_construction_site_commodity.description=Trova dove acquistare ciò che serve di più al tuo cantiere e traccia la rotta verso quel mercato; legge l'elenco del cantiere, non serve nominare la merce.
command.find_encoded_material_trader.name=Trova commerciante di materiali codificati
command.find_encoded_material_trader.description=Traccia una rotta verso il commerciante di materiali codificati più vicino.
command.find_fuel_station.name=Trova stazione di rifornimento
command.find_fuel_station.description=Traccia una rotta verso la stazione più vicina dove la nave può attraccare e fare rifornimento, per navi senza collettore di carburante.
command.find_guardian_technology_broker.name=Trova broker di tecnologia Guardian
command.find_guardian_technology_broker.description=Traccia una rotta verso il broker di tecnologia Guardian più vicino, che sblocca moduli e armi Guardian.
command.find_human_technology_broker.name=Trova broker di tecnologia umana
command.find_human_technology_broker.description=Traccia una rotta verso il broker di tecnologia umana più vicino, che sblocca i suoi moduli.
command.find_interstellar_factor.name=Trova Interstellar Factors
command.find_interstellar_factor.description=Traccia una rotta verso il contatto Interstellar Factors più vicino per saldare taglie e multe.
command.find_manufactured_material_trader.name=Trova commerciante di materiali fabbricati
command.find_manufactured_material_trader.description=Traccia una rotta verso il commerciante di materiali fabbricati più vicino.
command.find_mining_site.name=Trova sito di estrazione
command.find_mining_site.description=Traccia una rotta verso l'anello o il campo di asteroidi incontaminato più vicino con la merce indicata, entro la distanza indicata.
command.find_mission_commodity.name=Trova merce della missione
command.find_mission_commodity.description=Trova dove acquistare il carico che una missione attiva richiede ancora e traccia la rotta; legge la bacheca delle missioni, non serve nominare la merce.
command.find_nearest_fleet_carrier.name=Trova la Fleet Carrier più vicina
command.find_nearest_fleet_carrier.description=Indica la Fleet Carrier più vicina a portata, diversa dalla tua.
command.find_pirate_massacre_missions.name=Trova missioni di massacro di pirati
command.find_pirate_massacre_missions.description=Indica dove accumulare missioni di massacro di pirati: un sistema fornitore le cui fazioni mirano a un sistema con siti di estrazione, entro il raggio indicato.
command.find_powerplay_conflict_zone_for_merits.name=Trova zona di conflitto Powerplay
command.find_powerplay_conflict_zone_for_merits.description=Traccia una rotta verso una zona di conflitto Powerplay dove combatte la potenza a cui sei affiliato, per guadagnare meriti.
command.find_raw_material_trader.name=Trova commerciante di materie prime
command.find_raw_material_trader.description=Traccia una rotta verso il commerciante di materie prime più vicino.
command.find_shipyard_selling_ship.name=Trova cantiere navale che vende una nave
command.find_shipyard_selling_ship.description=Trova un cantiere navale che vende la nave indicata entro la distanza indicata e traccia la rotta, verso il più vicino o il più economico.
command.find_vista_genomics.name=Trova Vista Genomics
command.find_vista_genomics.description=Traccia una rotta verso il Vista Genomics più vicino per vendere i dati di esobiologia.
command.find_where_to_collect_raw_material.name=Trova dove raccogliere materie prime
command.find_where_to_collect_raw_material.description=Traccia una rotta verso il posto migliore per raccogliere la materia prima indicata, come il tellurio: un sito di alberi cerebrali, altrimenti la superficie planetaria più ricca.
command.find_where_to_sell_commodity.name=Trova dove vendere merce
command.find_where_to_sell_commodity.description=Trova un mercato con domanda per la merce indicata entro la distanza indicata e traccia la rotta, verso l'acquirente più vicino o quello che paga meglio.
command.flag_exo_mastery_system_harvested.name=Segna il sistema come raccolto
command.flag_exo_mastery_system_harvested.description=Registra che hai già campionato tutti i corpi di esobiologia di questo sistema in una sessione precedente, così la rotta Exo-Mastery smette di proporlo.
command.forget_hunting_ground.name=Dimentica zona di caccia
command.forget_hunting_ground.description=Dimentica il sistema attuale come zona di caccia ai pirati, così non viene più consigliato insieme ai fornitori di missioni che lo avevano come obiettivo.
command.hide_hud_overlay.name=Nascondi overlay HUD
command.hide_hud_overlay.description=Toglie l'overlay HUD dallo schermo.
command.ignore_nonsensical_input.name=Ignora input senza senso
command.ignore_nonsensical_input.description=Usata quando una trascrizione non ha senso, così VEGA la lascia passare senza agire.
command.increase_speed.name=Aumenta velocità
command.increase_speed.description=Aumenta la manetta del numero di tacche indicato.
command.interrupt.name=Interrompi
command.interrupt.description=Interrompe subito VEGA mentre parla.
command.jump_to_hyperspace.name=Salta nell'iperspazio
command.jump_to_hyperspace.description=Attiva il motore a curvatura per saltare al prossimo sistema della rotta tracciata.
command.launch_deploy_nomad.name=Dispiega Nomad
command.launch_deploy_nomad.description=Dispiega l'esploratore aereo Nomad mentre voli a bassa quota su un pianeta.
command.launch_ship_detach_from_station.name=Decolla con la nave
command.launch_ship_detach_from_station.description=Sgancia la nave e decolla dalla piattaforma di atterraggio.
command.monetize_route.name=Monetizza la rotta
command.monetize_route.description=Trova una coppia di acquisto e vendita redditizia lungo la rotta tracciata e la salva come promemoria, per guadagnare crediti lungo il viaggio.
command.move_hud_overlay_to_screen_section.name=Sposta overlay HUD
command.move_hud_overlay_to_screen_section.description=Sposta la scheda dell'overlay HUD nella parte dello schermo indicata dal punto cardinale: nord in alto, sud in basso, est a destra, ovest a sinistra.
command.navigate_from_memory.name=Naviga dagli appunti
command.navigate_from_memory.description=Traccia una rotta verso il sistema stellare il cui nome hai copiato negli appunti da un sito come INARA o Spansh.
command.navigate_to_active_mission.name=Naviga verso la missione attiva
command.navigate_to_active_mission.description=Traccia una rotta verso la destinazione di una missione attiva; indicala con una parola chiave, altrimenti si usa la più recente con una destinazione.
command.navigate_to_bio_sample_codex_entry.name=Naviga verso voce biologica del Codex
command.navigate_to_bio_sample_codex_entry.description=Ti guida sul pianeta attuale verso il campione biologico o la posizione del Codex salvata più vicina.
command.navigate_to_construction_site.name=Naviga verso il cantiere
command.navigate_to_construction_site.description=Traccia una rotta di ritorno al cantiere che stai rifornendo, l'ultimo a cui hai attraccato.
command.navigate_to_coordinates.name=Naviga verso coordinate
command.navigate_to_coordinates.description=Avvia la guida in superficie verso latitudine e longitudine indicate sul pianeta attuale.
command.navigate_to_exo_mastery_site.name=Naviga verso un sito di esobiologia
command.navigate_to_exo_mastery_site.description=Traccia una rotta verso il sistema di esobiologia più redditizio della lista Exo-Mastery non ancora campionato e lascia un promemoria con i pianeti su cui atterrare.
command.navigate_to_fleet_carrier.name=Naviga verso la Fleet Carrier
command.navigate_to_fleet_carrier.description=Traccia una rotta verso l'ultima posizione nota della tua Fleet Carrier, o verso il sistema base se non ne è nota nessuna.
command.navigate_to_home_system.name=Naviga verso il sistema base
command.navigate_to_home_system.description=Traccia una rotta verso il sistema base salvato.
command.navigate_to_landing_zone.name=Naviga verso la zona di atterraggio
command.navigate_to_landing_zone.description=Avvia la guida in superficie verso la zona di atterraggio salvata sul pianeta attuale.
command.navigate_to_location_bookmark.name=Naviga verso un segnalibro
command.navigate_to_location_bookmark.description=Traccia una rotta verso il segnalibro con il numero indicato nell'elenco dei segnalibri.
command.navigate_to_next_trade_stop.name=Naviga verso la prossima tappa commerciale
command.navigate_to_next_trade_stop.description=Traccia una rotta verso la prossima tappa della rotta commerciale attiva, per comprare o vendere a seconda del carico.
command.navigate_to_pirate_mission_provider.name=Naviga verso il fornitore della missione pirata
command.navigate_to_pirate_mission_provider.description=Traccia una rotta verso un sistema che offre missioni di massacro di pirati, in base alle tue missioni, alla zona di caccia in cui sei o alla migliore coppia nota.
command.navigate_to_pirate_mission_target.name=Naviga verso l'obiettivo della missione pirata
command.navigate_to_pirate_mission_target.description=Traccia una rotta verso il sistema dove si cacciano i pirati della tua missione di massacro attiva.
command.navigate_to_squadron_carrier.name=Naviga verso la Fleet Carrier dello squadrone
command.navigate_to_squadron_carrier.description=Traccia una rotta verso la Fleet Carrier del tuo squadrone.
command.navigate_to_star_system_or_place_named_aloud.name=Naviga verso un luogo per nome
command.navigate_to_star_system_or_place_named_aloud.description=Traccia una rotta verso un sistema, una stazione o un luogo che pronunci ad alta voce.
command.next_location_bookmarks_page.name=Pagina successiva dei segnalibri
