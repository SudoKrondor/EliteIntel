journalImport.title=Importa vecchi diari
journalImport.intro=Elite Intel impara dai tuoi diari mentre voli: chi offre missioni di massacro pirata, i siti di estrazione risorse, i corpi che hai scoperto e mappato, l'esobiologia che hai campionato e i nomi di nuovi materiali e merci. Se hai conservato diari più vecchi altrove, aggiungi qui le cartelle o gli archivi e l'app imparerà anche da quelli. Vengono letti archivi zip, 7z e tar, non compressi o compressi con gzip, bzip2 o xz, e tutto ciò che non è un diario viene saltato. Ogni comandante trovato viene importato nei propri dati. Nulla cambia di dove sei o di cosa trasporti ora, e importare due volte gli stessi diari non fa danni.
