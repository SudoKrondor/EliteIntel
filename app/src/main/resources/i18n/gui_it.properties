speech.setup.noBindingsYet=Comandante, i tuoi file di configurazione dei comandi non sono ancora stati creati. Completa l'addestramento da comandante, poi in Opzioni, Comandi imposta il movimento dell'interfaccia della mappa galattica sui tasti freccia e applica. Fatto questo, potrò leggere i tuoi comandi. Fino ad allora non posso pilotare la tua nave.
