speech.bindingConflictsBlocking=Comandante, conflitto critico di binding. Il movimento della mappa galattica e la navigazione dell''interfaccia sono {0,choice,1#sullo stesso tasto|1<sugli stessi tasti} - {1}. Il tracciamento della rotta non può funzionare finché la mappa e l''interfaccia non hanno tasti distinti. I tasti esatti sono in BindForge, poi Editor Binding, poi Anomalie.
speech.bindingGeneralPresetNotRead=Comandante, i tuoi comandi generali usano il preset {0}, che non ha un file salvato, quindi sto leggendo {1}. I tasti che premo per la mappa galattica e l''interfaccia potrebbero non essere quelli usati dal gioco, e il tracciamento della rotta può fallire. Per risolvere, apri Opzioni, poi Comandi nel gioco, e imposta i comandi generali su {1}.
speech.bindingSectionsNotRead=Comandante, questi comandi usano un preset diverso da {1}, quello che sto leggendo: {0}. I tasti che premo per loro potrebbero non essere quelli usati dal gioco. Per risolvere, apri Opzioni, poi Comandi nel gioco, e impostali su {1}. Oppure apri la scheda BindForge per scegliere quale file leggo.
speech.bindingReservedGameMenu=Comandante, il tuo menu di gioco è su {1}. Elite apre quel menu con qualsiasi combinazione che finisce con {1}, quindi {0,choice,1#un comando è su {2} e non può essere premuto|1<{0} comandi sono su {2} e non possono essere premuti} senza sbatterti nella schermata delle opzioni. La soluzione è una sola modifica: cancella l''assegnazione del menu di gioco nelle opzioni di gioco, in Controlli. Esc apre comunque quel menu. I tasti esatti sono nel rapporto di sistema.
speech.bindingReservedOsChord=Comandante, {0,choice,1#un comando usa|1<{0} comandi usano} una combinazione di tasti che il tuo sistema operativo intercetta prima ancora che il gioco la veda - {1}. Premerla chiude il gioco, o abbandona del tutto la tua sessione. La soluzione è assegnare {0,choice,1#quel comando|1<quei comandi} a un altro tasto nelle opzioni di gioco, in Controlli. I tasti esatti sono nel rapporto di sistema.
