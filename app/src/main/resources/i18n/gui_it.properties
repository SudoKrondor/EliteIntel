query.query_carriers.name=Fleet Carrier nel sistema
query.query_carriers.description=Riferisce le Fleet Carrier nel sistema: quante sono, i nomi e i loro mercati e servizi.
query.query_construction_site_progress.name=Avanzamento del cantiere
query.query_construction_site_progress.description=Riferisce l'avanzamento del tuo cantiere: cosa manca, quante tonnellate di ciascuna merce e cosa trasporti già per esso.
query.query_current_location.name=Posizione attuale
query.query_current_location.description=Riferisce dove ti trovi e com'è il posto: sistema, corpo, attraccato o atterrato, sicurezza, fazioni, gravità, atmosfera e temperatura.
query.query_distance_to_bio_sample.name=Distanza dall'ultimo campione biologico
query.query_distance_to_bio_sample.description=Riferisce la distanza dall'ultimo campione biologico, per rispettare la distanza minima tra i campioni.
query.query_distance_to_body.name=Distanza dal corpo celeste
query.query_distance_to_body.description=Riferisce la distanza in secondi luce da un corpo o una stazione del sistema che nomini.
query.query_distance_to_bubble_earth_sol_civilization.name=Distanza dalla Bolla
query.query_distance_to_bubble_earth_sol_civilization.description=Riferisce la distanza dallo spazio abitato, la Bolla attorno a Sol.
query.query_distance_to_carrier.name=Distanza dalla Fleet Carrier
query.query_distance_to_carrier.description=Riferisce la distanza dalla tua Fleet Carrier.
query.query_exobiology_samples.name=Esobiologia su questo pianeta
query.query_exobiology_samples.description=Riferisce le scansioni organiche su questo pianeta: quali specie sono campionate e cosa resta da scansionare.
query.query_exploration_profits.name=Profitti di esplorazione
query.query_exploration_profits.description=Riferisce i guadagni di esobiologia: crediti ottenuti in questa sessione rispetto a quanto renderebbe il sistema scansionando ogni specie.
query.query_fsd_target.name=Obiettivo FSD
query.query_fsd_target.description=Riferisce sulla destinazione del salto puntata: la stella, la sua classe e se permette di raccogliere carburante.
query.query_general_conversation.name=Conversazione generale
query.query_general_conversation.description=Una semplice conversazione con VEGA, per tutto ciò che non è un comando né una domanda sul gioco.
query.query_geo_signals.name=Segnali geologici
query.query_geo_signals.description=Riferisce i siti geologici e vulcanici rilevati sui corpi del sistema.
query.query_last_scan.name=Ultima scansione
query.query_last_scan.description=Riferisce l'ultimo corpo celeste scansionato e i suoi dettagli.
query.query_local_outfitting.name=Equipaggiamento locale
query.query_local_outfitting.description=Riferisce i moduli in vendita nell'equipaggiamento di questa stazione.
query.query_markets.name=Mercati locali
query.query_markets.description=Elenca stazioni e insediamenti del sistema e quali hanno mercato, cantiere navale o equipaggiamento; non indica i prezzi.
query.query_material_inventory.name=Inventario dei materiali
query.query_material_inventory.description=Riferisce quanto possiedi di un materiale di ingegneria o di una merce.
query.query_missions_and_rewards.name=Missioni e ricompense
query.query_missions_and_rewards.description=Riferisce le tue missioni attive: fazione, obiettivo, destinazione, ricompensa e scadenza, eventualmente per un solo sistema.
query.query_pirate_mission.name=Avanzamento della missione di massacro
query.query_pirate_mission.description=Riferisce l'avanzamento delle missioni di massacro: uccisioni rimanenti per fazione e in totale, e la ricompensa complessiva.
query.query_planet_materials.name=Materiali sul pianeta
query.query_planet_materials.description=Riferisce le materie prime del pianeta attuale o puntato e le loro percentuali.
query.query_player_profile_rank_progress.name=Progresso dei gradi
query.query_player_profile_rank_progress.description=Riferisce i tuoi gradi e quanto manca al successivo in ciascuno.
query.query_population.name=Popolazione
query.query_population.description=Riferisce quante persone vivono dove ti trovi: il sistema, o una stima per la stazione o il pianeta.
query.query_reminder.name=Promemoria
query.query_reminder.description=Riferisce il tuo promemoria attivo: la commissione salvata - dove andare, cosa comprare o ritirare, dove venderlo.
query.query_ship_loadout.name=Configurazione della nave
query.query_ship_loadout.description=Riferisce moduli e armi installati sulla nave, o se un certo modulo è a bordo.
query.query_ship_route_remaining_jumps.name=Rotta tracciata
query.query_ship_route_remaining_jumps.description=Riferisce la rotta tracciata della nave: prossimo punto, salti rimanenti, distanza residua e se la prossima stella permette di raccogliere carburante.
query.query_signals_in_star_system.name=Segnali nel sistema
query.query_signals_in_star_system.description=Riferisce i segnali notevoli del sistema: siti di estrazione, zone di conflitto, hotspot minerari e segnali di superficie.
query.query_station_details.name=Dettagli della stazione
query.query_station_details.description=Riferisce i servizi della stazione in cui ti trovi, o se un certo servizio è offerto.
query.query_stations.name=Stazioni nel sistema
query.query_stations.description=Riferisce stazioni, avamposti e insediamenti del sistema dove puoi attraccare.
query.query_stellar_objects.name=Corpi celesti nel sistema
query.query_stellar_objects.description=Elenca i corpi del sistema - quali sono atterrabili, tipo, gravità, atmosfera, anelli e segnali - o i dettagli di quello che nomini.
query.query_system_security.name=Sicurezza del sistema
query.query_system_security.description=Riferisce livello di sicurezza del sistema, fazione di controllo, fedeltà e controllo Powerplay.
query.query_time.name=Ora attuale
query.query_time.description=Riferisce l'ora UTC reale e l'ora galattica del gioco.
query.query_total_bounties.name=Taglie riscosse
query.query_total_bounties.description=Riferisce i buoni taglia riscossi in questa sessione.
query.query_trade_profile.name=Profilo commerciale
query.query_trade_profile.description=Riferisce le impostazioni della ricerca di rotte commerciali: budget, tappe, distanza e quali sistemi e carichi sono ammessi.
query.query_trade_route.name=Rotta commerciale attuale
query.query_trade_route.description=Riferisce la rotta commerciale pianificata: tappe, cosa comprare e vendere e il profitto previsto.
query.query_vega_self_diagnostic.name=Autodiagnosi di VEGA
query.query_vega_self_diagnostic.description=Verifica la connessione al modello di IA e riferisce se risponde e con quale velocità.

