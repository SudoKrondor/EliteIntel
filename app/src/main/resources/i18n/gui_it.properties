command.play_music.name=Riproduci musica
command.play_music.description=Riproduce la tua musica dalla playlist del Jukebox o la riprende da dove era in pausa.
command.play_music_track_by_name.name=Riproduci brano per nome
command.play_music_track_by_name.description=Riproduce un brano della tua playlist, indicato per titolo o artista.
command.play_previous_music_track.name=Brano precedente
