# Preset Editor (P4)
bindings.tab.presetEditor=Editor Preset
bindings.presetEditor.title=Configurazione preset attiva
bindings.presetEditor.intro=Il gioco legge separatamente quattro sezioni di comandi, e ognuna carica il file binds indicato dalla sua riga. Punta ognuna a un file binds, o impostale tutte sullo stesso. Gli elenchi mostrano i BindName, non i nomi dei file: Custom.4.2.binds appare come Custom. Le modifiche vengono scritte quando premi APPLY in alto.\n\nVEGA legge i tasti che preme da un solo file binds. Se queste quattro sezioni usano file binds diversi, un comando di un altro file può avere altri tasti, e VEGA premerà i tasti sbagliati nel gioco. Imposta tutte e quattro sullo stesso file: sei avvisato.
