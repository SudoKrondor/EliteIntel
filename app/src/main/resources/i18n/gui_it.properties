speech.setup.noJournals=Attenzione, comandante. Non trovo alcun file di diario di Elite Dangerous dove sto cercando. Finché la cartella dei diari non è impostata correttamente, sono cieco a tutto ciò che accade intorno alla tua nave. Puoi impostarla nella scheda Comandante.
