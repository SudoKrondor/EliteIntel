bindings.presetEditor.split=As quatro secções não carregam todas o mesmo ficheiro binds. O jogo suporta isto, por isso é só uma nota.
bindings.presetEditor.unreachable=O BindForge não conseguiu aceder a {0}, por isso os seus ficheiros binds de fábrica não estão nas listas.
