speech.setup.noJournals=Atenção, comandante. Não encontro nenhum ficheiro de diário do Elite Dangerous onde estou a procurar. Enquanto a pasta dos diários não estiver corretamente definida, estou cego a tudo o que acontece à volta da sua nave. Pode defini-la no separador Comandante.
