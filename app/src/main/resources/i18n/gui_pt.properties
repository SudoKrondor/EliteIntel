query.query_fsd_target.description=Indica o destino de salto apontado: a estrela, a classe e se permite recolher combustível.
query.query_general_conversation.name=Conversa geral
query.query_general_conversation.description=Uma conversa simples com a VEGA, para tudo o que não seja um comando nem uma pergunta sobre o jogo.
query.query_geo_signals.name=Sinais geológicos
query.query_geo_signals.description=Indica os locais geológicos e vulcânicos detetados nos corpos do sistema.
query.query_last_scan.name=Última análise
query.query_last_scan.description=Indica o último corpo celeste analisado e os seus detalhes.
query.query_local_outfitting.name=Equipamento local
query.query_local_outfitting.description=Indica os módulos à venda no equipamento desta estação.
query.query_markets.name=Mercados locais
query.query_markets.description=Lista as estações e povoações do sistema e quais têm mercado, estaleiro ou equipamento; não indica preços.
query.query_material_inventory.name=Inventário de materiais
query.query_material_inventory.description=Indica quanto tem de um material de engenharia ou mercadoria.
query.query_missions_and_rewards.name=Missões e recompensas
query.query_missions_and_rewards.description=Indica as missões ativas: fação, objetivo, destino, recompensa e prazo, opcionalmente para um sistema.
query.query_pirate_mission.name=Progresso da missão de massacre
query.query_pirate_mission.description=Indica o progresso das missões de massacre: abates restantes por fação e no total, e a recompensa combinada.
query.query_planet_materials.name=Materiais no planeta
query.query_planet_materials.description=Indica as matérias-primas do planeta atual ou apontado e as suas percentagens.
query.query_player_profile_rank_progress.name=Progresso das patentes
query.query_player_profile_rank_progress.description=Indica as patentes e quanto falta para a seguinte em cada uma.
query.query_population.name=População
query.query_population.description=Indica quantas pessoas vivem onde está: o sistema, ou uma estimativa para a estação ou o planeta.
query.query_reminder.name=Lembrete
query.query_reminder.description=Indica o lembrete ativo: a tarefa guardada - onde ir, o que comprar ou recolher, onde vender.
query.query_ship_loadout.name=Configuração da nave
query.query_ship_loadout.description=Indica os módulos e armas instalados na nave, ou se um dado módulo está a bordo.
query.query_ship_route_remaining_jumps.name=Rota traçada
query.query_ship_route_remaining_jumps.description=Indica a rota traçada da nave: próximo ponto, saltos restantes, distância em falta e se a próxima estrela permite recolher combustível.
query.query_signals_in_star_system.name=Sinais no sistema
query.query_signals_in_star_system.description=Indica os sinais relevantes do sistema: locais de extração, zonas de conflito, pontos quentes de mineração e sinais de superfície.
query.query_station_details.name=Detalhes da estação
query.query_station_details.description=Indica os serviços da estação onde está, ou se um dado serviço é oferecido.
query.query_stations.name=Estações no sistema
query.query_stations.description=Indica as estações, postos avançados e povoações do sistema onde pode atracar.
query.query_stellar_objects.name=Corpos celestes no sistema
query.query_stellar_objects.description=Lista os corpos do sistema - quais permitem aterrar, tipo, gravidade, atmosfera, anéis e sinais - ou detalha o que nomear.
query.query_system_security.name=Segurança do sistema
query.query_system_security.description=Indica o nível de segurança do sistema, a fação que o controla, a lealdade e o controlo de Powerplay.
query.query_time.name=Hora atual
query.query_time.description=Indica a hora UTC real e a hora galáctica do jogo.
query.query_total_bounties.name=Recompensas obtidas
query.query_total_bounties.description=Indica os vales de recompensa obtidos nesta sessão.
query.query_trade_profile.name=Perfil comercial
query.query_trade_profile.description=Indica as definições da pesquisa de rotas comerciais: orçamento, paragens, distância e que sistemas e cargas são permitidos.
query.query_trade_route.name=Rota comercial atual
query.query_trade_route.description=Indica a rota comercial planeada: paragens, o que comprar e vender e o lucro esperado.
query.query_vega_self_diagnostic.name=Autodiagnóstico da VEGA
query.query_vega_self_diagnostic.description=Testa a ligação ao modelo de IA e indica se responde e com que rapidez.
