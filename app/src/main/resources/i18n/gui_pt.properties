speech.notOdyssey=Atenção, comandante. O seu jogo não está a correr o Odyssey. Esta aplicação foi criada para o Elite Dangerous Odyssey, e grande parte dela não funcionará no Horizons.
speech.gameClockDisagreement=Atenção, comandante. O relógio do seu PC difere do jogo em mais de um minuto. Até ser corrigido, podem perder-se alguns eventos do jogo. Os detalhes estão na aplicação.
speech.setup.noLlm=Ainda não há nenhum modelo de linguagem configurado, por isso não consigo compreendê-lo nem responder-lhe. Configure o nível gratuito da Mistral ou o modelo local Gemma 4 E4B, com as instruções em elite intel ponto org.
speech.setup.noLlmProvider=Atenção, comandante. Está configurado para um modelo de linguagem na nuvem, mas não há nenhum fornecedor selecionado, por isso não consigo responder-lhe. Abra o separador Serviços de IA nas definições, escolha o seu fornecedor na lista e guarde.
speech.setup.noJournals=Atenção, comandante. Não encontro nenhum ficheiro de diário do Elite Dangerous onde estou a procurar. Enquanto a pasta dos diários não estiver corretamente definida, estou cego a tudo o que acontece à volta da sua nave. Pode defini-la no separador Definições.
speech.setup.noBindings=Atenção, comandante. Não encontro nenhuma configuração de controlos onde estou a procurar. Enquanto a pasta dos controlos não estiver corretamente definida, não consigo pilotar a sua nave. Pode defini-la no separador Controlos.
speech.setup.noSavedBindings=Atenção, comandante. A sua pasta de controlos está corretamente definida, mas o Elite Dangerous ainda não escreveu lá nenhum ficheiro de controlos. O jogo só guarda um depois de personalizar os seus controlos. Abra Opções e depois Controlos no jogo, altere qualquer atribuição e eu recolho-a. Até lá não consigo pilotar a sua nave.
speech.setup.noBindingsYet=Comandante, os seus ficheiros de configuração dos controlos ainda não foram criados. Conclua o seu treino de comandante e depois, em Opções, Controlos, defina o movimento da interface do mapa galáctico para as teclas de setas e aplique. Depois disso, consigo ler os seus controlos. Até lá não consigo pilotar a sua nave.
