speech.bindingConflictsBlocking=Comandante, conflito crítico de teclas. O movimento do mapa galáctico e a navegação da interface estão {0,choice,1#na mesma tecla|1<nas mesmas teclas} - {1}. O traçado de rota não pode funcionar enquanto o mapa e a interface não tiverem teclas distintas. As teclas exactas estão em BindForge, depois Editor de atribuições, depois Anomalias.
speech.bindingGeneralPresetNotRead=Comandante, os seus comandos gerais usam a predefinição {0}, que não tem ficheiro guardado, por isso estou a ler {1}. As teclas que premo para o mapa galáctico e a interface podem não ser as que o jogo usa, e o traçado de rota pode falhar. Para corrigir, abra Opções e depois Controlos no jogo, e defina os comandos gerais como {1}.
speech.bindingSectionsNotRead=Comandante, estes comandos usam uma predefinição diferente de {1}, a que estou a ler: {0}. As teclas que premo para eles podem não ser as que o jogo usa. Para corrigir, abra Opções e depois Controlos no jogo, e defina-os como {1}. Ou abra o separador BindForge para escolher que ficheiro leio.
speech.bindingReservedGameMenu=Comandante, o seu menu do jogo está em {1}. O Elite abre esse menu com qualquer combinação terminada em {1}, por isso {0,choice,1#um controlo está em {2} e não pode ser premido|1<{0} controlos estão em {2} e não podem ser premidos} sem o atirar para o ecrã de opções. A solução é uma única alteração: apague a atribuição do menu do jogo nas opções do jogo, em Controlos. O Escape abre esse menu de qualquer forma. As teclas exactas estão na leitura do sistema.
speech.bindingReservedOsChord=Comandante, {0,choice,1#um controlo usa|1<{0} controlos usam} uma combinação de teclas que o seu sistema operativo intercepta antes de o jogo sequer a ver - {1}. Premi-la fecha o jogo, ou abandona por completo a sua sessão. A solução é atribuir {0,choice,1#esse controlo|1<esses controlos} a outra tecla nas opções do jogo, em Controlos. As teclas exactas estão na leitura do sistema.
