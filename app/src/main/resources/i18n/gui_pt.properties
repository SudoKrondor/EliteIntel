# Display names and descriptions of the built-in commands and queries (Actions > Built-in Commands, details dialog).
# CommandCatalog reads command.<id>.name/.description and query.<id>.name/.description - every registered id needs both in every bundle.
command.activate_ui_control.name=Ativar elemento da interface
command.activate_ui_control.description=Prime a tecla de seleção do jogo no controlo que tem o foco.
command.add_mining_target.name=Adicionar alvo de mineração
command.add_mining_target.description=Adiciona uma mercadoria extraível, como platina ou painite, à lista de prospeção, para que a VEGA a anuncie quando um prospetor a encontrar.
command.allow_star_system_in_searches_again.name=Voltar a permitir o sistema nas pesquisas
command.allow_star_system_in_searches_again.description=Volta a deixar o sistema estelar atual aparecer nas pesquisas depois de ter sido excluído.
command.bookmark_current_location.name=Guardar localização atual nos marcadores
command.bookmark_current_location.description=Guarda a localização atual (sistema, estação, planeta ou ponto à superfície) como marcador para lá voltar mais tarde.
command.calculate_fleet_carrier_route.name=Calcular rota do Fleet Carrier
command.calculate_fleet_carrier_route.description=Traça uma nova rota de vários saltos para o Fleet Carrier até ao sistema copiado para a área de transferência, substituindo a rota já traçada.
command.calculate_neutron_star_route.name=Calcular rota por estrelas de neutrões
command.calculate_neutron_star_route.description=Traça uma rota impulsionada por estrelas de neutrões até ao sistema copiado do mapa da galáxia; a eficiência e a sobrecarga podem ser indicadas.
command.calculate_trade_route.name=Calcular rota comercial
command.calculate_trade_route.description=Calcula uma rota comercial lucrativa com várias paragens a partir do perfil comercial guardado: orçamento, capacidade de carga, paragens e distância.
command.cancel_navigation.name=Cancelar navegação
command.cancel_navigation.description=Desliga a orientação de navegação ou de alvo à superfície em curso.
command.cancel_trade_route.name=Cancelar rota comercial
command.cancel_trade_route.description=Apaga a rota comercial atualmente planeada.
command.clear_active_missions.name=Limpar missões ativas
command.clear_active_missions.description=Limpa a lista de missões acompanhadas pela aplicação; as missões continuam ativas no jogo.
command.clear_fleet_carrier_route.name=Limpar rota do Fleet Carrier
command.clear_fleet_carrier_route.description=Abandona a rota traçada do Fleet Carrier: não ficam etapas, destino nem contagem decrescente de salto.
command.clear_mining_targets.name=Limpar alvos de mineração
command.clear_mining_targets.description=Remove todas as mercadorias da lista de prospeção.
command.clear_neutron_route.name=Limpar rota de neutrões
command.clear_neutron_route.description=Elimina os pontos de passagem guardados da rota de neutrões.
command.clear_reminders.name=Limpar lembretes
command.clear_reminders.description=Elimina todos os lembretes: a tarefa guardada, os lembretes temporizados, a dica comercial da rota e o último resultado de pesquisa de mercadorias.
command.close_location_bookmarks.name=Fechar marcadores
command.close_location_bookmarks.description=Fecha a lista de marcadores na sobreposição do HUD.
command.cycle_next_page.name=Página seguinte
command.cycle_next_page.description=Passa para a página seguinte do painel do jogo aberto.
command.cycle_next_panel.name=Separador seguinte
command.cycle_next_panel.description=Passa para o separador seguinte do painel do jogo aberto.
command.cycle_previous_page.name=Página anterior
command.cycle_previous_page.description=Volta à página anterior do painel do jogo aberto.
command.cycle_previous_panel.name=Separador anterior
command.cycle_previous_panel.description=Volta ao separador anterior do painel do jogo aberto.
command.decrease_speed.name=Reduzir velocidade
command.decrease_speed.description=Reduz a aceleração no número de níveis indicado.
command.delete_codex_entry.name=Eliminar entrada do Codex
command.delete_codex_entry.description=Elimina a entrada do Codex ou de amostra biológica acompanhada e deixa de guiar até ela.
command.delete_location_bookmark.name=Eliminar marcador
command.delete_location_bookmark.description=Elimina o marcador com o número indicado na lista de marcadores.
command.deploy_chaff.name=Lançar chaff
command.deploy_chaff.description=Lança chaff para quebrar o bloqueio de mísseis e de armas com cardã.
command.deploy_fighter.name=Lançar caça
command.deploy_fighter.description=Lança um caça a partir do hangar enquanto pilota a nave principal.
command.deploy_hardpoints.name=Ativar armamento
command.deploy_hardpoints.description=Ativa os pontos de montagem: armas, mas também lasers de mineração, controladores de drones e scanners precisam deles.
command.deploy_heat_sink.name=Lançar dissipador de calor
command.deploy_heat_sink.description=Lança um dissipador de calor para libertar calor e arrefecer a nave.
command.deploy_landing_gear.name=Baixar trem de aterragem
command.deploy_landing_gear.description=Baixa o trem de aterragem para atracar ou aterrar.
command.deploy_shield_cell.name=Usar célula de escudo
command.deploy_shield_cell.description=Ativa uma célula de escudo para recarregar os escudos.
command.deploy_vehicle_srv.name=Lançar SRV
command.deploy_vehicle_srv.description=Lança um SRV do hangar de veículos; indique o veículo ou o compartimento, caso contrário é usado o 1.
command.disembark.name=Desembarcar
command.disembark.description=Sai da nave ou do SRV para seguir a pé.
command.dismiss_construction_site.name=Descartar estaleiro de construção
command.dismiss_construction_site.description=Deixa de acompanhar o último estaleiro onde atracou: sai do HUD e a VEGA deixa de oferecer compras ou navegação para ele.
command.dismiss_ship_to_orbit.name=Dispensar a nave
command.dismiss_ship_to_orbit.description=Envia a nave para órbita enquanto está no SRV ou a pé.
command.display_fleet_carrier_management_panel.name=Gestão do Fleet Carrier
command.display_fleet_carrier_management_panel.description=Abre o painel de gestão do Fleet Carrier.
command.display_open_galaxy_map.name=Abrir mapa da galáxia
command.display_open_galaxy_map.description=Abre o mapa da galáxia.
command.display_open_system_map.name=Abrir mapa do sistema
command.display_open_system_map.description=Abre o mapa do sistema.
command.display_radar_panel.name=Painel do radar
command.display_radar_panel.description=Abre o painel de radar e sensores.
command.drive_assist.name=Assistência à condução
command.drive_assist.description=Liga ou desliga a assistência à condução do SRV, ou alterna-a se nada for indicado.
command.drop_from_super_cruise.name=Sair do supercruise
command.drop_from_super_cruise.description=Sai do supercruise para o espaço normal.
command.enter_fleet_carrier_destination.name=Introduzir destino do Fleet Carrier
command.enter_fleet_carrier_destination.description=Escreve o sistema da próxima etapa no campo de navegação do Fleet Carrier e confirma-o; use depois de calcular a rota.
command.enter_super_cruise.name=Entrar em supercruise
command.enter_super_cruise.description=Ativa o supercruise; se já estiver ativo, aponta ao próximo sistema da rota e salta.
command.equalize_power.name=Equilibrar energia
command.equalize_power.description=Repõe o distribuidor de energia com pontos equilibrados entre sistemas, motores e armas.
command.exclude_star_system_from_searches.name=Excluir sistema das pesquisas
command.exclude_star_system_from_searches.description=Exclui um sistema estelar de todas as pesquisas a partir de agora, quando uma estação indicada lá não existe ou não pode ser usada.
command.exit_close.name=Fechar painel ou mapa
command.exit_close.description=Fecha o painel, menu ou mapa aberto, ou recua.
command.fighter_attack_target.name=Caça: atacar o meu alvo
command.fighter_attack_target.description=Ordena ao caça lançado que ataque o alvo atual.
command.fighter_defend.name=Caça: defender a nave
command.fighter_defend.description=Ordena ao caça lançado que defenda a nave.
command.fighter_fire_at_will.name=Caça: fogo à vontade
command.fighter_fire_at_will.description=Ordena ao caça lançado que ataque alvos livremente.
command.fighter_hold_fire.name=Caça: cessar fogo
command.fighter_hold_fire.description=Ordena ao caça lançado que cesse fogo.
command.fighter_return_to_ship.name=Caça: regressar à nave
command.fighter_return_to_ship.description=Ordena ao caça lançado que regresse e atraque na nave.
command.find_bounty_hunting_ground.name=Encontrar zona de caça a recompensas
command.find_bounty_hunting_ground.description=Traça uma rota para um sistema com locais de extração de recursos para caçar recompensas, escolhido entre os sistemas já visitados dentro do alcance indicado.
command.find_commodity.name=Encontrar mercadoria para comprar
command.find_commodity.description=Encontra onde comprar uma mercadoria ou módulo dentro da distância indicada e traça a rota, para o mercado mais próximo ou o melhor preço.
command.find_conflict_zone_for_combat_bonds.name=Encontrar zona de conflito
command.find_conflict_zone_for_combat_bonds.description=Traça uma rota para um sistema com zonas de conflito ativas para lutar por uma fação e ganhar títulos de combate, entre as guerras vistas na última semana dentro do alcance indicado.
command.find_construction_site_commodity.name=Encontrar mercadoria para a construção
command.find_construction_site_commodity.description=Encontra onde comprar o que a construção ainda mais precisa e traça a rota até esse mercado; lê a lista da própria obra, sem ser preciso nomear a mercadoria.
command.find_encoded_material_trader.name=Encontrar comerciante de materiais codificados
command.find_encoded_material_trader.description=Traça uma rota para o comerciante de materiais codificados mais próximo.
command.find_fuel_station.name=Encontrar estação de combustível
command.find_fuel_station.description=Traça uma rota para a estação mais próxima onde a nave pode atracar e reabastecer, para naves sem coletor de combustível.
command.find_guardian_technology_broker.name=Encontrar intermediário de tecnologia Guardian
command.find_guardian_technology_broker.description=Traça uma rota para o intermediário de tecnologia Guardian mais próximo, que desbloqueia módulos e armas Guardian.
command.find_human_technology_broker.name=Encontrar intermediário de tecnologia humana
command.find_human_technology_broker.description=Traça uma rota para o intermediário de tecnologia humana mais próximo, que desbloqueia os seus módulos.
command.find_interstellar_factor.name=Encontrar Interstellar Factors
command.find_interstellar_factor.description=Traça uma rota para o contacto Interstellar Factors mais próximo para pagar recompensas e multas.
command.find_manufactured_material_trader.name=Encontrar comerciante de materiais fabricados
command.find_manufactured_material_trader.description=Traça uma rota para o comerciante de materiais fabricados mais próximo.
command.find_mining_site.name=Encontrar local de mineração
command.find_mining_site.description=Traça uma rota para o anel ou campo de asteroides intacto mais próximo com a mercadoria indicada, dentro da distância indicada.
command.find_mission_commodity.name=Encontrar mercadoria da missão
command.find_mission_commodity.description=Encontra onde comprar a carga que uma missão ativa ainda precisa e traça a rota; lê o quadro de missões, sem ser preciso nomear a mercadoria.
command.find_nearest_fleet_carrier.name=Encontrar o Fleet Carrier mais próximo
command.find_nearest_fleet_carrier.description=Indica o Fleet Carrier mais próximo ao alcance que não seja o seu.
command.find_pirate_massacre_missions.name=Encontrar missões de massacre de piratas
command.find_pirate_massacre_missions.description=Indica onde acumular missões de massacre de piratas: um sistema fornecedor cujas fações visam um sistema com locais de extração, dentro do alcance indicado.
command.find_powerplay_conflict_zone_for_merits.name=Encontrar zona de conflito de Powerplay
command.find_powerplay_conflict_zone_for_merits.description=Traça uma rota para uma zona de conflito de Powerplay onde combate a potência a que jurou lealdade, para ganhar méritos.
command.find_raw_material_trader.name=Encontrar comerciante de matérias-primas
command.find_raw_material_trader.description=Traça uma rota para o comerciante de matérias-primas mais próximo.
command.find_shipyard_selling_ship.name=Encontrar estaleiro que venda uma nave
