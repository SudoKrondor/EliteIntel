# Preset Editor (P4)
bindings.tab.presetEditor=Editor de presets
bindings.presetEditor.title=Configuração de preset ativa
bindings.presetEditor.intro=O jogo lê quatro secções de controlos em separado, e cada uma carrega o ficheiro binds que a sua linha indica. Aponte cada uma para um ficheiro binds, ou ponha-as todas no mesmo. As listas mostram BindNames, não nomes de ficheiro: Custom.4.2.binds aparece como Custom. As alterações são escritas ao premir APPLY acima.\n\nO VEGA lê as teclas que prime de um único ficheiro binds. Se estas quatro secções usarem ficheiros binds diferentes, um controlo noutro ficheiro pode ter outras teclas, e o VEGA vai premir as teclas erradas no jogo. Defina as quatro para o mesmo ficheiro: está avisado.
bindings.presetEditor.setAll=Pôr todas iguais
bindings.presetEditor.setAll.tooltip=Apontar as quatro secções para o ficheiro binds escolhido ao lado deste botão.
bindings.presetEditor.missing=Estas secções não indicam nenhum ficheiro binds que o BindForge consiga encontrar: {0}. O jogo carregaria outra coisa no seu lugar, e APPLY recusa até escolher um.
