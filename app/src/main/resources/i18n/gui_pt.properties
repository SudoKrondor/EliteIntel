speech.bindingConflictsBlocking=Comandante, conflito crítico de teclas. O movimento do mapa galáctico e a navegação da interface estão {0,choice,1#na mesma tecla|1<nas mesmas teclas} - {1}. O traçado de rota não pode funcionar enquanto o mapa e a interface não tiverem teclas distintas. As teclas exactas estão na leitura do sistema.
speech.bindingReservedGameMenu=Comandante, o seu menu do jogo está em {1}. O Elite abre esse menu com qualquer combinação terminada em {1}, por isso {0,choice,1#um controlo está em {2} e não pode ser premido|1<{0} controlos estão em {2} e não podem ser premidos} sem o atirar para o ecrã de opções. A solução é uma única alteração: apague a atribuição do menu do jogo nas opções do jogo, em Controlos. O Escape abre esse menu de qualquer forma. As teclas exactas estão na leitura do sistema.
speech.bindingReservedOsChord=Comandante, {0,choice,1#um controlo usa|1<{0} controlos usam} uma combinação de teclas que o seu sistema operativo intercepta antes de o jogo sequer a ver - {1}. Premi-la fecha o jogo, ou abandona por completo a sua sessão. A solução é atribuir {0,choice,1#esse controlo|1<esses controlos} a outra tecla nas opções do jogo, em Controlos. As teclas exactas estão na leitura do sistema.
