journalImport.title=Importar diários antigos
journalImport.intro=O Elite Intel aprende com os seus diários enquanto voa: fornecedores de missões de massacre de piratas, locais de extração de recursos, os corpos que descobriu e mapeou, a exobiologia que amostrou e os nomes de novos materiais e mercadorias. Se guardou diários mais antigos noutro local, adicione aqui as pastas ou arquivos e a aplicação aprende também com eles. São lidos arquivos zip, 7z e tar, sem compressão ou comprimidos com gzip, bzip2 ou xz, e tudo o que não for um diário é ignorado. Cada comandante encontrado é importado para os seus próprios registos. Nada muda quanto ao local onde está ou ao que transporta agora, e importar os mesmos diários duas vezes não faz mal.
