# Game clock disagreement dialog (GameClockWarning)
gameClock.dialog.title=Os relógios do jogo e do PC não coincidem
gameClock.dialog.body=O Elite Dangerous e o seu PC não estão de acordo quanto à hora atual: a diferença é de {0}.
gameClock.dialog.cause.timeZone=Isto acontece muitas vezes depois de uma atualização do Windows alterar o fuso horário ou a definição da hora de verão.
gameClock.dialog.cause.drift=O mais provável é que o relógio do PC se tenha desviado, porque o Windows só o compara com a hora certa de vez em quando.
gameClock.dialog.amount.hours={0,choice,1#1 hora|1<{0} horas}
gameClock.dialog.amount.minutes={0,choice,1#cerca de 1 minuto|1<cerca de {0} minutos}
gameClock.dialog.consequences=O EliteIntel compensa a diferença, mas não em todos os momentos. Até o relógio ser corrigido, conte com:\n  - eventos do jogo perdidos nos primeiros momentos após o arranque do EliteIntel\n  - eventos do jogo perdidos durante algum tempo depois de o relógio do PC mudar\nOutras ferramentas do Elite Dangerous neste PC podem não a compensar de todo.
gameClock.dialog.fix.timeZone=Para corrigir:\n  1. Abra Definições do Windows > Hora e idioma > Data e hora.\n  2. Escolha o fuso horário correto.\n  3. Ative "Definir hora automaticamente" e "Ajustar automaticamente para a hora de verão".\n  4. Prima "Sincronizar agora".\n  5. Reinicie o Elite Dangerous.
gameClock.dialog.fix.sync=Para corrigir:\n  1. Abra Definições do Windows > Hora e idioma > Data e hora.\n  2. Ative "Definir hora automaticamente".\n  3. Prima "Sincronizar agora".\n  4. Reinicie o Elite Dangerous.
gameClock.dialog.check=Para verificar: o relógio no HUD do jogo e o relógio no separador principal do EliteIntel devem mostrar a mesma hora.

