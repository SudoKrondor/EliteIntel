# The commander's answer to a destructive-action confirmation (see ConfirmationReplies)
# An answer must OPEN with one of these phrases. A negative wins over an affirmative. English applies in every language.
affirmative=ja, jawohl, jep, klar, sicher, bestätigt, bestätige, mach es, mach das, mach schon, los, weiter, fortfahren, genau, natürlich, richtig, okay, ok, in ordnung, positiv, tu es, gerne
negative=nein, nee, negativ, halt, warte, stopp, nicht, lass das, lass es, vergiss es, doch nicht, moment, lieber nicht, auf keinen fall
