# The commander's answer to a destructive-action confirmation (see ConfirmationReplies)
# An answer must OPEN with one of these phrases. A negative wins over an affirmative. English applies in every language.
affirmative=sí, si, claro, vale, adelante, hazlo, confirmo, confirmado, afirmativo, correcto, por supuesto, de acuerdo, ok, okay, procede, dale, seguro
negative=no, negativo, espera, alto, detente, cancela eso, olvídalo, déjalo, mejor no, ni hablar, para, quieto
