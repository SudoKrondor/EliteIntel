command.find_raw_material_trader.name=Trouver un négociant en matières premières
command.find_raw_material_trader.description=Trace un itinéraire vers le négociant en matières premières le plus proche.
command.find_shipyard_selling_ship.name=Trouver un chantier naval vendant un vaisseau
command.find_shipyard_selling_ship.description=Trouve un chantier naval vendant le vaisseau indiqué dans la distance indiquée et trace l'itinéraire, vers le plus proche ou le moins cher.
command.find_vista_genomics.name=Trouver Vista Genomics
command.find_vista_genomics.description=Trace un itinéraire vers le Vista Genomics le plus proche pour vendre les données d'exobiologie.
command.find_where_to_collect_raw_material.name=Trouver où collecter une matière première
command.find_where_to_collect_raw_material.description=Trace un itinéraire vers le meilleur endroit pour collecter la matière première indiquée, comme le tellure : un site d'arbres cérébraux, sinon la surface planétaire la plus riche.
command.find_where_to_sell_commodity.name=Trouver où vendre une marchandise
