command.fighter_attack_target.name=Chasseur : attaquer ma cible
command.fighter_attack_target.description=Ordonne au chasseur déployé d'attaquer votre cible actuelle.
command.fighter_defend.name=Chasseur : défendre le vaisseau
command.fighter_defend.description=Ordonne au chasseur déployé de défendre votre vaisseau.
command.fighter_fire_at_will.name=Chasseur : feu à volonté
command.fighter_fire_at_will.description=Ordonne au chasseur déployé d'engager librement les cibles.
command.fighter_hold_fire.name=Chasseur : cesser le feu
command.fighter_hold_fire.description=Ordonne au chasseur déployé de cesser le feu.
command.fighter_return_to_ship.name=Chasseur : retour au vaisseau
command.fighter_return_to_ship.description=Ordonne au chasseur déployé de revenir s'amarrer à votre vaisseau.
command.find_bounty_hunting_ground.name=Trouver une zone de chasse aux primes
command.find_bounty_hunting_ground.description=Trace un itinéraire vers un système doté de sites d'extraction de ressources pour la chasse aux primes, parmi les systèmes déjà visités dans la portée indiquée.
command.find_commodity.name=Trouver une marchandise à acheter
command.find_commodity.description=Trouve où acheter une marchandise ou un module dans la distance indiquée et trace l'itinéraire, vers le marché le plus proche ou le meilleur prix.
command.find_conflict_zone_for_combat_bonds.name=Trouver une zone de conflit
command.find_conflict_zone_for_combat_bonds.description=Trace un itinéraire vers un système avec des zones de conflit actives pour combattre pour une faction et gagner des obligations de combat, parmi les guerres repérées la semaine passée dans la portée indiquée.
command.find_construction_site_commodity.name=Trouver une marchandise pour le chantier
command.find_construction_site_commodity.description=Trouve où acheter ce dont votre chantier a le plus besoin et trace l'itinéraire vers ce marché ; la liste du chantier est lue directement, inutile de nommer la marchandise.
command.find_encoded_material_trader.name=Trouver un négociant en matériaux encodés
command.find_encoded_material_trader.description=Trace un itinéraire vers le négociant en matériaux encodés le plus proche.
command.find_fuel_station.name=Trouver une station de ravitaillement
command.find_fuel_station.description=Trace un itinéraire vers la station la plus proche où le vaisseau peut s'amarrer et faire le plein, pour un vaisseau sans récupérateur de carburant.
command.find_guardian_technology_broker.name=Trouver un courtier en technologie Guardian
command.find_guardian_technology_broker.description=Trace un itinéraire vers le courtier en technologie Guardian le plus proche, qui débloque les modules et armes Guardian.
command.find_human_technology_broker.name=Trouver un courtier en technologie humaine
command.find_human_technology_broker.description=Trace un itinéraire vers le courtier en technologie humaine le plus proche, qui débloque ses modules.
command.find_interstellar_factor.name=Trouver un Interstellar Factors
command.find_interstellar_factor.description=Trace un itinéraire vers le contact Interstellar Factors le plus proche pour régler primes et amendes.
command.find_manufactured_material_trader.name=Trouver un négociant en matériaux manufacturés
command.find_manufactured_material_trader.description=Trace un itinéraire vers le négociant en matériaux manufacturés le plus proche.
command.find_mining_site.name=Trouver un site de minage
command.find_mining_site.description=Trace un itinéraire vers l'anneau ou le champ d'astéroïdes vierge le plus proche contenant la marchandise indiquée, dans la distance indiquée.
command.find_mission_commodity.name=Trouver la marchandise de mission
command.find_mission_commodity.description=Trouve où acheter la cargaison qu'une mission active demande encore et trace l'itinéraire ; le tableau des missions est lu directement.
command.find_nearest_fleet_carrier.name=Trouver le porte-vaisseaux le plus proche
command.find_nearest_fleet_carrier.description=Indique le porte-vaisseaux le plus proche à portée, autre que le vôtre.
command.find_pirate_massacre_missions.name=Trouver des missions de massacre de pirates
command.find_pirate_massacre_missions.description=Indique où cumuler des missions de massacre de pirates : un système donneur dont les factions visent un système doté de sites d'extraction, dans la portée indiquée.
command.find_powerplay_conflict_zone_for_merits.name=Trouver une zone de conflit Powerplay
