command.trade_profile_set_budget.name=Profil commercial : budget de départ
command.trade_profile_set_budget.description=Définit le budget de départ que la recherche d'itinéraire commercial peut dépenser.
command.trade_profile_set_max_distance.name=Profil commercial : distance maximale
command.trade_profile_set_max_distance.description=Définit à quelle distance du point d'arrivée, en secondes-lumière, une station commerciale peut se trouver.
command.trade_profile_set_max_stops.name=Profil commercial : étapes maximales
command.trade_profile_set_max_stops.description=Définit le nombre maximal d'étapes d'un itinéraire commercial.
command.trade_profile_toggle_permit_systems.name=Profil commercial : systèmes à permis oui/non
command.trade_profile_toggle_permit_systems.description=Autorise ou interdit les systèmes à permis dans la recherche d'itinéraire commercial.
command.trade_profile_toggle_planetary_ports.name=Profil commercial : ports planétaires oui/non
command.trade_profile_toggle_planetary_ports.description=Autorise ou interdit les ports planétaires dans la recherche d'itinéraire commercial.
command.trade_profile_toggle_prohibited_cargo.name=Profil commercial : cargaison illégale oui/non
command.trade_profile_toggle_prohibited_cargo.description=Autorise ou interdit les marchandises illégales dans la recherche d'itinéraire commercial.
command.trade_profile_toggle_strongholds.name=Profil commercial : bastions oui/non
command.trade_profile_toggle_strongholds.description=Autorise ou interdit les bastions Powerplay dans la recherche d'itinéraire commercial.
command.transfer_power_to_engines.name=Énergie aux moteurs
command.transfer_power_to_engines.description=Met le maximum d'énergie dans les moteurs pour la vitesse et le boost.
command.transfer_power_to_shields.name=Énergie aux boucliers
command.transfer_power_to_shields.description=Met le maximum d'énergie dans les systèmes, ce qui renforce les boucliers.
command.transfer_power_to_ship_systems.name=Énergie aux systèmes
command.transfer_power_to_ship_systems.description=Met le maximum d'énergie dans les systèmes ; identique à l'énergie aux boucliers.
command.transfer_power_to_weapons.name=Énergie aux armes
command.transfer_power_to_weapons.description=Met le maximum d'énergie dans les armes.
command.wakeup.name=Réveil
command.wakeup.description=Réveille VEGA pour qu'elle écoute de nouveau les commandes vocales.
command.wing_nav_lock.name=Verrouillage de navigation d'escadrille
command.wing_nav_lock.description=Se verrouille sur le FSD d'un ailier pour le suivre en supernavigation et en saut.
query.query_bio_scans_and_samples_in_star_system.name=Analyses biologiques du système
query.query_bio_scans_and_samples_in_star_system.description=Indique la progression des analyses biologiques du système : quels corps ont des signaux biologiques et lesquels restent à analyser.
query.query_biome_analysis.name=Analyse du biome
query.query_biome_analysis.description=Analyse le biome d'une planète, ou de toutes les planètes à signaux biologiques du système, et prédit les organismes probables.
query.query_cargo_hold_contents.name=Contenu de la soute
query.query_cargo_hold_contents.description=Indique le contenu de la soute et sa capacité totale.
query.query_carrier_departure_eta.name=Délai de saut du porte-vaisseaux
query.query_carrier_departure_eta.description=Indique le temps restant avant le prochain saut prévu du porte-vaisseaux.
query.query_carrier_status.name=État du porte-vaisseaux
query.query_carrier_status.description=Indique le tritium et la réserve, la portée de saut et les finances d'un porte-vaisseaux : le vôtre, ou celui de l'escadron si vous le précisez.
query.query_carrier_voyage.name=Progression de l'itinéraire du porte-vaisseaux
query.query_carrier_voyage.description=Analyse l'itinéraire déjà tracé d'un porte-vaisseaux : destination, sauts restants, durée, tritium nécessaire et où le ravitailler en route.
query.query_carriers.name=Porte-vaisseaux du système
query.query_carriers.description=Indique les porte-vaisseaux du système : nombre, noms, marchés et services.
query.query_construction_site_progress.name=Avancement du chantier
query.query_construction_site_progress.description=Indique l'avancement de votre chantier : ce qu'il lui manque, combien de tonnes de chaque, et ce que vous transportez déjà pour lui.
query.query_current_location.name=Position actuelle
query.query_current_location.description=Indique où vous êtes et à quoi ressemble l'endroit : système, corps, amarré ou posé, sécurité, factions, gravité, atmosphère et température.
query.query_distance_to_bio_sample.name=Distance au dernier échantillon biologique
query.query_distance_to_bio_sample.description=Indique la distance au dernier échantillon biologique, pour respecter l'écart entre échantillons.
query.query_distance_to_body.name=Distance au corps céleste
query.query_distance_to_body.description=Indique la distance en secondes-lumière d'un corps ou d'une station du système que vous nommez.
query.query_distance_to_bubble_earth_sol_civilization.name=Distance à la Bulle
query.query_distance_to_bubble_earth_sol_civilization.description=Indique la distance qui vous sépare de l'espace habité, la Bulle autour de Sol.
query.query_distance_to_carrier.name=Distance au porte-vaisseaux
query.query_distance_to_carrier.description=Indique la distance qui vous sépare de votre porte-vaisseaux.
query.query_exobiology_samples.name=Exobiologie sur cette planète
query.query_exobiology_samples.description=Indique les analyses organiques sur cette planète : espèces échantillonnées et ce qui reste à analyser.
query.query_exploration_profits.name=Gains d'exploration
query.query_exploration_profits.description=Indique les gains d'exobiologie : crédits gagnés pendant la session face à ce que le système rapporterait si toutes les espèces étaient analysées.
query.query_fsd_target.name=Cible du FSD
query.query_fsd_target.description=Indique la destination de saut ciblée : l'étoile, sa classe et si elle permet de récupérer du carburant.
query.query_general_conversation.name=Conversation générale
query.query_general_conversation.description=Une simple conversation avec VEGA, pour tout ce qui n'est ni une commande ni une question sur le jeu.
query.query_geo_signals.name=Signaux géologiques
query.query_geo_signals.description=Indique les sites géologiques et volcaniques détectés sur les corps du système.
query.query_last_scan.name=Dernière analyse
query.query_last_scan.description=Indique le dernier corps céleste analysé et ses détails.
query.query_local_outfitting.name=Équipement local
query.query_local_outfitting.description=Indique les modules en vente à l'équipement de cette station.
query.query_markets.name=Marchés locaux
query.query_markets.description=Liste les stations et colonies du système et celles qui ont un marché, un chantier naval ou un équipement ; sans les prix.
query.query_material_inventory.name=Inventaire des matériaux
query.query_material_inventory.description=Indique la quantité que vous possédez d'un matériau d'ingénierie ou d'une marchandise.
query.query_missions_and_rewards.name=Missions et récompenses
query.query_missions_and_rewards.description=Indique vos missions actives : faction, objectif, destination, récompense et échéance, éventuellement pour un seul système.
query.query_pirate_mission.name=Progression de la mission de massacre
query.query_pirate_mission.description=Indique la progression des missions de massacre : éliminations restantes par faction et au total, et la récompense cumulée.
query.query_planet_materials.name=Matériaux de la planète
query.query_planet_materials.description=Indique les matières premières de la planète actuelle ou ciblée et leurs pourcentages.
query.query_player_profile_rank_progress.name=Progression des rangs
query.query_player_profile_rank_progress.description=Indique vos rangs et votre progression vers le rang suivant dans chacun.
query.query_population.name=Population
query.query_population.description=Indique combien de personnes vivent là où vous êtes : le système, ou une estimation pour la station ou la planète.
query.query_reminder.name=Rappel
query.query_reminder.description=Indique votre rappel actif : la course enregistrée - où aller, quoi acheter ou récupérer, où le vendre.
query.query_ship_loadout.name=Configuration du vaisseau
query.query_ship_loadout.description=Indique les modules et armes installés sur le vaisseau, ou si un module donné est à bord.
query.query_ship_route_remaining_jumps.name=Itinéraire tracé
query.query_ship_route_remaining_jumps.description=Indique l'itinéraire tracé du vaisseau : prochaine étape, sauts restants, distance restante, et si la prochaine étoile permet de récupérer du carburant.
query.query_signals_in_star_system.name=Signaux du système
query.query_signals_in_star_system.description=Indique les signaux notables du système : sites d'extraction, zones de conflit, points chauds de minage et signaux de surface.
query.query_station_details.name=Détails de la station
query.query_station_details.description=Indique les services de la station où vous êtes, ou si un service donné est proposé.
query.query_stations.name=Stations du système
query.query_stations.description=Indique les stations, avant-postes et colonies où s'amarrer dans le système.
query.query_stellar_objects.name=Corps célestes du système
query.query_stellar_objects.description=Liste les corps du système (atterrissables, type, gravité, atmosphère, anneaux, signaux) ou détaille celui que vous nommez.
query.query_system_security.name=Sécurité du système
query.query_system_security.description=Indique le niveau de sécurité du système, la faction dominante, l'allégeance et le contrôle Powerplay.
query.query_time.name=Heure actuelle
query.query_time.description=Indique l'heure UTC réelle et l'heure galactique du jeu.
query.query_total_bounties.name=Primes collectées
query.query_total_bounties.description=Indique les bons de prime collectés pendant cette session.
query.query_trade_profile.name=Profil commercial
query.query_trade_profile.description=Indique les réglages de la recherche d'itinéraire commercial : budget, étapes, distance, et types de systèmes et de cargaison autorisés.
query.query_trade_route.name=Itinéraire commercial actuel
query.query_trade_route.description=Indique l'itinéraire commercial prévu : étapes, quoi acheter et vendre, et le bénéfice attendu.
query.query_vega_self_diagnostic.name=Autodiagnostic de VEGA
query.query_vega_self_diagnostic.description=Teste la connexion au modèle d'IA et indique s'il répond et à quelle vitesse.
