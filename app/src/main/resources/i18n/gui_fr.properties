speech.setup.noBindingsYet=Commandant, vos fichiers de configuration des commandes n'ont pas encore été créés. Terminez votre formation de commandant, puis dans Options, Commandes, réglez les déplacements de l'interface de la carte galactique sur les touches fléchées et appliquez. Ensuite, je pourrai lire vos commandes. En attendant, je ne peux pas piloter votre vaisseau.
