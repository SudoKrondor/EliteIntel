# Game clock disagreement dialog (GameClockWarning)
gameClock.dialog.title=Les horloges du jeu et du PC ne concordent pas
gameClock.dialog.body=Elite Dangerous et votre PC ne sont pas d''accord sur l''heure actuelle : l''écart est de {0}.
gameClock.dialog.cause.timeZone=Cela arrive souvent après une mise à jour de Windows qui change le fuseau horaire ou le réglage de l'heure d'été.
gameClock.dialog.cause.drift=L'horloge du PC a très probablement dérivé, car Windows ne la compare à l'heure exacte que de temps en temps.
gameClock.dialog.amount.hours={0,choice,1#1 heure|1<{0} heures}
gameClock.dialog.amount.minutes={0,choice,1#environ 1 minute|1<environ {0} minutes}
gameClock.dialog.consequences=EliteIntel compense l'écart, mais pas à chaque instant. Tant que l'horloge n'est pas corrigée, attendez-vous à :\n  - des événements du jeu manqués dans les premiers instants après le démarrage d'EliteIntel\n  - des événements du jeu manqués pendant un moment après un changement de l'horloge du PC\nD'autres outils Elite Dangerous sur ce PC risquent de ne pas le compenser du tout.
gameClock.dialog.fix.timeZone=Pour corriger :\n  1. Ouvrez Paramètres Windows > Heure et langue > Date et heure.\n  2. Choisissez votre fuseau horaire correct.\n  3. Activez "Régler l'heure automatiquement" et "Ajuster l'heure d'été automatiquement".\n  4. Cliquez sur "Synchroniser maintenant".\n  5. Redémarrez Elite Dangerous.
gameClock.dialog.fix.sync=Pour corriger :\n  1. Ouvrez Paramètres Windows > Heure et langue > Date et heure.\n  2. Activez "Régler l'heure automatiquement".\n  3. Cliquez sur "Synchroniser maintenant".\n  4. Redémarrez Elite Dangerous.
gameClock.dialog.check=Pour vérifier : l'horloge du HUD du jeu et celle de l'onglet principal d'EliteIntel doivent afficher la même heure.
