speech.setup.noJournals=Attention, commandant. Je ne trouve aucun fichier journal d'Elite Dangerous à l'endroit où je cherche. Tant que le dossier des journaux n'est pas correctement défini, je suis aveugle à tout ce qui se passe autour de votre vaisseau. Vous pouvez le définir dans l'onglet Commandant.
