# Display names and descriptions of the built-in commands and queries (Actions > Built-in Commands, details dialog).
# CommandCatalog reads command.<id>.name/.description and query.<id>.name/.description - every registered id needs both in every bundle.
command.activate_ui_control.name=Activer l'élément d'interface
command.activate_ui_control.description=Appuie sur la touche de sélection du jeu sur la commande qui a actuellement le focus.
command.add_mining_target.name=Ajouter une cible de minage
command.add_mining_target.description=Ajoute une marchandise minable, comme le platine ou la painite, à la liste de prospection : VEGA l'annonce dès qu'un prospecteur la trouve.
command.allow_star_system_in_searches_again.name=Réautoriser le système dans les recherches
command.allow_star_system_in_searches_again.description=Réautorise le système stellaire actuel dans les résultats de recherche après son exclusion.
command.bookmark_current_location.name=Ajouter la position actuelle aux signets
command.bookmark_current_location.description=Enregistre votre position actuelle (système, station, planète ou point de surface) comme signet pour y revenir plus tard.
command.calculate_fleet_carrier_route.name=Calculer l'itinéraire du porte-vaisseaux
command.calculate_fleet_carrier_route.description=Trace un nouvel itinéraire en plusieurs sauts pour votre porte-vaisseaux vers le système copié dans le presse-papiers, en remplaçant l'itinéraire existant.
command.calculate_neutron_star_route.name=Calculer un itinéraire par étoiles à neutrons
command.calculate_neutron_star_route.description=Trace un itinéraire boosté par étoiles à neutrons vers le système copié depuis la carte galactique ; l'efficacité et la surcharge peuvent être précisées.
command.calculate_trade_route.name=Calculer un itinéraire commercial
command.calculate_trade_route.description=Calcule un itinéraire commercial rentable en plusieurs étapes à partir de votre profil commercial : budget, capacité de soute, étapes et distance.
command.cancel_navigation.name=Annuler la navigation
command.cancel_navigation.description=Désactive le guidage de navigation ou de cible de surface en cours.
command.cancel_trade_route.name=Annuler l'itinéraire commercial
command.cancel_trade_route.description=Efface l'itinéraire commercial actuellement planifié.
command.clear_active_missions.name=Effacer les missions actives
command.clear_active_missions.description=Vide la liste des missions suivies par l'application ; les missions restent actives dans le jeu.
command.clear_fleet_carrier_route.name=Effacer l'itinéraire du porte-vaisseaux
command.clear_fleet_carrier_route.description=Abandonne l'itinéraire tracé du porte-vaisseaux : plus aucune étape, destination ni compte à rebours de saut.
command.clear_mining_targets.name=Effacer les cibles de minage
command.clear_mining_targets.description=Retire toutes les marchandises de la liste de prospection.
command.clear_neutron_route.name=Effacer l'itinéraire par étoiles à neutrons
command.clear_neutron_route.description=Supprime les étapes enregistrées de l'itinéraire par étoiles à neutrons.
command.clear_reminders.name=Effacer les rappels
command.clear_reminders.description=Supprime tous les rappels : la course enregistrée, les rappels minutés, l'astuce commerciale de l'itinéraire et le dernier résultat de recherche de marchandise.
command.close_location_bookmarks.name=Fermer les signets
command.close_location_bookmarks.description=Ferme la liste des signets sur la surcouche HUD.
command.cycle_next_page.name=Page suivante
command.cycle_next_page.description=Passe à la page suivante du panneau de jeu ouvert.
command.cycle_next_panel.name=Onglet suivant
command.cycle_next_panel.description=Passe à l'onglet suivant du panneau de jeu ouvert.
command.cycle_previous_page.name=Page précédente
command.cycle_previous_page.description=Revient à la page précédente du panneau de jeu ouvert.
command.cycle_previous_panel.name=Onglet précédent
command.cycle_previous_panel.description=Revient à l'onglet précédent du panneau de jeu ouvert.
command.decrease_speed.name=Réduire la vitesse
command.decrease_speed.description=Réduit les gaz du nombre de crans indiqué.
command.delete_codex_entry.name=Supprimer l'entrée du Codex
command.delete_codex_entry.description=Supprime l'entrée du Codex ou d'échantillon biologique suivie et arrête le guidage vers elle.
command.delete_location_bookmark.name=Supprimer un signet
command.delete_location_bookmark.description=Supprime le signet portant le numéro indiqué dans la liste des signets.
command.deploy_chaff.name=Lancer des paillettes
command.deploy_chaff.description=Lance des paillettes pour rompre le verrouillage des missiles et des armes à cardan.
command.deploy_fighter.name=Déployer le chasseur
command.deploy_fighter.description=Lance un chasseur depuis le hangar pendant que vous pilotez le vaisseau principal.
command.deploy_hardpoints.name=Déployer les points d'emport
command.deploy_hardpoints.description=Déploie les points d'emport : armes, mais aussi lasers de minage, contrôleurs de drones et scanners en ont besoin.
command.deploy_heat_sink.name=Lancer un dissipateur thermique
command.deploy_heat_sink.description=Lance un dissipateur thermique pour évacuer la chaleur et refroidir le vaisseau.
command.deploy_landing_gear.name=Sortir le train d'atterrissage
command.deploy_landing_gear.description=Sort le train d'atterrissage pour l'amarrage ou l'atterrissage.
command.deploy_shield_cell.name=Utiliser une cellule de bouclier
command.deploy_shield_cell.description=Utilise une cellule de bouclier pour recharger les boucliers.
command.deploy_vehicle_srv.name=Déployer le VRS
command.deploy_vehicle_srv.description=Déploie un VRS depuis le hangar du vaisseau ; précisez le véhicule ou la baie, sinon la baie 1 est utilisée.
command.disembark.name=Débarquer
command.disembark.description=Quitte le vaisseau ou le VRS pour continuer à pied.
command.dismiss_construction_site.name=Oublier le chantier
command.dismiss_construction_site.description=Arrête le suivi du dernier chantier où vous vous êtes amarré : il quitte le HUD et VEGA ne propose plus d'achats ni de navigation pour lui.
command.dismiss_ship_to_orbit.name=Renvoyer le vaisseau
command.dismiss_ship_to_orbit.description=Renvoie le vaisseau en orbite pendant que vous êtes en VRS ou à pied.
command.display_fleet_carrier_management_panel.name=Gestion du porte-vaisseaux
command.display_fleet_carrier_management_panel.description=Ouvre le panneau de gestion du porte-vaisseaux.
command.display_open_galaxy_map.name=Ouvrir la carte galactique
command.display_open_galaxy_map.description=Ouvre la carte galactique.
command.display_open_system_map.name=Ouvrir la carte du système
command.display_open_system_map.description=Ouvre la carte du système.
command.display_radar_panel.name=Panneau radar
command.display_radar_panel.description=Ouvre le panneau radar et capteurs.
command.drive_assist.name=Assistance à la conduite
command.drive_assist.description=Active ou désactive l'assistance à la conduite du VRS, ou l'inverse si rien n'est précisé.
command.drop_from_super_cruise.name=Quitter la supernavigation
command.drop_from_super_cruise.description=Quitte la supernavigation pour revenir en espace normal.
command.enter_fleet_carrier_destination.name=Saisir la destination du porte-vaisseaux
command.enter_fleet_carrier_destination.description=Saisit le système de la prochaine étape dans le champ de navigation du porte-vaisseaux et le confirme ; à utiliser après le calcul de l'itinéraire.
command.enter_super_cruise.name=Passer en supernavigation
command.enter_super_cruise.description=Passe en supernavigation ; si elle est déjà active, cible le prochain système de l'itinéraire et saute.
command.equalize_power.name=Équilibrer l'énergie
command.equalize_power.description=Rééquilibre le distributeur d'énergie entre systèmes, moteurs et armes.
command.exclude_star_system_from_searches.name=Exclure le système des recherches
command.exclude_star_system_from_searches.description=Exclut désormais un système stellaire de toutes les recherches, quand une station proposée là-bas n'existe pas ou est inutilisable.
command.exit_close.name=Fermer le panneau ou la carte
