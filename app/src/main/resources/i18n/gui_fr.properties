journalImport.intro=Elite Intel apprend de vos journaux pendant que vous volez : fournisseurs de missions de massacre de pirates, sites d'extraction de ressources, corps que vous avez découverts et cartographiés, exobiologie que vous avez échantillonnée, et noms des nouveaux matériaux et marchandises. Si vous avez conservé d'anciens journaux ailleurs, ajoutez ici les dossiers ou archives et l'application en apprendra aussi. Les archives zip, 7z et tar sont lues, non compressées ou compressées en gzip, bzip2 ou xz, et tout ce qui n'est pas un journal est ignoré. Chaque commandant trouvé est importé dans ses propres données. Rien ne change de l'endroit où vous êtes ni de ce que vous transportez, et importer deux fois les mêmes journaux est sans conséquence.
