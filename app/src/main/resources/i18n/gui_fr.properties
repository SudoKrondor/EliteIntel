# Preset Editor (P4)
bindings.tab.presetEditor=Éditeur de presets
bindings.presetEditor.title=Configuration de preset active
bindings.presetEditor.intro=Le jeu lit séparément quatre sections de commandes, et chacune charge le fichier binds que nomme sa ligne. Pointez chacune vers un fichier binds, ou mettez-les toutes sur le même. Les listes montrent des BindNames, pas des noms de fichier : Custom.4.2.binds apparaît comme Custom. Les modifications sont écrites quand vous appuyez sur APPLY en haut.\n\nVEGA lit les touches qu'il utilise dans un seul fichier binds. Si ces quatre sections utilisent des fichiers binds différents, une commande d'un autre fichier peut avoir d'autres touches, et VEGA appuiera sur les mauvaises touches dans le jeu. Réglez les quatre sur le même fichier : vous êtes prévenu.
bindings.presetEditor.setAll=Tout mettre pareil
bindings.presetEditor.setAll.tooltip=Pointer les quatre sections vers le fichier binds choisi à côté de ce bouton.
