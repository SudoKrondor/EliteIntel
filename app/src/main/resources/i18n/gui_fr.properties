# Meaning and MessageFormat escaping are verified; phrasing is not. Delete these two lines once a native speaker signs it off.
speech.bindingConflictsBlocking=Commandant, conflit de commandes critique. Les commandes de déplacement dans la carte galactique et de navigation dans l''interface utilisent {0,choice,1#la même touche|1<les mêmes touches}, {1}. Le tracé d''itinéraire ne fonctionnera pas tant que ces commandes n''auront pas des touches distinctes. Les touches concernées figurent sous BindForge, puis Éditeur de raccourcis, puis Anomalies.
speech.bindingGeneralPresetNotRead=Commandant, vos commandes générales utilisent le préréglage {0}, qui n''a aucun fichier enregistré, je lis donc {1} à la place. Les touches que j''utilise pour la carte galactique et l''interface ne sont peut-être pas celles du jeu, et le tracé d''itinéraire peut échouer. Pour corriger cela, ouvrez Options, puis Commandes dans le jeu, et réglez les commandes générales sur {1}.
speech.bindingSectionsNotRead=Commandant, ces commandes utilisent un autre préréglage que {1}, celui que je lis : {0}. Les touches que j''utilise pour elles ne sont peut-être pas celles du jeu. Pour corriger cela, ouvrez Options, puis Commandes dans le jeu, et réglez-les sur {1}. Ou ouvrez l''onglet BindForge pour choisir le fichier que je lis.
speech.bindingReservedGameMenu=Commandant, le menu du jeu est associé à {1}. Elite ouvre ce menu avec toute combinaison de touches qui se termine par {1}. {0,choice,1#La commande associée à {2} ne peut pas être utilisée|1<Les commandes associées à {2} ne peuvent pas être utilisées} sans vous renvoyer à l''écran des options. Pour corriger le problème, supprimez l''attribution de la touche du menu dans les options de commandes du jeu. Échap ouvre déjà ce menu. Les touches concernées figurent dans l''affichage système.
speech.bindingReservedOsChord=Commandant, {0,choice,1#une commande utilise|1<{0} commandes utilisent} une combinaison de touches interceptée par votre système d''exploitation avant d''atteindre le jeu : {1}. Cette combinaison peut fermer le jeu ou mettre fin à votre session. Attribuez {0,choice,1#cette commande|1<ces commandes} à une autre touche dans les options de commandes du jeu. Les touches concernées figurent dans l''affichage système.
speech.warning.journalDirectoryMissing=Attention. Le répertoire des journaux d'Elite Dangerous est introuvable. Veuillez vérifier le répertoire des journaux dans l'onglet Commandant.
speech.warning.journalFilesMissing=Attention. Aucun fichier journal trouvé dans le répertoire configuré. Veuillez vérifier le répertoire des journaux dans l'onglet Commandant.
