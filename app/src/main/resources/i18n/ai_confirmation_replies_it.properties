# The commander's answer to a destructive-action confirmation (see ConfirmationReplies)
# An answer must OPEN with one of these phrases. A negative wins over an affirmative. English applies in every language.
affirmative=sì, si, certo, vai, procedi, confermo, confermato, affermativo, esatto, d'accordo, ok, okay, fallo, va bene, certamente, assolutamente, sicuro
negative=no, negativo, aspetta, fermo, fermati, stop, lascia stare, lascia perdere, non farlo, meglio di no, per niente
