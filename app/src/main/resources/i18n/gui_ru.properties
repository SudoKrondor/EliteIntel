command.show_transactions_panel.name=Панель транзакций
command.show_transactions_panel.description=Открывает панель транзакций: активные миссии и транзакции.
command.shuffle_music_tracks.name=Перемешать музыку
command.shuffle_music_tracks.description=Включает музыку в случайном порядке или снова по порядку плейлиста.
command.skip_to_next_music_track.name=Следующий трек
command.skip_to_next_music_track.description=Переключает на следующий трек плейлиста.
command.sleep_ignore_do_not_monitor.name=Спящий режим
