speech.bindingConflictsBlocking=Командир, критический конфликт привязок. Управление галактической картой и навигация по интерфейсу назначены на {0,choice,1#одну и ту же клавишу|1<одни и те же клавиши} - {1}. Прокладка маршрута не заработает, пока у карты и интерфейса не будет отдельных клавиш. Точные привязки указаны в системном выводе.
speech.bindingReservedGameMenu=Командир, ваше игровое меню назначено на {1}. Elite открывает его при любой комбинации, оканчивающейся на {1}, поэтому {0,choice,1#команду на {2} нельзя нажать|1<{0} команд на {2} нельзя нажать}, не оказавшись в экране настроек. Решение одно: удалите привязку игрового меню в настройках игры, в разделе управления. Escape открывает это меню и так. Точные привязки указаны в системном выводе.
speech.bindingReservedOsChord=Командир, {0,choice,1#одна команда назначена|1<{0} команд назначено} на комбинацию клавиш, которую ваша операционная система перехватывает раньше игры - {1}. Нажатие закрывает игру или вовсе завершает сеанс. Решение: назначьте {0,choice,1#эту команду|1<эти команды} на другую клавишу в настройках игры, в разделе управления. Точные привязки указаны в системном выводе.
speech.bindingsAppliedReload=Привязки применены. Чтобы загрузить их, откройте и закройте экран управления в Elite Dangerous.
speech.warning.journalDirectoryMissing=Внимание. Каталог журналов Elite Dangerous не найден. Пожалуйста, проверьте каталог журналов в настройках.
speech.warning.journalFilesMissing=Внимание. В указанном каталоге не найдено файлов журнала. Пожалуйста, проверьте каталог журналов в настройках.
speech.warning.bindingsDirectoryMissing=Внимание. Каталог привязок клавиш не найден. Пожалуйста, проверьте каталог привязок в настройках.
speech.warning.bindingsFilesMissing=Внимание. В указанном каталоге не найдено файлов привязок клавиш. Пожалуйста, проверьте каталог привязок в настройках.
