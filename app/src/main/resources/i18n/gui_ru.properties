command.pause_music_playback.name=Пауза музыки
command.pause_music_playback.description=Ставит вашу музыку на паузу, сохраняя место в треке.
command.play_music.name=Включить музыку
command.play_music.description=Включает вашу музыку из плейлиста Jukebox или продолжает её с места паузы.
command.play_music_track_by_name.name=Включить трек по названию
command.play_music_track_by_name.description=Включает трек из вашего плейлиста по названию или исполнителю.
command.play_previous_music_track.name=Предыдущий трек
command.play_previous_music_track.description=Возвращается к предыдущему треку плейлиста.
command.plot_route_next_neutron_star_waypoint.name=Маршрут к следующей нейтронной точке
command.plot_route_next_neutron_star_waypoint.description=Прокладывает маршрут к следующей точке рассчитанного нейтронного маршрута.
command.previous_location_bookmarks_page.name=Предыдущая страница закладок
command.previous_location_bookmarks_page.description=Показывает предыдущую страницу закладок на оверлее HUD.
command.recover_srv_vehicle_get_on_board_ship.name=Вернуть SRV на борт
