# Display names and descriptions of the built-in commands and queries (Actions > Built-in Commands, details dialog).
# CommandCatalog reads command.<id>.name/.description and query.<id>.name/.description - every registered id needs both in every bundle.
command.activate_ui_control.name=Активировать элемент интерфейса
command.activate_ui_control.description=Нажимает в игре клавишу выбора на элементе, который сейчас в фокусе.
command.add_mining_target.name=Добавить цель добычи
command.add_mining_target.description=Добавляет добываемый товар, например платину или пейнит, в список разведки, чтобы VEGA сообщала о нём, когда его найдёт разведчик.
command.allow_star_system_in_searches_again.name=Снова разрешить систему в поиске
command.allow_star_system_in_searches_again.description=Снова допускает текущую звёздную систему в результаты поиска после её исключения.
command.bookmark_current_location.name=Добавить текущее место в закладки
command.bookmark_current_location.description=Сохраняет текущее место - систему, станцию, планету или точку на поверхности - как закладку, чтобы позже вернуться туда.
command.calculate_fleet_carrier_route.name=Рассчитать маршрут авианосца
command.calculate_fleet_carrier_route.description=Прокладывает новый маршрут из нескольких прыжков для вашего авианосца до системы из буфера обмена, заменяя уже проложенный.
command.calculate_neutron_star_route.name=Рассчитать нейтронный маршрут
command.calculate_neutron_star_route.description=Прокладывает маршрут с нейтронным ускорением до системы, скопированной с карты галактики; можно указать эффективность и попросить суперзаряд.
command.calculate_trade_route.name=Рассчитать торговый маршрут
command.calculate_trade_route.description=Рассчитывает выгодный торговый маршрут с несколькими остановками по сохранённому торговому профилю: бюджет, вместимость трюма, остановки и расстояние.
command.cancel_navigation.name=Отменить навигацию
command.cancel_navigation.description=Отключает текущее наведение по маршруту или к цели на поверхности.
command.cancel_trade_route.name=Отменить торговый маршрут
command.cancel_trade_route.description=Удаляет запланированный торговый маршрут.
command.clear_active_missions.name=Очистить активные миссии
command.clear_active_missions.description=Очищает список отслеживаемых приложением миссий; в игре сами миссии остаются активными.
command.clear_fleet_carrier_route.name=Очистить маршрут авианосца
command.clear_fleet_carrier_route.description=Отменяет проложенный маршрут авианосца: не остаётся ни этапов, ни цели, ни отсчёта до прыжка.
command.clear_mining_targets.name=Очистить цели добычи
command.clear_mining_targets.description=Убирает все товары из списка разведки.
command.clear_neutron_route.name=Очистить нейтронный маршрут
command.clear_neutron_route.description=Удаляет сохранённые точки нейтронного маршрута.
command.clear_reminders.name=Очистить напоминания
command.clear_reminders.description=Удаляет все напоминания: сохранённое поручение, таймеры, торговую подсказку по маршруту и последний результат поиска товара.
command.close_location_bookmarks.name=Закрыть закладки
command.close_location_bookmarks.description=Закрывает список закладок на оверлее HUD.
command.cycle_next_page.name=Следующая страница
command.cycle_next_page.description=Переходит на следующую страницу открытой игровой панели.
command.cycle_next_panel.name=Следующая вкладка
command.cycle_next_panel.description=Переходит на следующую вкладку открытой игровой панели.
command.cycle_previous_page.name=Предыдущая страница
command.cycle_previous_page.description=Переходит на предыдущую страницу открытой игровой панели.
command.cycle_previous_panel.name=Предыдущая вкладка
command.cycle_previous_panel.description=Переходит на предыдущую вкладку открытой игровой панели.
command.decrease_speed.name=Снизить скорость
command.decrease_speed.description=Снижает тягу на названное число делений.
command.delete_codex_entry.name=Удалить запись Кодекса
command.delete_codex_entry.description=Удаляет отслеживаемую запись Кодекса или биообразца и прекращает наведение на неё.
command.delete_location_bookmark.name=Удалить закладку
command.delete_location_bookmark.description=Удаляет закладку с названным номером из списка закладок.
command.deploy_chaff.name=Выпустить дипольные отражатели
command.deploy_chaff.description=Выпускает дипольные отражатели, чтобы сбить захват ракет и карданного оружия.
command.deploy_fighter.name=Выпустить истребитель
command.deploy_fighter.description=Выпускает истребитель из ангара, пока вы пилотируете основной корабль.
command.deploy_hardpoints.name=Выпустить оружие
command.deploy_hardpoints.description=Выпускает оружейные подвесы: они нужны не только оружию, но и горным лазерам, контроллерам дронов и сканерам.
command.deploy_heat_sink.name=Выпустить теплоотвод
command.deploy_heat_sink.description=Выпускает теплоотвод, чтобы сбросить тепло и охладить корабль.
command.deploy_landing_gear.name=Выпустить шасси
command.deploy_landing_gear.description=Выпускает шасси для стыковки или посадки.
command.deploy_shield_cell.name=Применить щитовую ячейку
command.deploy_shield_cell.description=Применяет щитовую ячейку, чтобы перезарядить щиты.
command.deploy_vehicle_srv.name=Высадить SRV
command.deploy_vehicle_srv.description=Высаживает SRV из ангара корабля; назовите машину или отсек, иначе будет использован отсек 1.
command.disembark.name=Выйти наружу
command.disembark.description=Покидает корабль или SRV, чтобы продолжить пешком.
command.dismiss_construction_site.name=Забыть стройплощадку
command.dismiss_construction_site.description=Прекращает отслеживать стройплощадку, у которой вы стыковались последней: она исчезает из HUD, и VEGA больше не предлагает закупки и маршрут к ней.
command.dismiss_ship_to_orbit.name=Отпустить корабль
command.dismiss_ship_to_orbit.description=Отправляет корабль на орбиту, пока вы в SRV или пешком.
command.display_fleet_carrier_management_panel.name=Управление авианосцем
command.display_fleet_carrier_management_panel.description=Открывает панель управления авианосцем.
command.display_open_galaxy_map.name=Открыть карту галактики
command.display_open_galaxy_map.description=Открывает карту галактики.
command.display_open_system_map.name=Открыть карту системы
command.display_open_system_map.description=Открывает карту системы.
command.display_radar_panel.name=Панель радара
command.display_radar_panel.description=Открывает панель радара и сенсоров.
command.drive_assist.name=Помощь при вождении
command.drive_assist.description=Включает или выключает помощь при вождении SRV, а если не уточнить - переключает её.
command.drop_from_super_cruise.name=Выйти из суперкруиза
command.drop_from_super_cruise.description=Выходит из суперкруиза в обычное пространство.
command.enter_fleet_carrier_destination.name=Ввести пункт назначения авианосца
command.enter_fleet_carrier_destination.description=Вводит систему следующего этапа в поле навигации авианосца и подтверждает её; используйте после расчёта маршрута.
command.enter_super_cruise.name=Войти в суперкруиз
command.enter_super_cruise.description=Включает суперкруиз; если он уже включён, наводится на следующую систему маршрута и прыгает.
command.equalize_power.name=Выровнять энергию
command.equalize_power.description=Возвращает распределитель энергии к равным делениям между системами, двигателями и оружием.
command.exclude_star_system_from_searches.name=Исключить систему из поиска
command.exclude_star_system_from_searches.description=Исключает звёздную систему из всех будущих поисков, если названная там станция не существует или непригодна.
command.exit_close.name=Закрыть панель или карту
command.exit_close.description=Закрывает открытую панель, меню или карту либо возвращает на шаг назад.
command.fighter_attack_target.name=Истребитель: атаковать мою цель
command.fighter_attack_target.description=Приказывает выпущенному истребителю атаковать вашу текущую цель.
command.fighter_defend.name=Истребитель: защищать корабль
command.fighter_defend.description=Приказывает выпущенному истребителю защищать ваш корабль.
command.fighter_fire_at_will.name=Истребитель: огонь по готовности
command.fighter_fire_at_will.description=Приказывает выпущенному истребителю свободно атаковать цели.
command.fighter_hold_fire.name=Истребитель: прекратить огонь
command.fighter_hold_fire.description=Приказывает выпущенному истребителю прекратить огонь.
command.fighter_return_to_ship.name=Истребитель: вернуться на корабль
command.fighter_return_to_ship.description=Приказывает выпущенному истребителю вернуться и пристыковаться к вашему кораблю.
command.find_bounty_hunting_ground.name=Найти охотничьи угодья за наградами
command.find_bounty_hunting_ground.description=Прокладывает маршрут к системе с зонами добычи ресурсов для охоты за головами, выбирая из уже посещённых систем в названном радиусе.
command.find_commodity.name=Найти товар для покупки
command.find_commodity.description=Находит, где купить товар или модуль в названном радиусе, и прокладывает маршрут - к ближайшему рынку или с лучшей ценой.
command.find_conflict_zone_for_combat_bonds.name=Найти зону конфликта
command.find_conflict_zone_for_combat_bonds.description=Прокладывает маршрут к системе с активными зонами конфликта, чтобы сражаться за фракцию и получать боевые облигации, - из войн, замеченных за последнюю неделю в названном радиусе.
command.find_construction_site_commodity.name=Найти товар для стройки
command.find_construction_site_commodity.description=Находит, где купить то, что больше всего нужно вашей стройке, и прокладывает маршрут к этому рынку; список стройки читается сам, товар называть не нужно.
command.find_encoded_material_trader.name=Найти торговца закодированными материалами
command.find_encoded_material_trader.description=Прокладывает маршрут к ближайшему торговцу закодированными материалами.
command.find_fuel_station.name=Найти заправочную станцию
command.find_fuel_station.description=Прокладывает маршрут к ближайшей станции, где можно пристыковаться и заправиться, - для корабля без топливозаборника.
command.find_guardian_technology_broker.name=Найти брокера технологий Стражей
command.find_guardian_technology_broker.description=Прокладывает маршрут к ближайшему брокеру технологий Стражей, который открывает их модули и оружие.
command.find_human_technology_broker.name=Найти брокера человеческих технологий
command.find_human_technology_broker.description=Прокладывает маршрут к ближайшему брокеру человеческих технологий, который открывает его модули.
command.find_interstellar_factor.name=Найти межзвёздного посредника
command.find_interstellar_factor.description=Прокладывает маршрут к ближайшему межзвёздному посреднику, чтобы погасить награды за голову и штрафы.
command.find_manufactured_material_trader.name=Найти торговца произведёнными материалами
command.find_manufactured_material_trader.description=Прокладывает маршрут к ближайшему торговцу произведёнными материалами.
command.find_mining_site.name=Найти место добычи
command.find_mining_site.description=Прокладывает маршрут к ближайшему нетронутому кольцу или астероидному полю с названным товаром в названном радиусе.
command.find_mission_commodity.name=Найти товар для миссии
command.find_mission_commodity.description=Находит, где купить груз, который ещё нужен активной миссии, и прокладывает маршрут; доска миссий читается сама, товар называть не нужно.
command.find_nearest_fleet_carrier.name=Найти ближайший авианосец
command.find_nearest_fleet_carrier.description=Сообщает о ближайшем авианосце в пределах досягаемости, кроме вашего.
command.find_pirate_massacre_missions.name=Найти миссии на истребление пиратов
command.find_pirate_massacre_missions.description=Сообщает, где можно набрать стопку миссий на истребление пиратов: система заказчиков, чьи фракции нацелены на систему с зонами добычи, в названном радиусе.
command.find_powerplay_conflict_zone_for_merits.name=Найти зону конфликта Powerplay
command.find_powerplay_conflict_zone_for_merits.description=Прокладывает маршрут к зоне конфликта Powerplay, где сражается ваша держава, чтобы заработать заслуги.
command.find_raw_material_trader.name=Найти торговца сырьём
command.find_raw_material_trader.description=Прокладывает маршрут к ближайшему торговцу сырьём.
command.find_shipyard_selling_ship.name=Найти верфь, продающую корабль
command.find_shipyard_selling_ship.description=Находит верфь, продающую названный корабль в названном радиусе, и прокладывает маршрут - к ближайшей или самой дешёвой.
command.find_vista_genomics.name=Найти Vista Genomics
command.find_vista_genomics.description=Прокладывает маршрут к ближайшему Vista Genomics, чтобы продать экзобиологические данные.
command.find_where_to_collect_raw_material.name=Найти, где добыть сырьё
command.find_where_to_collect_raw_material.description=Прокладывает маршрут к лучшему месту сбора названного сырья, например теллура: к мозговым деревьям, а если их нет - к самой богатой поверхности планеты.
command.find_where_to_sell_commodity.name=Найти, где продать товар
command.find_where_to_sell_commodity.description=Находит рынок со спросом на названный товар в названном радиусе и прокладывает маршрут - к ближайшему или самому щедрому покупателю.
command.flag_exo_mastery_system_harvested.name=Отметить систему как собранную
command.flag_exo_mastery_system_harvested.description=Отмечает, что вы уже собрали образцы со всех экзобиологических тел этой системы в прошлой сессии, чтобы маршрут Exo-Mastery больше её не предлагал.
command.forget_hunting_ground.name=Забыть охотничьи угодья
command.forget_hunting_ground.description=Забывает текущую систему как охотничьи угодья на пиратов: её больше не рекомендуют, как и заказчиков миссий, нацеленных на неё.
command.hide_hud_overlay.name=Скрыть оверлей HUD
command.hide_hud_overlay.description=Убирает оверлей HUD с экрана.
command.ignore_nonsensical_input.name=Игнорировать бессмысленный ввод
command.ignore_nonsensical_input.description=Используется, когда распознанная фраза бессмысленна: VEGA пропускает её, ничего не делая.
command.increase_speed.name=Увеличить скорость
command.increase_speed.description=Увеличивает тягу на названное число делений.
command.interrupt.name=Прервать
command.interrupt.description=Немедленно прерывает речь VEGA.
command.jump_to_hyperspace.name=Прыжок в гиперпространство
command.jump_to_hyperspace.description=Включает рамочно-сдвиговый двигатель для прыжка в следующую систему маршрута.
command.launch_deploy_nomad.name=Высадить Nomad
command.launch_deploy_nomad.description=Высаживает воздушный разведчик Nomad во время низкого полёта над планетой.
command.launch_ship_detach_from_station.name=Взлететь
command.launch_ship_detach_from_station.description=Отстыковывает корабль и взлетает с посадочной площадки.
command.monetize_route.name=Монетизировать маршрут
command.monetize_route.description=Находит выгодную пару «купить-продать» на проложенном маршруте и сохраняет её как напоминание, чтобы заработать по пути.
command.move_hud_overlay_to_screen_section.name=Переместить оверлей HUD
command.move_hud_overlay_to_screen_section.description=Перемещает карточку оверлея HUD в часть экрана по стороне света: север - вверх, юг - вниз, восток - вправо, запад - влево.
command.navigate_from_memory.name=Проложить маршрут из буфера обмена
command.navigate_from_memory.description=Прокладывает маршрут к звёздной системе, название которой скопировано в буфер обмена с сайта вроде INARA или Spansh.
command.navigate_to_active_mission.name=Маршрут к активной миссии
command.navigate_to_active_mission.description=Прокладывает маршрут к цели активной миссии; назовите миссию по ключевому слову, иначе берётся последняя миссия с целью.
command.navigate_to_bio_sample_codex_entry.name=Маршрут к биологической записи Кодекса
command.navigate_to_bio_sample_codex_entry.description=Ведёт вас по текущей планете к ближайшему сохранённому биообразцу или месту записи Кодекса.
command.navigate_to_construction_site.name=Маршрут к стройплощадке
command.navigate_to_construction_site.description=Прокладывает маршрут обратно к стройплощадке, которую вы снабжаете, - той, где вы стыковались последней.
command.navigate_to_coordinates.name=Маршрут по координатам
command.navigate_to_coordinates.description=Запускает наведение по поверхности к названным широте и долготе на текущей планете.
command.navigate_to_exo_mastery_site.name=Маршрут к месту экзобиологии
command.navigate_to_exo_mastery_site.description=Прокладывает маршрут к самой доходной неисследованной экзобиологической системе из списка Exo-Mastery и оставляет напоминание с планетами для посадки.
command.navigate_to_fleet_carrier.name=Маршрут к авианосцу
command.navigate_to_fleet_carrier.description=Прокладывает маршрут к последнему известному местоположению вашего авианосца, а если он неизвестен - к домашней системе.
command.navigate_to_home_system.name=Маршрут к домашней системе
command.navigate_to_home_system.description=Прокладывает маршрут к сохранённой домашней системе.
command.navigate_to_landing_zone.name=Маршрут к зоне посадки
command.navigate_to_landing_zone.description=Запускает наведение по поверхности обратно к сохранённой зоне посадки на текущей планете.
command.navigate_to_location_bookmark.name=Маршрут к закладке
command.navigate_to_location_bookmark.description=Прокладывает маршрут к закладке с названным номером из списка закладок.
command.navigate_to_next_trade_stop.name=Маршрут к следующей торговой точке
command.navigate_to_next_trade_stop.description=Прокладывает маршрут к следующей точке активного торгового маршрута - покупать или продавать в зависимости от груза.
command.navigate_to_pirate_mission_provider.name=Маршрут к заказчику пиратской миссии
command.navigate_to_pirate_mission_provider.description=Прокладывает маршрут к системе, выдающей миссии на истребление пиратов, - по вашим миссиям, текущим угодьям или лучшей известной паре.
command.navigate_to_pirate_mission_target.name=Маршрут к цели пиратской миссии
command.navigate_to_pirate_mission_target.description=Прокладывает маршрут к системе, где нужно истреблять пиратов по вашей активной миссии.
command.navigate_to_squadron_carrier.name=Маршрут к авианосцу эскадрильи
command.navigate_to_squadron_carrier.description=Прокладывает маршрут к авианосцу вашей эскадрильи.
command.navigate_to_star_system_or_place_named_aloud.name=Маршрут к месту по названию
command.navigate_to_star_system_or_place_named_aloud.description=Прокладывает маршрут к звёздной системе, станции или месту, которые вы называете вслух.
command.next_location_bookmarks_page.name=Следующая страница закладок
command.next_location_bookmarks_page.description=Показывает следующую страницу закладок на оверлее HUD.
command.open_fss_scan_system.name=Открыть FSS
