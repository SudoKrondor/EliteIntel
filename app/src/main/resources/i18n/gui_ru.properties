bindings.readOnly.override.confirm=Включить изменения, хотя установка отсутствует? Тогда «Применить» запишет файлы в имеющиеся установки. Когда отсутствующая вернётся, её сравнят при следующем запуске, и вы выберете, что оставить. Действует до закрытия Elite-Intel.
bindings.readOnly.refused=BindForge доступен только для чтения, пока отсутствует установка, поэтому ничего не изменено. Полоса над вкладками подскажет, что делать.
