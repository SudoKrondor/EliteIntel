command.trade_profile_set_max_stops.description=Задаёт максимальное число остановок торгового маршрута.
command.trade_profile_toggle_permit_systems.name=Торговый профиль: системы с допуском вкл/выкл
command.trade_profile_toggle_permit_systems.description=Разрешает или запрещает системы с допуском в поиске торгового маршрута.
command.trade_profile_toggle_planetary_ports.name=Торговый профиль: планетарные порты вкл/выкл
command.trade_profile_toggle_planetary_ports.description=Разрешает или запрещает планетарные порты в поиске торгового маршрута.
command.trade_profile_toggle_prohibited_cargo.name=Торговый профиль: запрещённый груз вкл/выкл
command.trade_profile_toggle_prohibited_cargo.description=Разрешает или запрещает нелегальные товары в поиске торгового маршрута.
command.trade_profile_toggle_strongholds.name=Торговый профиль: оплоты вкл/выкл
command.trade_profile_toggle_strongholds.description=Разрешает или запрещает оплоты Powerplay в поиске торгового маршрута.
command.transfer_power_to_engines.name=Энергию на двигатели
command.transfer_power_to_engines.description=Направляет максимум энергии на двигатели для скорости и форсажа.
command.transfer_power_to_shields.name=Энергию на щиты
command.transfer_power_to_shields.description=Направляет максимум энергии на системы, что усиливает щиты.
command.transfer_power_to_ship_systems.name=Энергию на системы
command.transfer_power_to_ship_systems.description=Направляет максимум энергии на системы - то же, что энергия на щиты.
command.transfer_power_to_weapons.name=Энергию на оружие
command.transfer_power_to_weapons.description=Направляет максимум энергии на оружие.
command.wakeup.name=Пробуждение
command.wakeup.description=Будит VEGA, чтобы она снова слушала голосовые команды.
command.wing_nav_lock.name=Навигационная привязка к звену
command.wing_nav_lock.description=Привязывается к двигателю ведомого, чтобы следовать за ним в суперкруиз и прыжки.
query.query_bio_scans_and_samples_in_star_system.name=Биосканы в системе
query.query_bio_scans_and_samples_in_star_system.description=Сообщает о ходе биосканирования в системе: на каких телах есть биосигналы и какие ещё нужно просканировать.
query.query_biome_analysis.name=Анализ биома
query.query_biome_analysis.description=Анализирует биом планеты или всех планет с биосигналами в системе и предсказывает вероятные организмы.
query.query_cargo_hold_contents.name=Содержимое трюма
query.query_cargo_hold_contents.description=Сообщает, что лежит в трюме, и общую вместимость.
query.query_carrier_departure_eta.name=Время до прыжка авианосца
query.query_carrier_departure_eta.description=Сообщает, сколько осталось до следующего запланированного прыжка авианосца.
query.query_carrier_status.name=Состояние авианосца
query.query_carrier_status.description=Сообщает запас и резерв трития, дальность прыжка и финансы авианосца - вашего или, если скажете, эскадрильи.
query.query_carrier_voyage.name=Ход маршрута авианосца
query.query_carrier_voyage.description=Анализирует уже проложенный маршрут авианосца: цель, оставшиеся прыжки, время в пути, нужный тритий и где можно заправиться по дороге.
query.query_carriers.name=Авианосцы в системе
query.query_carriers.description=Сообщает об авианосцах в системе: количество, названия, рынки и услуги.
query.query_construction_site_progress.name=Ход строительства
query.query_construction_site_progress.description=Сообщает о ходе вашей стройки: чего ещё не хватает, сколько тонн каждого товара и что уже везёте для неё.
query.query_current_location.name=Текущее местоположение
query.query_current_location.description=Сообщает, где вы находитесь и что это за место: система, тело, стыковка или посадка, безопасность, фракции, гравитация, атмосфера и температура.
query.query_distance_to_bio_sample.name=Расстояние до последнего биообразца
query.query_distance_to_bio_sample.description=Сообщает расстояние до последнего биообразца, чтобы соблюдать дистанцию между образцами.
query.query_distance_to_body.name=Расстояние до тела
query.query_distance_to_body.description=Сообщает расстояние в световых секундах до названного тела или станции в системе.
query.query_distance_to_bubble_earth_sol_civilization.name=Расстояние до Пузыря
query.query_distance_to_bubble_earth_sol_civilization.description=Сообщает расстояние до обжитого космоса - Пузыря вокруг Солнца.
query.query_distance_to_carrier.name=Расстояние до авианосца
query.query_distance_to_carrier.description=Сообщает расстояние до вашего авианосца.
query.query_exobiology_samples.name=Экзобиология на этой планете
query.query_exobiology_samples.description=Сообщает об органических сканах на этой планете: какие виды собраны и что осталось.
query.query_exploration_profits.name=Доход от исследований
query.query_exploration_profits.description=Сообщает доход от экзобиологии: заработанное за сессию против того, что принесла бы система при полном сканировании.
query.query_fsd_target.name=Цель FSD
query.query_fsd_target.description=Сообщает о выбранной цели прыжка: звезда, её класс и можно ли с неё собрать топливо.
query.query_general_conversation.name=Свободный разговор
query.query_general_conversation.description=Обычный разговор с VEGA - для всего, что не команда и не вопрос об игре.
query.query_geo_signals.name=Геологические сигналы
query.query_geo_signals.description=Сообщает об обнаруженных на телах системы геологических и вулканических объектах.
query.query_last_scan.name=Последнее сканирование
query.query_last_scan.description=Сообщает о последнем просканированном теле и его подробностях.
query.query_local_outfitting.name=Местное оснащение
query.query_local_outfitting.description=Сообщает, какие модули продаются в оснащении этой станции.
query.query_markets.name=Местные рынки
query.query_markets.description=Перечисляет станции и поселения системы и где есть рынок, верфь или оснащение; цены не сообщаются.
query.query_material_inventory.name=Запас материалов
query.query_material_inventory.description=Сообщает, сколько у вас инженерного материала или товара.
query.query_missions_and_rewards.name=Миссии и награды
query.query_missions_and_rewards.description=Сообщает об активных миссиях: фракция, задача, пункт назначения, награда и срок, при желании - по одной системе.
query.query_pirate_mission.name=Ход миссии на истребление
query.query_pirate_mission.description=Сообщает о ходе миссий на истребление: сколько убийств осталось по фракциям и всего, и общая награда.
query.query_planet_materials.name=Материалы на планете
query.query_planet_materials.description=Сообщает сырьё на текущей или выбранной планете и его доли.
query.query_player_profile_rank_progress.name=Прогресс рангов
query.query_player_profile_rank_progress.description=Сообщает ваши ранги и насколько вы близки к следующему в каждом.
query.query_population.name=Население
query.query_population.description=Сообщает, сколько людей живёт там, где вы: в системе или, по оценке, на станции либо планете.
query.query_reminder.name=Напоминание
query.query_reminder.description=Сообщает активное напоминание: сохранённое поручение - куда лететь, что купить или забрать, где продать.
query.query_ship_loadout.name=Оснащение корабля
query.query_ship_loadout.description=Сообщает установленные на корабле модули и оружие или есть ли на борту нужный модуль.
query.query_ship_route_remaining_jumps.name=Проложенный маршрут
query.query_ship_route_remaining_jumps.description=Сообщает проложенный маршрут корабля: следующую точку, оставшиеся прыжки, остаток пути и можно ли собрать топливо со следующей звезды.
query.query_signals_in_star_system.name=Сигналы в системе
query.query_signals_in_star_system.description=Сообщает заметные сигналы в системе: зоны добычи, зоны конфликта, горячие точки добычи и сигналы на поверхностях.
query.query_station_details.name=Сведения о станции
query.query_station_details.description=Сообщает услуги станции, где вы находитесь, или есть ли нужная услуга.
query.query_stations.name=Станции в системе
query.query_stations.description=Сообщает станции, аванпосты и поселения системы, где можно пристыковаться.
query.query_stellar_objects.name=Тела в системе
query.query_stellar_objects.description=Перечисляет тела системы - пригодность для посадки, тип, гравитация, атмосфера, кольца и сигналы - или подробности о названном.
query.query_system_security.name=Безопасность системы
query.query_system_security.description=Сообщает уровень безопасности системы, правящую фракцию, принадлежность и контроль Powerplay.
query.query_time.name=Текущее время
query.query_time.description=Сообщает текущее реальное время UTC и галактическое время игры.
query.query_total_bounties.name=Собранные награды за головы
query.query_total_bounties.description=Сообщает собранные за сессию ваучеры наград за головы.
query.query_trade_profile.name=Торговый профиль
query.query_trade_profile.description=Сообщает настройки поиска торгового маршрута: бюджет, остановки, расстояние и какие системы и грузы разрешены.
query.query_trade_route.name=Текущий торговый маршрут
query.query_trade_route.description=Сообщает запланированный торговый маршрут: остановки, что покупать и продавать и ожидаемую прибыль.
query.query_vega_self_diagnostic.name=Самодиагностика VEGA
query.query_vega_self_diagnostic.description=Проверяет связь с моделью ИИ и сообщает, отвечает ли она и как быстро.

# FrameShift Command integration (integration socket)
command.frameshift_open_page.name=Открыть страницу FrameShift
command.frameshift_open_page.description=Открывает страницу в приложении FrameShift Command, пока оно запущено и подключено к Elite Intel.
