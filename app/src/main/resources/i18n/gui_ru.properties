command.set_speed_25.name=Четверть газа
command.set_speed_25.description=Ставит тягу на 25 %.
command.set_speed_50.name=Половина газа
command.set_speed_50.description=Ставит тягу на 50 %.
command.set_speed_75.name=Три четверти газа
command.set_speed_75.description=Ставит тягу на 75 %.
command.set_speed_to_zero_0_stop_ship.name=Полная остановка
