command.remove_mining_target.name=Убрать цель добычи
command.remove_mining_target.description=Убирает названный товар из списка разведки.
command.request_docking.name=Запросить стыковку
command.request_docking.description=Запрашивает посадочную площадку у ближайшей станции или аванпоста.
command.reset_head_look_ahead.name=Сбросить обзор головой
command.reset_head_look_ahead.description=Возвращает камеру обзора головой прямо вперёд.
command.restart_music_playlist_from_first_track.name=Перезапустить плейлист
command.restart_music_playlist_from_first_track.description=Запускает плейлист заново с первого трека.
command.retract_hardpoints.name=Убрать оружие
