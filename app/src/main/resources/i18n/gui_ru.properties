gameClock.dialog.consequences=EliteIntel учитывает разницу, но не в каждый момент. Пока часы не исправлены, возможно:\n  - пропуск игровых событий в первые мгновения после запуска EliteIntel\n  - пропуск игровых событий на какое-то время после изменения часов ПК\nДругие инструменты для Elite Dangerous на этом ПК могут вовсе не учитывать разницу.
gameClock.dialog.fix.timeZone=Как исправить:\n  1. Откройте Параметры Windows > Время и язык > Дата и время.\n  2. Выберите правильный часовой пояс.\n  3. Включите «Установить время автоматически» и «Автоматически переходить на летнее время».\n  4. Нажмите «Синхронизировать».\n  5. Перезапустите Elite Dangerous.
gameClock.dialog.fix.sync=Как исправить:\n  1. Откройте Параметры Windows > Время и язык > Дата и время.\n  2. Включите «Установить время автоматически».\n  3. Нажмите «Синхронизировать».\n  4. Перезапустите Elite Dangerous.
gameClock.dialog.check=Как проверить: часы на HUD игры и часы на главной вкладке EliteIntel должны показывать одно и то же время.
