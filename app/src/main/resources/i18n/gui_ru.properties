gameClock.dialog.body=Elite Dangerous и ваш ПК расходятся в текущем времени на {0}.
gameClock.dialog.cause.timeZone=Так часто бывает после обновления Windows, которое меняет часовой пояс или настройку перехода на летнее время.
gameClock.dialog.cause.drift=Скорее всего, часы ПК ушли, потому что Windows сверяет их с точным временем лишь время от времени.
