journalImport.title=Импорт старых журналов
journalImport.intro=Elite Intel учится по вашим журналам, пока вы летаете: заказчики миссий на уничтожение пиратов, зоны добычи ресурсов, открытые и картографированные вами тела, собранные образцы экзобиологии, названия новых материалов и товаров. Если старые журналы хранятся где-то ещё, добавьте сюда папки или архивы, и приложение изучит и их. Читаются архивы zip, 7z и tar, как обычные, так и сжатые gzip, bzip2 или xz; всё, что не является журналом, пропускается. Каждый найденный командир импортируется в собственные записи. Ваше текущее местоположение и груз не меняются, а повторный импорт тех же журналов ничему не вредит.
