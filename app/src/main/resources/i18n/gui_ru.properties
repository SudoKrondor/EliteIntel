lmStudioInstall.amdBeta=Бета-версия для видеокарт AMD. Памяти вашей видеокарты хватает и на игру, и на модель, но на картах AMD эта настройка ещё не проверялась и может не сработать. Если какой-то шаг не удастся, отправьте, пожалуйста, пакет поддержки, чтобы мы могли это исправить.
