speech.bindingsMissing=Командир, {0} {0,choice,1#обязательная привязка не назначена|1<обязательных привязок не назначено}. Подробности смотрите в системном выводе приложения и на панели привязок в игре.
speech.bindingConflicts=Командир, {0} {0,choice,1#конфликт привязок обнаружен|1<конфликтов привязок обнаружено}. Некоторые элементы управления могут не работать. Откройте BindForge, затем Редактор привязок, затем Аномалии.
# NEEDS NATIVE REVIEW (2026-08-27): reworded when this warning started naming the actual conflicting keys.
# Meaning and MessageFormat escaping are verified; phrasing is not. Delete these two lines once a native speaker signs it off.
speech.bindingConflictsBlocking=Командир, критический конфликт привязок. Управление галактической картой и навигация по интерфейсу назначены на {0,choice,1#одну и ту же клавишу|1<одни и те же клавиши} - {1}. Прокладка маршрута не заработает, пока у карты и интерфейса не будет отдельных клавиш. Точные привязки указаны в разделе BindForge, затем Редактор привязок, затем Аномалии.
speech.bindingGeneralPresetNotRead=Командир, ваше общее управление использует профиль {0}, для которого нет сохранённого файла, поэтому я читаю {1}. Клавиши, которые я нажимаю для галактической карты и интерфейса, могут не совпадать с теми, что использует игра, и прокладка маршрута может не сработать. Чтобы исправить это, откройте в игре Настройки, затем Управление, и выберите для общего управления {1}.
speech.bindingSectionsNotRead=Командир, эти элементы управления используют другой профиль, не {1}, который я читаю: {0}. Клавиши, которые я для них нажимаю, могут не совпадать с теми, что использует игра. Чтобы исправить это, откройте в игре Настройки, затем Управление, и выберите для них {1}. Или откройте вкладку BindForge, чтобы выбрать, какой файл я читаю.
speech.bindingReservedGameMenu=Командир, ваше игровое меню назначено на {1}. Elite открывает его при любой комбинации, оканчивающейся на {1}, поэтому {0,choice,1#команду на {2} нельзя нажать|1<{0} команд на {2} нельзя нажать}, не оказавшись в экране настроек. Решение одно: удалите привязку игрового меню в настройках игры, в разделе управления. Escape открывает это меню и так. Точные привязки указаны в системном выводе.
speech.bindingReservedOsChord=Командир, {0,choice,1#одна команда назначена|1<{0} команд назначено} на комбинацию клавиш, которую ваша операционная система перехватывает раньше игры - {1}. Нажатие закрывает игру или вовсе завершает сеанс. Решение: назначьте {0,choice,1#эту команду|1<эти команды} на другую клавишу в настройках игры, в разделе управления. Точные привязки указаны в системном выводе.
speech.warning.journalDirectoryMissing=Внимание. Каталог журналов Elite Dangerous не найден. Пожалуйста, проверьте каталог журналов на вкладке Командир.
speech.warning.journalFilesMissing=Внимание. В указанном каталоге не найдено файлов журнала. Пожалуйста, проверьте каталог журналов на вкладке Командир.
speech.warning.bindingsDirectoryMissing=Внимание. Каталог привязок клавиш не найден. Пожалуйста, проверьте каталог привязок на вкладке BindForge.
speech.warning.bindingsFilesMissing=Внимание. В этой папке нет файла StartPreset, значит, это не папка привязок игры. Пожалуйста, выберите каталог привязок заново на вкладке BindForge.
speech.warning.noGameSession=Командир, игровая сессия не обнаружена. Ожидание.
speech.warning.journalReadError=Ошибка чтения журнала: {0}
speech.warning.bindingsDirectoryInaccessible=Ошибка. Каталог привязок клавиш недоступен.
speech.warning.bindingsStockPresetNoInstallation=Внимание. Вы используете стандартное управление игры, а я не могу найти вашу установку Elite Dangerous, чтобы его прочитать. Добавьте её в разделе «Установки игры» на вкладке BindForge или измените любую привязку в настройках управления игры, и я её подхвачу.
speech.warning.bindingsPresetFileMissing=Внимание. Я не могу найти файл привязок для профиля управления, который использует игра. Откройте в игре Настройки, затем Управление, сохраните привязки, и я их подхвачу.
speech.warning.bindingsUnreadable=Внимание. Мне не удалось прочитать ваш файл привязок клавиш. Откройте в игре Настройки, затем Управление, сохраните привязки ещё раз, и я их подхвачу.
speech.warning.uncataloguedMissionDetected={0}, я обнаружил миссию типа {1}, которую ещё не занёс в каталог.
