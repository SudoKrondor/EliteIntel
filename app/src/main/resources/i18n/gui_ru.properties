speech.sleepModeStartupNotice=Коммандер, я запускаюсь в режиме сна и не слушаю голосовой ввод. Скажите проснись или нажмите ПРОСНУТЬСЯ, когда я понадоблюсь.
speech.unsupportedLocalModel=Внимание, командир. Ваша локальная модель не Gemma 4 E4B, которая требуется этой версии. Приложение может работать некорректно или не работать вовсе.
speech.missingController=Контроллер {0} не подключён. Его привязки не загрузятся, пока он не будет подключён.
speech.missingControllers=Эти контроллеры не подключены: {0}. Их привязки не загрузятся, пока они не будут подключены.
speech.bindforgeBackedUp=BindForge сохранил резервную копию всех ваших файлов настройки управления в том виде, в каком они были до любых изменений BindForge.
speech.notOdyssey=Внимание, командир. Ваша игра запущена не в Odyssey. Это приложение создано для Elite Dangerous Odyssey, и большая его часть не будет работать в Horizons.
speech.gameClockDisagreement=Внимание, командир. Время на вашем ПК расходится с игровым больше чем на минуту. Пока это не исправлено, некоторые игровые события могут быть пропущены. Подробности - в приложении.
speech.setup.noLlm=Языковая модель ещё не настроена, поэтому я не могу ни понимать вас, ни отвечать. Настройте облачную модель или локальную модель Gemma 4 E4B, инструкции есть на сайте элит интел точка орг.
speech.setup.noLlmProvider=Внимание, коммандер. У вас выбрана облачная языковая модель, но не выбран облачный провайдер, поэтому я не могу вам отвечать. Откройте вкладку Сервисы ИИ, выберите провайдера из списка и сохраните.
speech.setup.noJournals=Внимание, коммандер. Я не нахожу файлов журнала Elite Dangerous там, где ищу. Пока папка журналов не указана правильно, я не вижу ничего, что происходит вокруг вашего корабля. Указать её можно на вкладке Командир.
speech.setup.noBindings=Внимание, коммандер. Я не нахожу файлов привязок управления там, где ищу. Пока папка привязок не указана правильно, я не могу управлять вашим кораблём. Указать её можно на вкладке BindForge.
speech.setup.noBindingsYet=Командир, файлы настройки вашего управления ещё не созданы. Завершите обучение командира, затем в Настройках, Управление, назначьте перемещение по интерфейсу галактической карты на клавиши со стрелками и примените. После этого я смогу прочитать ваше управление. А до тех пор я не могу управлять вашим кораблём.
speech.bindforge.changedOutside=Ваши файлы управления были изменены вне BindForge. Откройте BindForge, чтобы проверить их.
speech.bindforge.readOnly=BindForge доступен только для чтения: отсутствует установка Elite Dangerous - {0}. Подключите её диск и перезапустите Elite-Intel или уберите её в разделе «Установки игры».
speech.bindforge.manualInstallation=установка, добавленная вручную
speech.bindforge.namedLikeFactory=Ваш файл привязок {0} называется так же, как один из файлов Frontier. Переименуйте его в BindForge, чтобы их не путать.
