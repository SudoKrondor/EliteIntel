lmStudioInstall.intro.install=Elite Intel установит LM Studio — программу, которая запускает модель ИИ на вашей видеокарте, затем скачает модель google/gemma-4-e4b и заполнит поля Адрес и Модель. Понадобится около 10 ГБ места на диске. LM Studio — бесплатная программа от Element Labs, она не входит в Elite Intel.
lmStudioInstall.intro.setUp=Elite Intel скачает модель google/gemma-4-e4b в ваш LM Studio, если её там ещё нет, загрузит её на видеокарту и заполнит поля Адрес и Модель. Больше в вашем LM Studio ничего не изменится.
