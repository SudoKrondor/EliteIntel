bindings.presetEditor.intro=Игра читает четыре раздела управления по отдельности, и каждый загружает файл binds, названный в его строке. Укажите для каждого файл binds или задайте всем один и тот же. В списках показаны BindName, а не имена файлов: Custom.4.2.binds отображается как Custom. Изменения записываются, когда вы нажимаете APPLY вверху.\n\nVEGA берёт клавиши, которые нажимает, только из одного файла binds. Если эти четыре раздела используют разные файлы binds, у команды из другого файла могут быть другие клавиши, и VEGA будет нажимать в игре не те клавиши. Установите для всех четырёх один и тот же файл — вы предупреждены.
