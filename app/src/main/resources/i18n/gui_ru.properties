speech.bindforgeBackedUp=BindForge сохранил резервную копию всех ваших файлов настройки управления в том виде, в каком они были до любых изменений BindForge.
speech.notOdyssey=Внимание, командир. Ваша игра запущена не в Odyssey. Это приложение создано для Elite Dangerous Odyssey, и большая его часть не будет работать в Horizons.
speech.gameClockDisagreement=Внимание, командир. Время на вашем ПК расходится с игровым больше чем на минуту. Пока это не исправлено, некоторые игровые события могут быть пропущены. Подробности - в приложении.
speech.setup.noLlm=Языковая модель ещё не настроена, поэтому я не могу ни понимать вас, ни отвечать. Настройте бесплатный тариф Mistral или локальную модель Gemma 4 E4B, инструкции есть на сайте элит интел точка орг.
speech.setup.noLlmProvider=Внимание, коммандер. У вас выбрана облачная языковая модель, но не выбран облачный провайдер, поэтому я не могу вам отвечать. Откройте вкладку Сервисы ИИ в настройках, выберите провайдера из списка и сохраните.
speech.setup.noJournals=Внимание, коммандер. Я не нахожу файлов журнала Elite Dangerous там, где ищу. Пока папка журналов не указана правильно, я не вижу ничего, что происходит вокруг вашего корабля. Указать её можно на вкладке Настройки.
speech.setup.noBindings=Внимание, коммандер. Я не нахожу файлов привязок управления там, где ищу. Пока папка привязок не указана правильно, я не могу управлять вашим кораблём. Указать её можно на вкладке Привязки.
speech.setup.noSavedBindings=Внимание, коммандер. Папка привязок указана правильно, но Elite Dangerous ещё не записал в неё файл привязок управления. Игра сохраняет его только после того, как вы настроите управление. Откройте в игре Настройки, затем Управление, измените любую привязку, и я её подхвачу. До тех пор я не могу управлять вашим кораблём.
speech.setup.noBindingsYet=Командир, файлы настройки вашего управления ещё не созданы. Завершите обучение командира, затем в Настройках, Управление, назначьте перемещение по интерфейсу галактической карты на клавиши со стрелками и примените. После этого я смогу прочитать ваше управление. А до тех пор я не могу управлять вашим кораблём.
speech.connectionSuccessful=Подключение успешно.
speech.shipDismissRejected=Не могу выполнить. Вы на борту.
