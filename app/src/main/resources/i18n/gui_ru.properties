command.show_fire_groups_panel.description=Открывает панель групп огня.
command.show_history_panel.name=Панель истории
command.show_history_panel.description=Открывает историю связи с прежними сообщениями.
command.show_hud_overlay.name=Показать оверлей HUD
command.show_hud_overlay.description=Показывает оверлей HUD там, где он был в последний раз.
command.show_internal_panel.name=Внутренняя панель
command.show_internal_panel.description=Открывает правую внутреннюю панель на главной вкладке.
command.show_inventory_panel.name=Панель инвентаря
command.show_inventory_panel.description=Открывает панель инвентаря: материалы и расходники на борту.
command.show_location_bookmarks.name=Показать закладки
