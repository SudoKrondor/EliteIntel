bindings.autofix.confirm.title=VEGA-Pflichtbelegungen automatisch zuweisen
bindings.autofix.confirm.text=EliteIntel weist den Steuerungen, die VEGA drückt und die keine Tastaturbelegung haben, sichere, layout-freundliche Tastaturtasten zu - seinen eigenen und denen, die deine eigenen Befehle verwenden. Andere Steuerungen bleiben, wie sie sind.\n\nBestehende Belegungen werden nie geändert und keine Taste wird doppelt verwendet. Die Änderungen bleiben auf dem Bildschirm, bis du auf Anwenden klickst, das sie in Elite Dangerous schreibt - prüfe sie vorher.\n\nFortfahren?
