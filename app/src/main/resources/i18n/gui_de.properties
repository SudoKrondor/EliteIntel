speech.voiceInputEnabledWarning=Spracheingabe aktiviert. Warnung: Ihr Mikrofon ist für den Raum zu leise, Sprache kann überhört werden. Erhöhen Sie den Mikrofon-Eingangspegel in den Soundeinstellungen des Betriebssystems und kalibrieren Sie erneut.
