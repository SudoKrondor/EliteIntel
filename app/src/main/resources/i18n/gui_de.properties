speech.sleepModeOn=Ich gehe in den Schlafmodus.|Ok, weck mich, falls du mich brauchst.
speech.sleepModeOff=Ich höre zu.|Ok, ich bin ganz Ohr!|Ok, ich bin wach!
speech.sleepModeStartupNotice=Kommandant, ich starte im Schlafmodus und ignoriere die Spracheingabe. Sag wach auf oder drücke AUFWACHEN, wenn du mich brauchst.
speech.unsupportedLocalModel=Achtung, Kommandant. Ihr lokales Modell ist nicht Gemma 4 E4B, das diese Version voraussetzt. Die Anwendung funktioniert möglicherweise nicht korrekt oder gar nicht.
speech.missingController=Controller {0} ist nicht angeschlossen. Seine Belegungen werden erst geladen, wenn er angeschlossen ist.
speech.missingControllers=Diese Controller sind nicht angeschlossen: {0}. Ihre Belegungen werden erst geladen, wenn sie angeschlossen sind.
speech.bindforgeBackedUp=BindForge hat alle deine Eingabe-Konfigurationsdateien gesichert, so wie sie vor jeder Änderung durch BindForge waren.
speech.notOdyssey=Achtung, Kommandant. Ihr Spiel läuft nicht mit Odyssey. Diese Anwendung ist für Elite Dangerous Odyssey gebaut, und vieles davon funktioniert unter Horizons nicht.
speech.gameClockDisagreement=Achtung, Kommandant. Die Uhr deines PCs weicht um mehr als eine Minute vom Spiel ab. Bis das behoben ist, können Spielereignisse verpasst werden. Die Einzelheiten stehen in der App.
speech.setup.noLlm=Es ist noch kein Sprachmodell eingerichtet, daher kann ich Sie weder verstehen noch Ihnen antworten. Richten Sie ein Cloud-Modell oder das lokale Modell Gemma 4 E4B ein, eine Anleitung finden Sie auf elite intel punkt org.
speech.setup.noLlmProvider=Achtung, Commander. Sie haben ein Cloud-Sprachmodell eingestellt, aber keinen Cloud-Anbieter ausgewählt, daher kann ich Ihnen nicht antworten. Öffnen Sie den Reiter KI-Dienste, wählen Sie Ihren Anbieter aus der Liste und speichern Sie.
speech.setup.noJournals=Achtung, Commander. Ich finde an der eingestellten Stelle keine Journaldateien von Elite Dangerous. Solange der Journalordner nicht korrekt eingestellt ist, bin ich blind für alles, was um Ihr Schiff geschieht. Sie können ihn im Reiter Kommandant setzen.
speech.setup.noBindings=Achtung, Commander. Ich finde an der eingestellten Stelle keine Tastenbelegungen. Solange der Bindings-Ordner nicht korrekt eingestellt ist, kann ich Ihr Schiff nicht steuern. Sie können ihn im Reiter BindForge setzen.
speech.setup.noBindingsYet=Commander, Ihre Konfigurationsdateien für die Steuerung wurden noch nicht angelegt. Schließen Sie Ihr Kommandanten-Training ab, stellen Sie dann unter Optionen, Steuerung die UI-Bewegung der Galaxiekarte auf die Pfeiltasten und übernehmen Sie die Änderung. Danach kann ich Ihre Steuerung lesen. Bis dahin kann ich Ihr Schiff nicht steuern.
speech.bindforge.changedOutside=Ihre Steuerungsdateien wurden außerhalb von BindForge geändert. Öffnen Sie BindForge, um sie zu prüfen.
speech.bindforge.readOnly=BindForge ist schreibgeschützt: Eine Installation von Elite Dangerous fehlt - {0}. Schließen Sie das Laufwerk an und starten Sie Elite-Intel neu, oder entfernen Sie sie unter Spielinstallationen.
speech.bindforge.manualInstallation=eine manuelle Installation
speech.bindforge.namedLikeFactory=Ihre Belegungsdatei {0} trägt den Namen einer Datei von Frontier. Benennen Sie sie in BindForge um, damit die beiden nicht verwechselt werden.
speech.bindforge.namedLikeFactoryMany=Ihre Belegungsdateien {0} tragen die Namen von Dateien von Frontier. Benennen Sie sie in BindForge um, damit sie nicht verwechselt werden.
