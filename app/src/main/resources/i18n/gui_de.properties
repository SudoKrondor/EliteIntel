# Preset Editor (P4)
bindings.tab.presetEditor=Preset-Editor
bindings.presetEditor.title=Aktive Preset-Konfiguration
bindings.presetEditor.intro=Das Spiel liest vier Steuerungsbereiche getrennt, und jeder lädt die Binds-Datei, die seine Zeile nennt. Weise jedem eine Binds-Datei zu oder setze alle auf dieselbe. Die Listen zeigen BindNames, keine Dateinamen: Custom.4.2.binds erscheint als Custom. Änderungen werden geschrieben, wenn du oben APPLY drückst.\n\nVEGA liest die Tasten, die es drückt, aus nur einer Binds-Datei. Nutzen diese vier Bereiche verschiedene Binds-Dateien, kann eine Steuerung in einer anderen Datei andere Tasten haben, und VEGA drückt im Spiel die falschen Tasten. Setze alle vier auf dieselbe Datei - du wurdest gewarnt.
bindings.presetEditor.setAll=Alle gleich setzen
bindings.presetEditor.setAll.tooltip=Alle vier Bereiche auf die neben dieser Schaltfläche gewählte Binds-Datei setzen.
bindings.presetEditor.missing=Diese Bereiche nennen keine Binds-Datei, die BindForge finden kann: {0}. Das Spiel würde dort etwas anderes laden, und APPLY verweigert, bis du eine wählst.
bindings.presetEditor.missing.tooltip=Diese Zeile nennt keine Binds-Datei, die BindForge finden kann - wähle eine aus der Liste.
bindings.presetEditor.split=Die vier Bereiche laden nicht alle dieselbe Binds-Datei. Das Spiel unterstützt das, es ist also nur ein Hinweis.
