bindings.readOnly.override.confirm=Bearbeiten einschalten, obwohl eine Installation fehlt? Anwenden schreibt dann in die vorhandenen Installationen. Ist die fehlende wieder da, wird sie beim nächsten Start verglichen und du entscheidest, was bleibt. Das gilt, bis Elite-Intel geschlossen wird.
bindings.readOnly.refused=BindForge ist schreibgeschützt, solange eine Installation fehlt, daher wurde nichts geändert. Die Leiste über den Tabs sagt, was zu tun ist.
