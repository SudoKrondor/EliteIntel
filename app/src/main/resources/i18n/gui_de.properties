bindings.applyBar.presetRefused=Nichts wurde geschrieben. Die Preset-Datei nennt keine Binds-Datei, die BindForge finden kann, für: {0}. Das Spiel würde dort etwas anderes laden. Deine Änderungen sind noch auf dem Bildschirm.
