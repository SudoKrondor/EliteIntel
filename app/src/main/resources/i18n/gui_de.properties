# Display names and descriptions of the built-in commands and queries (Actions > Built-in Commands, details dialog).
# CommandCatalog reads command.<id>.name/.description and query.<id>.name/.description - every registered id needs both in every bundle.
command.activate_ui_control.name=UI-Element aktivieren
command.activate_ui_control.description=Drückt die Auswahltaste des Spiels auf dem Bedienelement, das gerade den Fokus hat.
command.add_mining_target.name=Abbauziel hinzufügen
command.add_mining_target.description=Fügt einen abbaubaren Rohstoff wie Platin oder Painit zur Prospektorliste hinzu, damit VEGA ihn meldet, sobald ein Prospektor ihn findet.
command.allow_star_system_in_searches_again.name=System wieder in Suchen zulassen
command.allow_star_system_in_searches_again.description=Lässt das aktuelle Sternsystem wieder in Suchergebnissen zu, nachdem es ausgeschlossen wurde.
command.bookmark_current_location.name=Aktuellen Ort als Lesezeichen speichern
command.bookmark_current_location.description=Speichert Ihren aktuellen Ort - System, Station, Planet oder Oberflächenpunkt - als Lesezeichen, um später dorthin zurückzunavigieren.
command.calculate_fleet_carrier_route.name=Flottenträger-Route berechnen
command.calculate_fleet_carrier_route.description=Plant eine neue Route mit mehreren Sprüngen für Ihren Flottenträger zum System in der Zwischenablage und ersetzt eine bereits geplante Route.
command.calculate_neutron_star_route.name=Neutronenstern-Route berechnen
command.calculate_neutron_star_route.description=Plant eine Neutronenstern-Route zum aus der Galaxiekarte kopierten System; Routeneffizienz und Supercharge lassen sich angeben.
command.calculate_trade_route.name=Handelsroute berechnen
command.calculate_trade_route.description=Berechnet eine profitable Handelsroute mit mehreren Stopps aus Ihrem gespeicherten Handelsprofil: Budget, Frachtraum, Stopps und Entfernung.
command.cancel_navigation.name=Navigation abbrechen
command.cancel_navigation.description=Schaltet die aktive Navigation bzw. Zielführung auf der Oberfläche ab.
command.cancel_trade_route.name=Handelsroute abbrechen
command.cancel_trade_route.description=Löscht die aktuell geplante Handelsroute.
command.clear_active_missions.name=Aktive Missionen löschen
command.clear_active_missions.description=Leert die Missionsliste der App; die Missionen selbst bleiben im Spiel aktiv.
command.clear_fleet_carrier_route.name=Flottenträger-Route löschen
command.clear_fleet_carrier_route.description=Verwirft die geplante Flottenträger-Route: keine Etappen, kein Ziel und kein Sprung-Countdown bleiben übrig.
command.clear_mining_targets.name=Abbauziele löschen
command.clear_mining_targets.description=Entfernt alle Rohstoffe aus der Prospektorliste.
command.clear_neutron_route.name=Neutronen-Route löschen
command.clear_neutron_route.description=Löscht die gespeicherten Wegpunkte der Neutronenstern-Route.
command.clear_reminders.name=Erinnerungen löschen
command.clear_reminders.description=Löscht alle Erinnerungen: den gespeicherten Auftrag, alle zeitgesteuerten Erinnerungen, den Handelstipp für die Route und das letzte Suchergebnis für Waren.
command.close_location_bookmarks.name=Lesezeichen schließen
command.close_location_bookmarks.description=Schließt die Lesezeichenliste im HUD-Overlay.
command.cycle_next_page.name=Nächste Seite
command.cycle_next_page.description=Wechselt zur nächsten Seite im geöffneten Spiel-Panel.
command.cycle_next_panel.name=Nächster Reiter
command.cycle_next_panel.description=Wechselt zum nächsten Reiter des geöffneten Spiel-Panels.
command.cycle_previous_page.name=Vorherige Seite
command.cycle_previous_page.description=Wechselt zur vorherigen Seite im geöffneten Spiel-Panel.
command.cycle_previous_panel.name=Vorheriger Reiter
command.cycle_previous_panel.description=Wechselt zum vorherigen Reiter des geöffneten Spiel-Panels.
command.decrease_speed.name=Geschwindigkeit verringern
command.decrease_speed.description=Senkt den Schub um die genannte Anzahl Stufen.
command.delete_codex_entry.name=Codex-Eintrag löschen
command.delete_codex_entry.description=Löscht den verfolgten Codex- bzw. Bioproben-Eintrag und beendet die Zielführung dorthin.
command.delete_location_bookmark.name=Lesezeichen löschen
command.delete_location_bookmark.description=Löscht das Lesezeichen mit der genannten Nummer aus der Lesezeichenliste.
command.deploy_chaff.name=Täuschkörper abwerfen
command.deploy_chaff.description=Wirft Täuschkörper ab, um Raketen- und Kardanwaffen-Zielerfassungen zu stören.
command.deploy_fighter.name=Jäger starten
command.deploy_fighter.description=Startet einen Jäger aus dem Jägerhangar, während Sie das Hauptschiff fliegen.
command.deploy_hardpoints.name=Waffen ausfahren
command.deploy_hardpoints.description=Fährt die Waffenaufhängungen aus: Waffen, aber auch Bergbaulaser, Drohnensteuerungen und Scanner brauchen sie.
command.deploy_heat_sink.name=Wärmesenke auswerfen
command.deploy_heat_sink.description=Wirft eine Wärmesenke aus, um Hitze abzuführen und das Schiff zu kühlen.
command.deploy_landing_gear.name=Fahrwerk ausfahren
command.deploy_landing_gear.description=Fährt das Fahrwerk zum Andocken oder Landen aus.
command.deploy_shield_cell.name=Schildzelle einsetzen
command.deploy_shield_cell.description=Setzt eine Schildzellenbank ein, um die Schilde aufzuladen.
command.deploy_vehicle_srv.name=SRV aussetzen
command.deploy_vehicle_srv.description=Setzt ein SRV aus dem Fahrzeughangar aus; nennen Sie Fahrzeug oder Hangarplatz, sonst wird Platz 1 genommen.
command.disembark.name=Aussteigen
command.disembark.description=Verlässt Schiff oder SRV, um zu Fuß weiterzugehen.
command.dismiss_construction_site.name=Baustelle verwerfen
command.dismiss_construction_site.description=Beendet die Verfolgung der zuletzt angedockten Baustelle: Sie verschwindet aus dem HUD, und VEGA bietet keine Einkäufe oder Navigation mehr dafür an.
command.dismiss_ship_to_orbit.name=Schiff wegschicken
command.dismiss_ship_to_orbit.description=Schickt das Schiff in den Orbit, während Sie im SRV oder zu Fuß unterwegs sind.
command.display_fleet_carrier_management_panel.name=Flottenträger-Verwaltung
command.display_fleet_carrier_management_panel.description=Öffnet das Verwaltungs-Panel des Flottenträgers.
command.display_open_galaxy_map.name=Galaxiekarte öffnen
command.display_open_galaxy_map.description=Öffnet die Galaxiekarte.
command.display_open_system_map.name=Systemkarte öffnen
command.display_open_system_map.description=Öffnet die Systemkarte.
command.display_radar_panel.name=Radar-Panel
command.display_radar_panel.description=Öffnet das Radar- und Sensoren-Panel.
command.drive_assist.name=Fahrassistent
command.drive_assist.description=Schaltet den SRV-Fahrassistenten ein oder aus bzw. wechselt ihn, wenn nichts angegeben ist.
command.drop_from_super_cruise.name=Supercruise verlassen
command.drop_from_super_cruise.description=Verlässt den Supercruise in den Normalraum.
command.enter_fleet_carrier_destination.name=Flottenträger-Ziel eingeben
command.enter_fleet_carrier_destination.description=Trägt das System der nächsten Trägeretappe in das Navigationsfeld des Trägers ein und bestätigt es; nach dem Berechnen einer Trägerroute verwenden.
command.enter_super_cruise.name=In Supercruise gehen
command.enter_super_cruise.description=Aktiviert den Supercruise; ist er schon aktiv, wird das nächste Routensystem anvisiert und gesprungen.
command.equalize_power.name=Energie ausgleichen
command.equalize_power.description=Setzt den Energieverteiler auf gleichmäßige Punkte für Systeme, Triebwerke und Waffen zurück.
command.exclude_star_system_from_searches.name=System von Suchen ausschließen
command.exclude_star_system_from_searches.description=Schließt ein Sternsystem ab sofort von allen Suchen aus, etwa wenn eine dort genannte Station nicht existiert oder unbrauchbar ist.
command.exit_close.name=Panel oder Karte schließen
command.exit_close.description=Schließt das geöffnete Panel, Menü oder die Karte bzw. geht einen Schritt zurück.
command.fighter_attack_target.name=Jäger: Mein Ziel angreifen
command.fighter_attack_target.description=Befiehlt dem ausgesetzten Jäger, Ihr aktuelles Ziel anzugreifen.
command.fighter_defend.name=Jäger: Schiff verteidigen
command.fighter_defend.description=Befiehlt dem ausgesetzten Jäger, Ihr Schiff zu verteidigen.
command.fighter_fire_at_will.name=Jäger: Feuer frei
command.fighter_fire_at_will.description=Befiehlt dem ausgesetzten Jäger, Ziele nach eigenem Ermessen anzugreifen.
command.fighter_hold_fire.name=Jäger: Feuer einstellen
command.fighter_hold_fire.description=Befiehlt dem ausgesetzten Jäger, das Feuer einzustellen.
command.fighter_return_to_ship.name=Jäger: Zum Schiff zurückkehren
command.fighter_return_to_ship.description=Befiehlt dem ausgesetzten Jäger, zurückzukehren und an Ihrem Schiff anzudocken.
command.find_bounty_hunting_ground.name=Kopfgeld-Jagdgebiet finden
command.find_bounty_hunting_ground.description=Plant eine Route zu einem System mit Ressourcenabbaustätten für die Kopfgeldjagd, gewählt aus bereits besuchten Systemen in der genannten Reichweite.
command.find_commodity.name=Ware zum Kaufen finden
command.find_commodity.description=Findet, wo eine Ware oder ein Modul in der genannten Entfernung zu kaufen ist, und plant eine Route dorthin - zum nächsten Markt oder zum besten Preis.
command.find_conflict_zone_for_combat_bonds.name=Konfliktzone finden
command.find_conflict_zone_for_combat_bonds.description=Plant eine Route zu einem System mit aktiven Konfliktzonen, um für eine Fraktion zu kämpfen und Kampfanleihen zu verdienen - aus Kriegen der letzten Woche in der genannten Reichweite.
command.find_construction_site_commodity.name=Baustellen-Ware finden
command.find_construction_site_commodity.description=Findet, wo das zu kaufen ist, was Ihre Baustelle am dringendsten braucht, und plant eine Route zu diesem Markt; die Liste der Baustelle wird selbst gelesen.
command.find_encoded_material_trader.name=Händler für codierte Materialien finden
command.find_encoded_material_trader.description=Plant eine Route zum nächsten Händler für codierte Materialien.
command.find_fuel_station.name=Tankstation finden
command.find_fuel_station.description=Plant eine Route zur nächsten Station, an der das Schiff andocken und tanken kann - für Schiffe ohne Treibstoffsammler.
command.find_guardian_technology_broker.name=Guardian-Technologiehändler finden
command.find_guardian_technology_broker.description=Plant eine Route zum nächsten Guardian-Technologiehändler, der Guardian-Module und -Waffen freischaltet.
command.find_human_technology_broker.name=Technologiehändler für menschliche Technik finden
command.find_human_technology_broker.description=Plant eine Route zum nächsten Technologiehändler für menschliche Technik, der dessen Module freischaltet.
command.find_interstellar_factor.name=Interstellar Factors finden
command.find_interstellar_factor.description=Plant eine Route zum nächsten Interstellar-Factors-Kontakt, um Kopfgelder und Bußgelder zu begleichen.
command.find_manufactured_material_trader.name=Händler für hergestellte Materialien finden
command.find_manufactured_material_trader.description=Plant eine Route zum nächsten Händler für hergestellte Materialien.
command.find_mining_site.name=Abbaugebiet finden
command.find_mining_site.description=Plant eine Route zum nächsten unberührten Ring oder Asteroidenfeld mit dem genannten Rohstoff in der genannten Entfernung.
command.find_mission_commodity.name=Missionsware finden
command.find_mission_commodity.description=Findet, wo die noch benötigte Fracht einer aktiven Mission zu kaufen ist, und plant eine Route dorthin; die Missionsliste wird selbst gelesen.
command.find_nearest_fleet_carrier.name=Nächsten Flottenträger finden
command.find_nearest_fleet_carrier.description=Meldet den nächsten Flottenträger in Reichweite, der nicht Ihrer ist.
command.find_pirate_massacre_missions.name=Piraten-Massaker-Missionen finden
command.find_pirate_massacre_missions.description=Meldet, wo sich Piraten-Massaker-Missionen stapeln lassen - ein Anbietersystem, dessen Fraktionen ein System mit Ressourcenabbaustätten als Ziel haben - in der genannten Reichweite.
command.find_powerplay_conflict_zone_for_merits.name=Powerplay-Konfliktzone finden
command.find_powerplay_conflict_zone_for_merits.description=Plant eine Route zu einer Powerplay-Konfliktzone, in der Ihre Macht kämpft, um Verdienste zu sammeln.
command.find_raw_material_trader.name=Rohstoffhändler finden
command.find_raw_material_trader.description=Plant eine Route zum nächsten Rohstoffhändler.
command.find_shipyard_selling_ship.name=Werft mit Schiff finden
command.find_shipyard_selling_ship.description=Findet eine Werft, die das genannte Schiff in der genannten Entfernung verkauft, und plant eine Route - zur nächsten oder günstigsten.
command.find_vista_genomics.name=Vista Genomics finden
command.find_vista_genomics.description=Plant eine Route zur nächsten Vista Genomics, um Exobiologie-Daten zu verkaufen.
command.find_where_to_collect_raw_material.name=Fundort für Rohstoff finden
command.find_where_to_collect_raw_material.description=Plant eine Route zum besten Fundort des genannten Rohstoffs, etwa Tellur: eine Hirnbaum-Stätte, sonst die reichste Planetenoberfläche.
command.find_where_to_sell_commodity.name=Verkaufsort für Ware finden
command.find_where_to_sell_commodity.description=Findet einen Markt mit Nachfrage nach der genannten Ware in der genannten Entfernung und plant eine Route - zum nächsten oder bestzahlenden Käufer.
command.flag_exo_mastery_system_harvested.name=System als abgeerntet markieren
command.flag_exo_mastery_system_harvested.description=Vermerkt, dass Sie alle Exobiologie-Körper dieses Systems in einer früheren Sitzung schon beprobt haben, damit die Exo-Mastery-Route es nicht mehr anbietet.
command.forget_hunting_ground.name=Jagdgebiet vergessen
command.forget_hunting_ground.description=Vergisst das aktuelle System als Piraten-Jagdgebiet, sodass es samt der zugehörigen Missionsanbieter nicht mehr empfohlen wird.
command.hide_hud_overlay.name=HUD-Overlay ausblenden
command.hide_hud_overlay.description=Blendet das HUD-Overlay aus.
command.ignore_nonsensical_input.name=Unsinnige Eingabe ignorieren
command.ignore_nonsensical_input.description=Wird verwendet, wenn eine Transkription keinen Sinn ergibt; VEGA lässt sie dann ohne Aktion durch.
command.increase_speed.name=Geschwindigkeit erhöhen
command.increase_speed.description=Erhöht den Schub um die genannte Anzahl Stufen.
command.interrupt.name=Unterbrechen
command.interrupt.description=Bricht die Sprachausgabe von VEGA sofort ab.
command.jump_to_hyperspace.name=Hyperraumsprung
command.jump_to_hyperspace.description=Aktiviert den Frameshift-Antrieb für den Sprung zum nächsten System der geplanten Route.
command.launch_deploy_nomad.name=Nomad aussetzen
command.launch_deploy_nomad.description=Setzt den Nomad-Luftaufklärer aus, während Sie tief über einem Planeten fliegen.
command.launch_ship_detach_from_station.name=Schiff starten
command.launch_ship_detach_from_station.description=Dockt das Schiff ab und startet es von der Landeplattform.
command.monetize_route.name=Route zu Geld machen
command.monetize_route.description=Findet ein profitables Kauf-Verkauf-Paar entlang der geplanten Route und speichert es als Erinnerung, um unterwegs Credits zu verdienen.
command.move_hud_overlay_to_screen_section.name=HUD-Overlay verschieben
command.move_hud_overlay_to_screen_section.description=Verschiebt die HUD-Karte in den per Himmelsrichtung genannten Bildschirmbereich: Norden oben, Süden unten, Osten rechts, Westen links.
command.navigate_from_memory.name=Aus Zwischenablage navigieren
command.navigate_from_memory.description=Plant eine Route zu dem Sternsystem, dessen Namen Sie von einer Seite wie INARA oder Spansh in die Zwischenablage kopiert haben.
command.navigate_to_active_mission.name=Zur aktiven Mission navigieren
command.navigate_to_active_mission.description=Plant eine Route zum Ziel einer aktiven Mission; nennen Sie ein Stichwort, sonst wird die neueste Mission mit Ziel genommen.
command.navigate_to_bio_sample_codex_entry.name=Zum Codex-Eintrag einer Bioprobe navigieren
command.navigate_to_bio_sample_codex_entry.description=Führt Sie auf dem aktuellen Planeten zur nächsten gespeicherten Bioprobe bzw. zum nächsten Codex-Fundort.
command.navigate_to_construction_site.name=Zur Baustelle navigieren
command.navigate_to_construction_site.description=Plant eine Route zurück zur Baustelle, die Sie beliefern - der zuletzt angedockten.
command.navigate_to_coordinates.name=Zu Koordinaten navigieren
command.navigate_to_coordinates.description=Startet die Oberflächen-Zielführung zu den genannten Breiten- und Längengraden auf dem aktuellen Planeten.
command.navigate_to_exo_mastery_site.name=Zum Exobiologie-Fundort navigieren
command.navigate_to_exo_mastery_site.description=Plant eine Route zum lukrativsten noch nicht beprobten Exobiologie-System der Exo-Mastery-Liste und hinterlässt eine Erinnerung mit den Landeplaneten.
command.navigate_to_fleet_carrier.name=Zum Flottenträger navigieren
command.navigate_to_fleet_carrier.description=Plant eine Route zum letzten bekannten Standort Ihres Flottenträgers oder, falls keiner bekannt ist, zum Heimatsystem.
command.navigate_to_home_system.name=Zum Heimatsystem navigieren
command.navigate_to_home_system.description=Plant eine Route zu Ihrem gespeicherten Heimatsystem.
command.navigate_to_landing_zone.name=Zur Landezone navigieren
command.navigate_to_landing_zone.description=Startet die Oberflächen-Zielführung zurück zur gespeicherten Landezone auf dem aktuellen Planeten.
command.navigate_to_location_bookmark.name=Zu Lesezeichen navigieren
command.navigate_to_location_bookmark.description=Plant eine Route zum Lesezeichen mit der genannten Nummer aus der Lesezeichenliste.
command.navigate_to_next_trade_stop.name=Zum nächsten Handelsstopp navigieren
command.navigate_to_next_trade_stop.description=Plant eine Route zum nächsten Stopp der aktiven Handelsroute - zum Kaufen oder Verkaufen, je nach Fracht.
command.navigate_to_pirate_mission_provider.name=Zum Anbieter der Piratenmission navigieren
command.navigate_to_pirate_mission_provider.description=Plant eine Route zu einem System mit Piraten-Massaker-Missionen - für Ihre Missionen, Ihr aktuelles Jagdgebiet oder die beste bekannte Paarung.
command.navigate_to_pirate_mission_target.name=Zum Ziel der Piratenmission navigieren
command.navigate_to_pirate_mission_target.description=Plant eine Route zum System, in dem die Piraten Ihrer aktiven Massaker-Mission gejagt werden.
command.navigate_to_squadron_carrier.name=Zum Geschwader-Träger navigieren
command.navigate_to_squadron_carrier.description=Plant eine Route zum Flottenträger Ihres Geschwaders.
command.navigate_to_star_system_or_place_named_aloud.name=Zu benanntem Ort navigieren
command.navigate_to_star_system_or_place_named_aloud.description=Plant eine Route zu einem Sternsystem, einer Station oder einem Ort, den Sie laut nennen.
command.next_location_bookmarks_page.name=Nächste Lesezeichen-Seite
command.next_location_bookmarks_page.description=Zeigt die nächste Lesezeichen-Seite im HUD-Overlay.
command.open_fss_scan_system.name=FSS öffnen
command.open_fss_scan_system.description=Öffnet den Vollspektrum-Systemscanner, um Himmelskörper genau aufzulösen; funktioniert im Supercruise.
command.pause_music_playback.name=Musik pausieren
command.pause_music_playback.description=Pausiert Ihre Musik und behält die Position im Titel.
command.play_music.name=Musik abspielen
command.play_music.description=Spielt Ihre eigene Musik aus der Jukebox-Wiedergabeliste ab oder setzt sie an der pausierten Stelle fort.
command.play_music_track_by_name.name=Titel nach Name abspielen
command.play_music_track_by_name.description=Spielt einen Titel aus Ihrer Wiedergabeliste ab, genannt nach Titel oder Interpret.
command.play_previous_music_track.name=Vorheriger Titel
command.play_previous_music_track.description=Springt zum vorherigen Titel Ihrer Wiedergabeliste zurück.
command.plot_route_next_neutron_star_waypoint.name=Route zum nächsten Neutronen-Wegpunkt
command.plot_route_next_neutron_star_waypoint.description=Plant eine Route zum nächsten Wegpunkt der berechneten Neutronenstern-Route.
command.previous_location_bookmarks_page.name=Vorherige Lesezeichen-Seite
command.previous_location_bookmarks_page.description=Zeigt die vorherige Lesezeichen-Seite im HUD-Overlay.
command.recover_srv_vehicle_get_on_board_ship.name=SRV an Bord holen
command.recover_srv_vehicle_get_on_board_ship.description=Bringt das SRV zurück an Bord und verstaut es im Hangar.
command.remove_mining_target.name=Abbauziel entfernen
command.remove_mining_target.description=Entfernt den genannten Rohstoff aus der Prospektorliste.
command.request_docking.name=Andockerlaubnis anfordern
command.request_docking.description=Fordert bei der nahen Station oder dem Außenposten eine Landeplattform an.
command.reset_head_look_ahead.name=Kopfblick zurücksetzen
command.reset_head_look_ahead.description=Richtet die Kopfblick-Kamera wieder geradeaus aus.
command.restart_music_playlist_from_first_track.name=Wiedergabeliste neu starten
command.restart_music_playlist_from_first_track.description=Startet Ihre Wiedergabeliste wieder beim ersten Titel.
command.retract_hardpoints.name=Waffen einfahren
command.retract_hardpoints.description=Fährt die Waffenaufhängungen ein.
command.retract_landing_gear.name=Fahrwerk einfahren
command.retract_landing_gear.description=Fährt das Fahrwerk ein.
command.return_to_surface.name=Schiff zu mir rufen
command.return_to_surface.description=Ruft das Schiff zu Ihrer Position, um Sie abzuholen, während Sie im SRV oder zu Fuß sind.
command.run_discovery_scan.name=Erkundungsscan
command.run_discovery_scan.description=Löst den Erkundungsscanner aus, um Anzahl der Himmelskörper und Signale im System zu zeigen.
command.scan_journals_for_hunting_grounds.name=Jagdgebiete aus Journalen lernen
command.scan_journals_for_hunting_grounds.description=Liest Ihre gespeicherten Spieljournale und lernt alle Systeme mit Ressourcenabbaustätten und alle Anbieter von Piraten-Massaker-Missionen kennen, denen Sie begegnet sind.
command.select_fire_group_by_nato.name=Feuergruppe wählen
command.select_fire_group_by_nato.description=Wechselt zur per NATO-Buchstabe genannten Feuergruppe: Alpha ist die erste, Bravo die zweite und so weiter.
command.set_carrier_fuel_reserve.name=Treibstoffreserve des Trägers festlegen
command.set_carrier_fuel_reserve.description=Setzt die Tritiumreserve Ihres Flottenträgers auf die genannte Menge.
command.set_current_body_exobiology_survey_complete.name=Himmelskörper als beprobt markieren
command.set_current_body_exobiology_survey_complete.description=Vermerkt von Hand, dass Sie alle Organismen dieses Körpers in einer früheren Sitzung beprobt haben, oder nimmt das zurück; nur die Buchführung der App ändert sich.
command.set_home_system.name=Heimatsystem festlegen
command.set_home_system.description=Legt das aktuelle Sternsystem als Heimatsystem fest.
command.set_optimal_speed.name=Optimale Anfluggeschwindigkeit
command.set_optimal_speed.description=Setzt den Schub auf 75 %, den idealen Wert zum Abbremsen beim Anflug im Supercruise.
command.set_reminder.name=Erinnerung setzen
command.set_reminder.description=Speichert eine gesprochene Notiz zum späteren Abrufen, ohne Timer.
command.set_speed_100.name=Vollgas
command.set_speed_100.description=Setzt den Schub auf 100 %.
command.set_speed_25.name=Viertel Schub
command.set_speed_25.description=Setzt den Schub auf 25 %.
command.set_speed_50.name=Halber Schub
command.set_speed_50.description=Setzt den Schub auf 50 %.
command.set_speed_75.name=Dreiviertel Schub
command.set_speed_75.description=Setzt den Schub auf 75 %.
command.set_speed_to_zero_0_stop_ship.name=Vollstopp
command.set_speed_to_zero_0_stop_ship.description=Setzt den Schub auf null, um das Schiff anzuhalten.
command.set_timed_reminder.name=Zeitgesteuerte Erinnerung setzen
command.set_timed_reminder.description=Plant eine Erinnerung, die nach der genannten Anzahl Minuten gesprochen wird.
command.show_central_panel.name=Kommandantenpanel
command.show_central_panel.description=Öffnet das zentrale Panel mit Ihren Kommandanten-Informationen.
command.show_chat_comms_panel.name=Komm-Panel
command.show_chat_comms_panel.description=Öffnet das Komm- und Chat-Panel.
command.show_contacts_panel.name=Kontakte-Panel
command.show_contacts_panel.description=Öffnet das Kontakte-Panel: Schiffe, Stationen und Signalquellen in der Nähe.
command.show_crew_panel.name=Crew-Panel
command.show_crew_panel.description=Öffnet das Crew-Panel.
command.show_email_inbox_panel.name=Posteingang-Panel
command.show_email_inbox_panel.description=Öffnet den Posteingang im Komm-Panel.
command.show_fighter_panel.name=Jäger-Panel
command.show_fighter_panel.description=Öffnet das Jäger-Panel.
command.show_fire_groups_panel.name=Feuergruppen-Panel
command.show_fire_groups_panel.description=Öffnet das Feuergruppen-Panel.
command.show_history_panel.name=Verlauf-Panel
command.show_history_panel.description=Öffnet das Komm-Verlauf-Panel mit früheren Nachrichten.
command.show_hud_overlay.name=HUD-Overlay einblenden
command.show_hud_overlay.description=Blendet das HUD-Overlay an seiner letzten Position ein.
command.show_internal_panel.name=Internes Panel
command.show_internal_panel.description=Öffnet das rechte interne Panel auf dem Hauptreiter.
command.show_inventory_panel.name=Inventar-Panel
command.show_inventory_panel.description=Öffnet das Inventar-Panel: Materialien und Verbrauchsgüter an Bord.
command.show_location_bookmarks.name=Lesezeichen anzeigen
command.show_location_bookmarks.description=Zeigt Ihre gespeicherten Lesezeichen nummeriert im HUD-Overlay.
command.show_modules_panel.name=Module-Panel
command.show_modules_panel.description=Öffnet das Module-Panel: eingebaute Module und ihre Energiepriorität.
command.show_navigation_panel.name=Navigations-Panel
command.show_navigation_panel.description=Öffnet das linke Navigations-Panel: Route sowie nahe Systeme und Himmelskörper.
command.show_social_panel.name=Sozial-Panel
command.show_social_panel.description=Öffnet das Sozial-Panel im Komm-Bereich.
command.show_squadron_panel.name=Geschwader-Panel
command.show_squadron_panel.description=Öffnet das Geschwader-Panel im Komm-Bereich.
command.show_station_services_panel.name=Stationsdienste
command.show_station_services_panel.description=Öffnet beim Andocken das Menü der Stationsdienste.
command.show_status_panel.name=Status-Panel
command.show_status_panel.description=Öffnet das Status-Panel: Ränge, Ruf und Kommandantenstatus.
command.show_storage_panel.name=Lager-Panel
command.show_storage_panel.description=Öffnet das Lager-Panel: an dieser Station eingelagerte Module und Schiffe.
command.show_transactions_panel.name=Transaktionen-Panel
command.show_transactions_panel.description=Öffnet das Transaktionen-Panel: aktive Missionen und Transaktionen.
command.shuffle_music_tracks.name=Musik zufällig abspielen
command.shuffle_music_tracks.description=Spielt Ihre Musik in zufälliger Reihenfolge oder wieder in Listenreihenfolge.
command.skip_to_next_music_track.name=Nächster Titel
command.skip_to_next_music_track.description=Springt zum nächsten Titel Ihrer Wiedergabeliste.
command.sleep_ignore_do_not_monitor.name=Schlafen
command.sleep_ignore_do_not_monitor.description=Versetzt VEGA in den Schlaf: Sie hört und antwortet nicht mehr, bis Sie sie wecken.
command.switch_to_analysis_mode.name=In den Analysemodus wechseln
command.switch_to_analysis_mode.description=Schaltet das HUD in den Analysemodus für Scanner und Erkundung.
command.switch_to_combat_mode.name=In den Kampfmodus wechseln
command.switch_to_combat_mode.description=Schaltet das HUD in den Kampfmodus.
command.target_destination.name=Ziel anvisieren
command.target_destination.description=Visiert das nächste System der geplanten Route als Sprungziel an.
command.target_hostile_highest_threat.name=Größte Bedrohung anvisieren
command.target_hostile_highest_threat.description=Visiert das gefährlichste feindliche Schiff in Reichweite an.
command.target_subsystem.name=Subsystem anvisieren
command.target_subsystem.description=Visiert ein genanntes Subsystem des Feindschiffs an, etwa Kraftwerk, FSA, Triebwerke oder Schildgenerator.
command.target_wingman_1.name=Flügelmann 1 anvisieren
command.target_wingman_1.description=Visiert den ersten Flügelmann an.
command.target_wingman_2.name=Flügelmann 2 anvisieren
command.target_wingman_2.description=Visiert den zweiten Flügelmann an.
command.target_wingman_3.name=Flügelmann 3 anvisieren
command.target_wingman_3.description=Visiert den dritten Flügelmann an.
command.taxi_to_landing_pad.name=Zur Landeplattform rollen
command.taxi_to_landing_pad.description=Übergibt das Schiff dem Andockcomputer, der zur zugewiesenen Landeplattform rollt.
command.toggle_all_announcements.name=Alle Ansagen ein/aus
command.toggle_all_announcements.description=Schaltet alle Ansagekategorien auf einmal ein oder aus.
command.toggle_cargo_scoop.name=Frachtschaufel
command.toggle_cargo_scoop.description=Öffnet oder schließt die Frachtschaufel.
command.toggle_cargo_scoop_pickup_announcements.name=Ansagen zur Frachtaufnahme ein/aus
command.toggle_cargo_scoop_pickup_announcements.description=Schaltet Ansagen zu gerade aufgenommener Fracht ein oder aus; die Frachtschaufel selbst bleibt unberührt.
command.toggle_discovery_announcements.name=Entdeckungsansagen ein/aus
command.toggle_discovery_announcements.description=Schaltet Erkundungs- und Entdeckungsansagen ein oder aus.
command.toggle_lights_on_off.name=Licht ein/aus
command.toggle_lights_on_off.description=Schaltet die Scheinwerfer von Schiff oder SRV ein oder aus.
command.toggle_mining_announcements.name=Bergbauansagen ein/aus
command.toggle_mining_announcements.description=Schaltet Prospektor- und Abbauziel-Ansagen ein oder aus.
command.toggle_night_vision_on_off.name=Nachtsicht ein/aus
command.toggle_night_vision_on_off.description=Schaltet die Nachtsicht ein oder aus - im Schiff, im SRV oder zu Fuß.
command.toggle_planetary_approach_announcements.name=Ansagen zum Planetenanflug ein/aus
command.toggle_planetary_approach_announcements.description=Schaltet die Ansage zu Schwerkraft, Atmosphäre und Temperatur beim Planetenanflug ein oder aus.
command.toggle_radar_announcements.name=Radarkontakt-Ansagen ein/aus
command.toggle_radar_announcements.description=Schaltet Radarkontakt-Ansagen ein oder aus.
command.toggle_radio.name=Funkverkehr ein/aus
command.toggle_radio.description=Schaltet den Hintergrund-Funkverkehr von VEGA zwischen Systemen ein oder aus.
command.toggle_route_announcements.name=Routenansagen ein/aus
command.toggle_route_announcements.description=Schaltet Routen- und Sprungansagen ein oder aus.
command.trade_profile_set_budget.name=Handelsprofil: Startbudget festlegen
command.trade_profile_set_budget.description=Legt das Startbudget fest, das die Handelsroutensuche ausgeben darf.
command.trade_profile_set_max_distance.name=Handelsprofil: Maximale Entfernung festlegen
command.trade_profile_set_max_distance.description=Legt fest, wie weit eine Handelsstation vom Ankunftspunkt entfernt sein darf, in Lichtsekunden.
command.trade_profile_set_max_stops.name=Handelsprofil: Maximale Stopps festlegen
command.trade_profile_set_max_stops.description=Legt die maximale Anzahl Stopps einer Handelsroute fest.
command.trade_profile_toggle_permit_systems.name=Handelsprofil: Genehmigungssysteme ein/aus
command.trade_profile_toggle_permit_systems.description=Erlaubt oder verbietet genehmigungspflichtige Systeme in der Handelsroutensuche.
command.trade_profile_toggle_planetary_ports.name=Handelsprofil: Planetenhäfen ein/aus
command.trade_profile_toggle_planetary_ports.description=Erlaubt oder verbietet Planetenhäfen in der Handelsroutensuche.
command.trade_profile_toggle_prohibited_cargo.name=Handelsprofil: Verbotene Fracht ein/aus
command.trade_profile_toggle_prohibited_cargo.description=Erlaubt oder verbietet illegale Waren in der Handelsroutensuche.
command.trade_profile_toggle_strongholds.name=Handelsprofil: Hochburgen ein/aus
command.trade_profile_toggle_strongholds.description=Erlaubt oder verbietet Powerplay-Hochburgen in der Handelsroutensuche.
command.transfer_power_to_engines.name=Energie auf Triebwerke
command.transfer_power_to_engines.description=Legt die maximale Energie auf die Triebwerke für Tempo und Boost.
command.transfer_power_to_shields.name=Energie auf Schilde
command.transfer_power_to_shields.description=Legt die maximale Energie auf die Systeme, was die Schilde stärkt.
command.transfer_power_to_ship_systems.name=Energie auf Systeme
command.transfer_power_to_ship_systems.description=Legt die maximale Energie auf die Systeme - wie Energie auf Schilde.
command.transfer_power_to_weapons.name=Energie auf Waffen
command.transfer_power_to_weapons.description=Legt die maximale Energie auf die Waffen.
command.wakeup.name=Aufwachen
command.wakeup.description=Weckt VEGA, damit sie wieder auf Sprachbefehle hört.
command.wing_nav_lock.name=Geschwader-Navigationssperre
command.wing_nav_lock.description=Koppelt an den Frameshift-Antrieb eines Flügelmanns, um ihm in Supercruise und Sprünge zu folgen.
query.query_bio_scans_and_samples_in_star_system.name=Bioscans im System
query.query_bio_scans_and_samples_in_star_system.description=Meldet den Fortschritt der Bioscans im System: welche Körper Biosignale haben und welche noch gescannt werden müssen.
query.query_biome_analysis.name=Biom-Analyse
query.query_biome_analysis.description=Analysiert das Biom eines Planeten oder aller Planeten mit Biosignalen im System und sagt wahrscheinliche Organismen voraus.
query.query_cargo_hold_contents.name=Frachtrauminhalt
query.query_cargo_hold_contents.description=Meldet den Inhalt des Frachtraums und die gesamte Frachtkapazität.
query.query_carrier_departure_eta.name=Sprungzeit des Flottenträgers
query.query_carrier_departure_eta.description=Meldet, wie lange es bis zum nächsten geplanten Sprung des Trägers dauert.
query.query_carrier_status.name=Flottenträger-Status
query.query_carrier_status.description=Meldet Tritiumvorrat und -reserve, Sprungreichweite und Finanzen eines Trägers - Ihres eigenen oder, wenn gewünscht, des Geschwaders.
query.query_carrier_voyage.name=Routenfortschritt des Flottenträgers
query.query_carrier_voyage.description=Analysiert die bereits geplante Route eines Trägers: Ziel, verbleibende Sprünge, Reisezeit, benötigtes Tritium und Tankmöglichkeiten unterwegs.
query.query_carriers.name=Flottenträger im System
query.query_carriers.description=Meldet die Flottenträger im System: Anzahl, Namen sowie Märkte und Dienste.
query.query_construction_site_progress.name=Baustellenfortschritt
query.query_construction_site_progress.description=Meldet den Fortschritt Ihrer Baustelle: was noch fehlt, wie viele Tonnen davon und was Sie schon dafür an Bord haben.
query.query_current_location.name=Aktueller Standort
query.query_current_location.description=Meldet, wo Sie sind und wie es dort ist: System, Körper, angedockt oder gelandet, Sicherheit, Fraktionen, Schwerkraft, Atmosphäre und Temperatur.
query.query_distance_to_bio_sample.name=Entfernung zur letzten Bioprobe
query.query_distance_to_bio_sample.description=Meldet die Entfernung zur letzten Bioprobe, um den Mindestabstand zwischen Proben einzuhalten.
query.query_distance_to_body.name=Entfernung zum Himmelskörper
query.query_distance_to_body.description=Meldet die Entfernung in Lichtsekunden zu einem genannten Körper oder einer Station im System.
query.query_distance_to_bubble_earth_sol_civilization.name=Entfernung zur Blase
query.query_distance_to_bubble_earth_sol_civilization.description=Meldet die Entfernung zum bewohnten Raum, der Blase um Sol.
query.query_distance_to_carrier.name=Entfernung zum Flottenträger
query.query_distance_to_carrier.description=Meldet die Entfernung zu Ihrem eigenen Flottenträger.
query.query_exobiology_samples.name=Exobiologie auf diesem Planeten
query.query_exobiology_samples.description=Meldet die organischen Scans auf diesem Planeten: welche Arten beprobt sind und was noch fehlt.
query.query_exploration_profits.name=Erkundungsgewinne
query.query_exploration_profits.description=Meldet Exobiologie-Einnahmen: in dieser Sitzung verdiente Credits gegenüber dem, was das System bei vollständigem Scan noch einbrächte.
query.query_fsd_target.name=FSA-Ziel
query.query_fsd_target.description=Meldet Angaben zum anvisierten Sprungziel: Stern, Klasse und ob er sich zum Tanken eignet.
query.query_general_conversation.name=Allgemeines Gespräch
query.query_general_conversation.description=Ein normales Gespräch mit VEGA für alles, was kein Befehl und keine Frage zum Spiel ist.
query.query_geo_signals.name=Geologische Signale
query.query_geo_signals.description=Meldet die geologischen und vulkanischen Fundorte auf den Körpern des Systems.
query.query_last_scan.name=Letzter Scan
query.query_last_scan.description=Meldet den zuletzt gescannten Himmelskörper mit seinen Details.
query.query_local_outfitting.name=Ausrüstung vor Ort
query.query_local_outfitting.description=Meldet die Module, die in der Ausrüstung dieser Station zum Kauf stehen.
query.query_markets.name=Märkte vor Ort
query.query_markets.description=Listet die Stationen und Siedlungen im System und welche Markt, Werft oder Ausrüstung haben; Preise werden nicht genannt.
query.query_material_inventory.name=Materialbestand
query.query_material_inventory.description=Meldet, wie viel Sie von einem Ingenieursmaterial oder einer Ware besitzen.
query.query_missions_and_rewards.name=Missionen und Belohnungen
query.query_missions_and_rewards.description=Meldet Ihre aktiven Missionen: Fraktion, Ziel, Bestimmungsort, Belohnung und Ablauf, wahlweise für ein System.
query.query_pirate_mission.name=Fortschritt der Massaker-Mission
query.query_pirate_mission.description=Meldet den Fortschritt der Massaker-Missionen: verbleibende Abschüsse je Fraktion und gesamt sowie die Gesamtbelohnung.
query.query_planet_materials.name=Materialien auf dem Planeten
query.query_planet_materials.description=Meldet die Rohstoffe auf dem aktuellen oder anvisierten Planeten mit ihren Anteilen.
query.query_player_profile_rank_progress.name=Rangfortschritt
query.query_player_profile_rank_progress.description=Meldet Ihre Ränge und wie nah Sie jeweils am nächsten Rang sind.
query.query_population.name=Bevölkerung
query.query_population.description=Meldet, wie viele Menschen dort leben, wo Sie sind: im System oder geschätzt für Station bzw. Planet.
query.query_reminder.name=Erinnerung
query.query_reminder.description=Meldet Ihre aktive Erinnerung: den gespeicherten Auftrag - wohin, was kaufen oder abholen, wo verkaufen.
query.query_ship_loadout.name=Schiffsausstattung
query.query_ship_loadout.description=Meldet die eingebauten Module und Waffen des Schiffs oder ob ein bestimmtes Modul an Bord ist.
query.query_ship_route_remaining_jumps.name=Geplante Route
query.query_ship_route_remaining_jumps.description=Meldet Ihre geplante Schiffsroute: nächster Wegpunkt, verbleibende Sprünge, Restentfernung und ob der nächste Stern zum Tanken taugt.
query.query_signals_in_star_system.name=Signale im System
query.query_signals_in_star_system.description=Meldet auffällige Signale im System: Ressourcenabbaustätten, Konfliktzonen, Bergbau-Hotspots und Oberflächensignale.
query.query_station_details.name=Stationsdetails
query.query_station_details.description=Meldet die Dienste der aktuellen Station oder ob ein bestimmter Dienst angeboten wird.
query.query_stations.name=Stationen im System
query.query_stations.description=Meldet die Stationen, Außenposten und Siedlungen im System, an denen Sie andocken können.
query.query_stellar_objects.name=Himmelskörper im System
query.query_stellar_objects.description=Listet die Himmelskörper im System - landbar, Typ, Schwerkraft, Atmosphäre, Ringe und Signale - oder Details zu einem genannten Körper.
query.query_system_security.name=Systemsicherheit
query.query_system_security.description=Meldet Sicherheitsstufe, kontrollierende Fraktion, Zugehörigkeit und Powerplay-Kontrolle des Systems.
query.query_time.name=Aktuelle Uhrzeit
query.query_time.description=Meldet die aktuelle reale UTC-Zeit und die galaktische Spielzeit.
query.query_total_bounties.name=Gesammelte Kopfgelder
query.query_total_bounties.description=Meldet die in dieser Sitzung gesammelten Kopfgeldgutscheine.
query.query_trade_profile.name=Handelsprofil
query.query_trade_profile.description=Meldet die Einstellungen der Handelsroutensuche: Budget, Stopps, Entfernung und welche Systeme und Frachtarten erlaubt sind.
query.query_trade_route.name=Aktuelle Handelsroute
query.query_trade_route.description=Meldet die geplante Handelsroute: Stopps, was zu kaufen und zu verkaufen ist und den erwarteten Gewinn.
query.query_vega_self_diagnostic.name=VEGA-Selbstdiagnose
query.query_vega_self_diagnostic.description=Prüft die Verbindung zum KI-Modell und meldet, ob und wie schnell es antwortet.
