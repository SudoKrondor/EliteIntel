journalImport.title=Alte Journale importieren
journalImport.intro=Elite Intel lernt beim Fliegen aus Ihren Journalen: Anbieter von Piraten-Massaker-Missionen, Ressourcenabbaustätten, die von Ihnen entdeckten und kartierten Himmelskörper, Ihre Exobiologie-Proben und die Namen neuer Materialien und Waren. Wenn Sie ältere Journale anderswo aufbewahrt haben, fügen Sie die Ordner oder Archive hier hinzu, und die App lernt auch aus ihnen. Gelesen werden Zip-, 7z- und Tar-Archive, unkomprimiert oder mit gzip, bzip2 oder xz komprimiert; alles, was kein Journal ist, wird übersprungen. Jeder gefundene Kommandant wird in seine eigenen Daten importiert. Ihr aktueller Standort und Ihre aktuelle Ladung bleiben unverändert, und dieselben Journale zweimal zu importieren schadet nicht.
