speech.connectingToLlm=Verbinde mit LLM...
speech.unsupportedLocalModel=Achtung, Kommandant. Ihr lokales Modell ist nicht Gemma 4 E4B, das diese Version voraussetzt. Die Anwendung funktioniert möglicherweise nicht korrekt oder gar nicht.
speech.missingController=Controller {0} ist nicht angeschlossen. Seine Belegungen werden erst geladen, wenn er angeschlossen ist.
speech.missingControllers=Diese Controller sind nicht angeschlossen: {0}. Ihre Belegungen werden erst geladen, wenn sie angeschlossen sind.
speech.catchUpFound=Die Installation {0} ist wieder da und hat deine letzten Steuerungsänderungen verpasst. Öffne BindForge, um sie zu aktualisieren.
speech.catchUpFoundMany=Diese Installationen sind wieder da und haben deine letzten Steuerungsänderungen verpasst: {0}. Öffne BindForge, um sie zu aktualisieren.
speech.bindforgeBackedUp=BindForge hat alle deine Eingabe-Konfigurationsdateien gesichert, so wie sie vor jeder Änderung durch BindForge waren.
speech.notOdyssey=Achtung, Kommandant. Ihr Spiel läuft nicht mit Odyssey. Diese Anwendung ist für Elite Dangerous Odyssey gebaut, und vieles davon funktioniert unter Horizons nicht.
speech.setup.noLlm=Achtung, Commander. Es ist kein Sprachmodell konfiguriert, daher kann ich Sie weder verstehen noch Ihnen antworten. Richten Sie die kostenlose Mistral-Stufe ein oder installieren Sie das lokale Modell Gemma 4 E4B. Eine Anleitung finden Sie auf elite intel punkt org. Außerdem wird eine Audiokalibrierung vor dem ersten Flug dringend empfohlen.
speech.setup.noLlmProvider=Achtung, Commander. Sie haben ein Cloud-Sprachmodell eingestellt, aber keinen Cloud-Anbieter ausgewählt, daher kann ich Ihnen nicht antworten. Öffnen Sie den Reiter KI-Dienste in den Einstellungen, wählen Sie Ihren Anbieter aus der Liste und speichern Sie.
speech.setup.noJournals=Achtung, Commander. Ich finde an der eingestellten Stelle keine Journaldateien von Elite Dangerous. Solange der Journalordner nicht korrekt eingestellt ist, bin ich blind für alles, was um Ihr Schiff geschieht. Sie können ihn im Reiter Einstellungen setzen.
speech.setup.noBindings=Achtung, Commander. Ich finde an der eingestellten Stelle keine Tastenbelegungen. Solange der Bindings-Ordner nicht korrekt eingestellt ist, kann ich Ihr Schiff nicht steuern. Sie können ihn im Reiter Bindings setzen.
speech.setup.noSavedBindings=Achtung, Commander. Ihr Bindings-Ordner ist korrekt eingestellt, aber Elite Dangerous hat noch keine Tastenbelegungsdatei hineingeschrieben. Das Spiel speichert eine erst, nachdem Sie Ihre Steuerung angepasst haben. Öffnen Sie also im Spiel Optionen, dann Steuerung, ändern Sie eine beliebige Belegung, und ich übernehme sie. Bis dahin kann ich Ihr Schiff nicht steuern.
