bindings.autofix.single.skipped.gameMenu=Das Spielmenü bleibt absichtlich unbelegt. Escape öffnet es ohnehin, und jede Taste, die hier liegt, funktioniert für keine andere Steuerung mehr.
bindings.autofix.single.skipped.onPurpose=Alle Fracht abwerfen bleibt absichtlich unbelegt. Es leert den Laderaum ins All und lässt sich nicht rückgängig machen, und kein EliteIntel-Befehl drückt es. Wer es will, belegt es von Hand.

