# Game clock disagreement dialog (GameClockWarning)
gameClock.dialog.title=Uhren von Spiel und PC stimmen nicht überein
gameClock.dialog.body=Elite Dangerous und dein PC weichen bei der aktuellen Uhrzeit um {0} voneinander ab.
gameClock.dialog.cause.timeZone=Das passiert oft, nachdem ein Windows-Update die Zeitzone oder die Sommerzeit-Einstellung geändert hat.
gameClock.dialog.cause.drift=Wahrscheinlich ist die PC-Uhr abgedriftet, denn Windows gleicht sie nur ab und zu mit der richtigen Zeit ab.
gameClock.dialog.amount.hours={0,choice,1#1 Stunde|1<{0} Stunden}
gameClock.dialog.amount.minutes={0,choice,1#etwa 1 Minute|1<etwa {0} Minuten}
gameClock.dialog.consequences=EliteIntel gleicht den Unterschied aus, aber nicht in jedem Moment. Solange die Uhr nicht korrigiert ist, musst du rechnen mit:\n  - Spielereignissen, die in den ersten Momenten nach dem Start von EliteIntel verpasst werden\n  - Spielereignissen, die eine Weile verpasst werden, nachdem sich die PC-Uhr geändert hat\nAndere Elite-Dangerous-Tools auf diesem PC gleichen ihn womöglich gar nicht aus.
gameClock.dialog.fix.timeZone=So behebst du es:\n  1. Öffne Windows-Einstellungen > Zeit und Sprache > Datum und Uhrzeit.\n  2. Wähle deine richtige Zeitzone.\n  3. Schalte "Uhrzeit automatisch festlegen" und "Automatisch an die Sommerzeit anpassen" ein.\n  4. Klicke auf "Jetzt synchronisieren".\n  5. Starte Elite Dangerous neu.
gameClock.dialog.fix.sync=So behebst du es:\n  1. Öffne Windows-Einstellungen > Zeit und Sprache > Datum und Uhrzeit.\n  2. Schalte "Uhrzeit automatisch festlegen" ein.\n  3. Klicke auf "Jetzt synchronisieren".\n  4. Starte Elite Dangerous neu.
gameClock.dialog.check=Zur Kontrolle: Die Uhr im HUD des Spiels und die Uhr auf der Startseite von EliteIntel sollten dieselbe Zeit zeigen.

