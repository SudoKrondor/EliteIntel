speech.bindingConflictsBlocking=Kommandant, kritischer Tastenkonflikt. Ihre Steuerung der Galaxiekarte und Ihre Menünavigation liegen auf {0,choice,1#derselben Taste|1<denselben Tasten} - {1}. Die Routenplanung kann erst funktionieren, wenn Karte und Menüs getrennte Tasten haben. Die genauen Belegungen stehen in der Systemausgabe.
speech.bindingReservedGameMenu=Kommandant, Ihr Spielmenü liegt auf {1}. Elite öffnet dieses Menü bei jeder Kombination, die auf {1} endet, daher {0,choice,1#lässt sich die Steuerung auf {2} nicht drücken|1<lassen sich die {0} Steuerungen auf {2} nicht drücken}, ohne Sie in den Optionsbildschirm zu werfen. Die Lösung ist eine einzige Änderung: Löschen Sie die Belegung für das Spielmenü in den Spieloptionen unter Steuerung. Escape öffnet dieses Menü ohnehin. Die genauen Belegungen stehen in der Systemausgabe.
speech.bindingReservedOsChord=Kommandant, {0,choice,1#eine Steuerung liegt|1<{0} Steuerungen liegen} auf einer Tastenkombination, die Ihr Betriebssystem abfängt, bevor das Spiel sie überhaupt sieht - {1}. Ein Druck darauf schließt das Spiel oder verlässt Ihre Sitzung ganz. Die Lösung: Belegen Sie {0,choice,1#diese Steuerung|1<diese Steuerungen} in den Spieloptionen unter Steuerung mit einer anderen Taste. Die genauen Belegungen stehen in der Systemausgabe.
speech.bindingsAppliedReload=Belegungen angewendet. Zum Laden öffnen und schließen Sie den Steuerungsbildschirm in Elite Dangerous.
