speech.bindingsMissing=Kommandant, {0} erforderliche {0,choice,1#Tastenbelegung|1<Tastenbelegungen} nicht zugewiesen. Details finden Sie in der Systemausgabe der App und im Tastenbelegungsmenü im Spiel.
speech.bindingConflicts=Kommandant, {0} {0,choice,1#Konflikt|1<Konflikte} bei Tastenbelegungen erkannt. Einige Steuerungen funktionieren möglicherweise nicht. Öffnen Sie BindForge, dann Bindungseditor, dann Anomalien.
# NEEDS NATIVE REVIEW (2026-08-27): reworded when this warning started naming the actual conflicting keys.
# Meaning and MessageFormat escaping are verified; phrasing is not. Delete these two lines once a native speaker signs it off.
speech.bindingConflictsBlocking=Kommandant, kritischer Tastenkonflikt. Ihre Steuerung der Galaxiekarte und Ihre Menünavigation liegen auf {0,choice,1#derselben Taste|1<denselben Tasten} - {1}. Die Routenplanung kann erst funktionieren, wenn Karte und Menüs getrennte Tasten haben. Die genauen Belegungen finden Sie unter BindForge, dann Bindungseditor, dann Anomalien.
speech.bindingGeneralPresetNotRead=Kommandant, Ihre Allgemeine Steuerung nutzt die Voreinstellung {0}, für die es keine gespeicherte Datei gibt, daher lese ich stattdessen {1}. Die Tasten, die ich für Galaxiekarte und Menüs drücke, sind womöglich nicht die, die das Spiel verwendet, und die Routenplanung kann fehlschlagen. Öffnen Sie dazu im Spiel Optionen, dann Steuerung, und stellen Sie die Allgemeine Steuerung auf {1}.
speech.bindingSectionsNotRead=Kommandant, diese Steuerung nutzt eine andere Voreinstellung als {1}, die ich lese: {0}. Die Tasten, die ich dafür drücke, sind womöglich nicht die, die das Spiel verwendet. Öffnen Sie dazu im Spiel Optionen, dann Steuerung, und stellen Sie sie auf {1}. Oder öffnen Sie den Tab BindForge, um zu wählen, welche Datei ich lese.
speech.bindingReservedGameMenu=Kommandant, Ihr Spielmenü liegt auf {1}. Elite öffnet dieses Menü bei jeder Kombination, die auf {1} endet, daher {0,choice,1#lässt sich die Steuerung auf {2} nicht drücken|1<lassen sich die {0} Steuerungen auf {2} nicht drücken}, ohne Sie in den Optionsbildschirm zu werfen. Die Lösung ist eine einzige Änderung: Löschen Sie die Belegung für das Spielmenü in den Spieloptionen unter Steuerung. Escape öffnet dieses Menü ohnehin. Die genauen Belegungen stehen in der Systemausgabe.
speech.bindingReservedOsChord=Kommandant, {0,choice,1#eine Steuerung liegt|1<{0} Steuerungen liegen} auf einer Tastenkombination, die Ihr Betriebssystem abfängt, bevor das Spiel sie überhaupt sieht - {1}. Ein Druck darauf schließt das Spiel oder verlässt Ihre Sitzung ganz. Die Lösung: Belegen Sie {0,choice,1#diese Steuerung|1<diese Steuerungen} in den Spieloptionen unter Steuerung mit einer anderen Taste. Die genauen Belegungen stehen in der Systemausgabe.
speech.warning.journalDirectoryMissing=Warnung. Das Journalverzeichnis von Elite Dangerous wurde nicht gefunden. Bitte überprüfen Sie das Journalverzeichnis im Reiter Kommandant.
speech.warning.journalFilesMissing=Warnung. Im konfigurierten Verzeichnis wurden keine Journaldateien gefunden. Bitte überprüfen Sie das Journalverzeichnis im Reiter Kommandant.
speech.warning.bindingsDirectoryMissing=Warnung. Das Verzeichnis für Tastenbelegungen wurde nicht gefunden. Bitte überprüfen Sie das Belegungsverzeichnis im Reiter BindForge.
speech.warning.bindingsFilesMissing=Warnung. Dieser Ordner enthält keine StartPreset-Datei, also ist er nicht der Bindings-Ordner des Spiels. Bitte wählen Sie das Belegungsverzeichnis im Reiter BindForge erneut.
speech.warning.noGameSession=Kommandant, keine Spielsitzung erkannt. In Bereitschaft.
speech.warning.journalReadError=Fehler beim Lesen des Journals: {0}
speech.warning.bindingsDirectoryInaccessible=Fehler. Das Tastenbelegungsverzeichnis ist nicht zugänglich.
speech.warning.bindingsStockPresetNoInstallation=Warnung. Sie verwenden die Standardsteuerung des Spiels, und ich finde Ihre Installation von Elite Dangerous nicht, um sie daraus zu lesen. Fügen Sie sie unter Spielinstallationen im Reiter BindForge hinzu, oder ändern Sie im Spiel unter Steuerung eine beliebige Belegung, und ich übernehme sie.
speech.warning.bindingsPresetFileMissing=Warnung. Ich finde die Belegungsdatei für das Steuerungsprofil nicht, das das Spiel verwendet. Öffnen Sie im Spiel Optionen, dann Steuerung, speichern Sie Ihre Belegungen, und ich übernehme sie.
speech.warning.bindingsUnreadable=Warnung. Ich konnte Ihre Tastenbelegungsdatei nicht lesen. Öffnen Sie im Spiel Optionen, dann Steuerung, speichern Sie Ihre Belegungen erneut, und ich übernehme sie.
speech.warning.uncataloguedMissionDetected={0}, ich habe eine {1}-Mission entdeckt, die ich noch nicht erfasst habe.
speech.customCommandsLoaded={0}, {1} {1,choice,1#eigener Befehl geladen|1<eigene Befehle geladen}.
