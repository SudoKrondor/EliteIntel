# The commander's answer to a destructive-action confirmation (see ConfirmationReplies)
# An answer must OPEN with one of these phrases. A negative wins over an affirmative. English applies in every language.
affirmative=да, ага, конечно, подтверждаю, подтверждено, так точно, давай, выполняй, делай, верно, хорошо, окей, ок, согласен, валяй, действуй, разрешаю
negative=нет, не, отставить, отмена, стой, погоди, подожди, стоп, забудь, отбой, ни в коем случае, не надо
