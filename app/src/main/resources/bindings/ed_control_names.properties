# Elite Dangerous control names as the game's own OPTIONS > CONTROLS screen shows them.
#
# The .binds file names every control with an internal XML tag ("ExplorationSAANextGenus")
# that appears nowhere in the game. This file is the bridge: it maps each tag to the place
# the commander actually reads it, so the Binding Profile table can be searched and scanned
# against the game screen instead of against Frontier's internal vocabulary.
#
# Format:  <XmlTagName> = <SECTION>|<Group>|<Control name>
#   SECTION       one of GENERAL, SHIP, SRV, ON_FOOT - the four headings down the left of the
#                 game's controls screen. Localized by the app (bindings.section.*).
#   Group         the collapsible subsection heading inside that section ("Flight Rotation").
#   Control name  the row label itself ("Yaw Left").
#
# Group and control name stay in ENGLISH ON PURPOSE, in all app languages. Their whole job is
# to match what the commander sees on their own game screen, and the game ships only EN, ES,
# FR, RU, PT-BR and DE - three of our nine languages have no game translation to match at all,
# and for the six that do, a translation we guessed would send the commander hunting for a row
# Frontier labelled differently. English is the only wording guaranteed to be findable.
#
# Names verified against the game's controls screen (build 4.2) and matched to their tags by
# the key each row showed. A tag absent from this file falls back to its humanized XML name
# under the OTHER section - add it here once its in-game row has been read off the screen.
#
# Never rename a key: the key IS the .binds XML tag.
