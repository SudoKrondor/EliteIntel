plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'com.github.johnrengelman.shadow'

    repositories {
        mavenCentral()
        maven {
            url 'https://oss.sonatype.org/content/repositories/snapshots'
        }
    }

    sourceCompatibility = 21
    targetCompatibility = 21
}

application {
    mainClass = 'elite.intel.App'
}

tasks.named('build') {
    dependsOn project(':app').tasks.shadowJar
    dependsOn project(':updater').tasks.shadowJar
}
// --- Native HUD overlay ------------------------------------------------------
// Builds overlay/src into distribution/overlays/, which the installer packages
// like the TTS/STT models.
//
// Deliberately NOT wired into `build`: the binary it produces is tracked in git
// (LFS), so building it on every `./gradlew build` would leave a dirty working
// tree on machines that only touched the Java side. Run it by hand after
// changing overlay/src, and commit the result. The Windows binary comes from
// buildOverlayWindows below, the same way.
tasks.register('buildOverlay', Exec) {
    group = 'build'
    description = 'Builds the native HUD overlay into distribution/overlays/'
    workingDir = file('overlay')
    commandLine 'make'
    onlyIf { org.gradle.internal.os.OperatingSystem.current().isLinux() }
    // The whole directory, so a new platform shell or header is picked up
    // without editing this list - naming one file is how it went stale before.
    inputs.dir('overlay/src')
    // Vendored OpenVR headers live outside src/, so a SDK bump would otherwise
    // leave this task believing it was up to date.
    inputs.dir('overlay/third_party')
    outputs.file('distribution/overlays/elite-intel-overlay')
    // The overlay needs X11/cairo/pango headers, which a contributor building
    // only the Java side may not have. Report it instead of failing the build.
    ignoreExitValue = true
    doLast {
        if (executionResult.get().exitValue != 0) {
            logger.warn('buildOverlay: skipped - see overlay/Makefile for required dev packages')
        }
    }
}

// Cross-builds the Windows overlay from Linux via a Fedora/mingw container, so
// local installer builds can package it alongside the Linux binary. Not part of
// `build` - it needs docker/podman and a network fetch the first time.
tasks.register('buildOverlayWindows', Exec) {
    group = 'build'
    description = 'Cross-builds the Windows HUD overlay into distribution/overlays/'
    commandLine './overlay/build-windows.sh'
}
