name: Build Release Assets

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-zip:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Pull LFS files
        run: git lfs pull

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew --no-daemon clean build

      - name: Verify all distribution assets are committed
        run: |
          # The update ZIP is packaged from distribution/ (see "Copy distribution to release" below).
          # A fresh CI checkout only contains committed files, so any asset present here but not tracked
          # by git is silently omitted from the release and breaks auto-update for everyone. This runs
          # after the build so build-extracted assets (e.g. the LWJGL natives) are present. `git ls-files
          # -o` lists every untracked file under distribution/ INCLUDING gitignored ones - that is exactly
          # how the LWJGL natives slipped through. The only allowed exceptions are the two jars the build
          # itself regenerates into distribution/ here.
          untracked=$(git ls-files -o -- distribution/ \
            | grep -vE '^distribution/(elite_intel\.jar|elite_intel_updater\.jar)$' || true)
          if [ -n "$untracked" ]; then
            echo "::error::Untracked files in distribution/ would be missing from the update ZIP:"
            echo "$untracked" | sed 's/^/  - /'
            echo "Commit them with 'git add' (large binaries go through Git LFS per .gitattributes)."
            echo "If a file is a build output that CI regenerates, add it to the allow-list in this step."
            exit 1
          fi
          echo "distribution/ asset check passed: every asset is tracked."

      - name: Extract tar
        run: tar -xf app/build/distributions/app-shadow.tar

      - name: Prepare for Install4j
        run: |
          # elite_intel.jar: copied from the shadow tar
          # elite_intel_updater.jar: already in distribution/ - Gradle put it there
          mkdir -p distribution
          cp app-shadow/lib/elite_intel.jar distribution/

      - name: Create release directory
        run: mkdir release

      - name: Copy distribution to release
        run: cp -r distribution/. release/

      - name: Get version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')" >> $GITHUB_ENV
          else
            echo "VERSION=test-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV
          fi

      - name: Create ZIP
        run: |
          cd release
          zip -r ../elite_intel_${{ env.VERSION }}.zip .

      - name: Verify ZIP contents
        run: unzip -l elite_intel_${{ env.VERSION }}.zip | grep "\.jar"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: zip
          path: elite_intel_${{ env.VERSION }}.zip
          if-no-files-found: error

  # No overlay build job here, deliberately. The HUD overlay is a native binary
  # and both platforms' binaries are tracked in git rather than built during the
  # release (the auto-update ZIP only ships what git tracks, and build-zip fails
  # on untracked files under distribution/). Both are produced on the developer's
  # Linux box and committed: `./gradlew buildOverlay` for Linux,
  # `./overlay/build-windows.sh` for Windows. The Windows script also bundles and
  # strips the mingw DLLs the .exe imports, which is why it cannot be swapped for
  # a bare `make` on a Windows runner: the .exe and the DLLs beside it have to
  # come from the same sysroot.
  build-windows:
    runs-on: ubuntu-latest
    needs: build-zip

    steps:
      - uses: actions/checkout@v4

      - name: Pull LFS files
        run: git lfs pull

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew --no-daemon clean build

      - name: Extract tar
        run: tar -xf app/build/distributions/app-shadow.tar

      - name: Prepare distribution for install4j
        run: |
          # elite_intel.jar: copied from the shadow tar
          # elite_intel_updater.jar: already in distribution/ - Gradle put it there
          mkdir -p distribution
          cp app-shadow/lib/elite_intel.jar distribution/elite_intel.jar
          ls -la distribution/
          du -sh distribution/*.jar || true
          file distribution/*.jar   || true

      - name: Setup install4j
        uses: luangong/setup-install4j@v1
        with:
          version: '12.0.3'
          license: ${{ secrets.INSTALL4J_LICENSE_KEY }}

      - name: Build Windows .exe with verbose logging
        run: |
          install4jc --verbose --destination=installers --build-ids=36 Installer.install4j > install4j.log 2>&1 || true
          cat install4j.log
          ls -la installers/ || true
          du -sh installers/*.exe || echo "No .exe found"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: installers/*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    needs: build-zip

    steps:
      - uses: actions/checkout@v4

      - name: Pull LFS files
        run: git lfs pull

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew --no-daemon clean build

      - name: Extract tar
        run: tar -xf app/build/distributions/app-shadow.tar

      - name: Prepare distribution for install4j
        run: |
          mkdir -p distribution
          cp app-shadow/lib/elite_intel.jar distribution/elite_intel.jar
          ls -la distribution/
          du -sh distribution/*.jar || true
          file distribution/*.jar   || true

      - name: Setup install4j
        uses: luangong/setup-install4j@v1
        with:
          version: '12.0.3'
          license: ${{ secrets.INSTALL4J_LICENSE_KEY }}

      - name: Build Linux installer with verbose logging
        run: |
          install4jc --verbose --destination=installers --build-ids=37 Installer.install4j > install4j.log 2>&1 || true
          cat install4j.log
          ls -la installers/ || true
          du -sh installers/*.sh || echo "No .sh found"

      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: linux-sh
          path: installers/*.sh
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [ build-zip, build-windows, build-linux ]

    steps:
      # Downloaded by name, one step each - never `pattern: '*'`. That pattern
      # pulls EVERY artifact in the run, because `needs` orders jobs and does not
      # limit what is visible, so any job added later silently becomes a public
      # release asset. Exactly three assets are ever published, and they are all
      # built here from what distribution/ already contains: the two install4j
      # installers, and the update ZIP that the auto-updater resolves by name
      # (UpdaterApp.fetchLatestZipUrl - no ZIP asset, no auto-update).
      - name: Download update ZIP
        uses: actions/download-artifact@v4
        with:
          name: zip
          path: artifacts

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: artifacts

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: linux-sh
          path: artifacts

      - name: List downloaded files for debug
        run: ls -la artifacts/

      - name: Create GitHub Release and attach assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.ref_name }}
          VERSION=$(echo $TAG | sed 's/^v//')

          gh release create "$TAG" \
            --title "Elite Intel $VERSION" \
            --generate-notes \
            --repo ${{ github.repository }} \
            artifacts/*.zip \
            artifacts/*.exe \
            artifacts/*.sh || true