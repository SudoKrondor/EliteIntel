# Proof of concept, round 2: what an in-app LM Studio installer needs to know.
#
#   Q1  Does ~/.lmstudio-home-pointer move the whole install (binaries AND models) to another drive?
#   Q2  Does LMS_NO_MODIFY_PATH=1 leave PATH and the shell profiles untouched?
#   Q3  How big is LM Studio itself, before any model?
#   Q4  Does the REST download report usable progress (downloaded_bytes, bytes_per_second)?
#   Q5  If the daemon dies mid-download (the app is closed), does a new download resume or restart?
#   Q6  What does a REST load with Elite Intel's settings actually configure?
#   Q7  After uninstalling (daemon down, delete the home and the pointer), is anything left behind?
#
# Runs on GitHub-hosted runners: no GPU, and their network is NOT representative of a commander's,
# so no timing here means anything. Round 1 (the wiki's own commands) is in this file's git history.
#
# Independent of ci.yml: it never builds, tags or publishes anything.

name: LM Studio Smoke Test

permissions:
  contents: read

on:
  push:
    branches:
      - lmstudio-smoke
  workflow_dispatch:

env:
  MODEL: google/gemma-4-e4b

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      LMS_HOME: D:\LMStudio
      # Round 2 found the user PATH gained D:\LMStudio\bin AFTER the install, with the flag set only for the
      # installer. Set for every lms call this time, to see whether that stops it.
      LMS_NO_MODIFY_PATH: '1'

    steps:
      - name: "Baseline: what exists before the install"
        run: |
          @'
          function Snapshot($file) {
            $lines = @()
            foreach ($root in @($env:USERPROFILE, $env:LOCALAPPDATA, $env:APPDATA)) {
              $lines += Get-ChildItem -Force -LiteralPath $root -ErrorAction SilentlyContinue |
                ForEach-Object { $_.FullName }
            }
            $lines | Sort-Object | Set-Content $file
          }
          # Prints what changed since the baseline: the user PATH and the profile folders.
          function Checkpoint($label) {
            $before = (Get-Content "$env:RUNNER_TEMP\user-path-before.txt" -Raw).Trim()
            $now = "$([Environment]::GetEnvironmentVariable('Path', 'User'))".Trim()
            if ($before -eq $now) { Write-Host "CHECKPOINT [$label] user PATH unchanged" }
            else { Write-Host "::warning::CHECKPOINT [$label] user PATH changed: $now" }
            Snapshot "$env:RUNNER_TEMP\now.txt"
            $diff = Compare-Object (Get-Content "$env:RUNNER_TEMP\before.txt") (Get-Content "$env:RUNNER_TEMP\now.txt")
            if (-not $diff) { Write-Host "CHECKPOINT [$label] profile folders unchanged" }
            else { $diff | ForEach-Object { Write-Host "CHECKPOINT [$label] $($_.SideIndicator) $($_.InputObject)" } }
          }
          '@ | Set-Content "$env:RUNNER_TEMP\helpers.ps1"
          . "$env:RUNNER_TEMP\helpers.ps1"
          Snapshot "$env:RUNNER_TEMP\before.txt"
          [Environment]::GetEnvironmentVariable('Path', 'User') | Set-Content "$env:RUNNER_TEMP\user-path-before.txt"
          Write-Host "User PATH before:"; Get-Content "$env:RUNNER_TEMP\user-path-before.txt"

      - name: "Q1: write the home pointer to D:, then install with LMS_NO_MODIFY_PATH=1"
        run: |
          New-Item -ItemType Directory -Force -Path $env:LMS_HOME | Out-Null
          [IO.File]::WriteAllText("$env:USERPROFILE\.lmstudio-home-pointer", $env:LMS_HOME)
          irm https://lmstudio.ai/install.ps1 | iex
          . "$env:RUNNER_TEMP\helpers.ps1"; Checkpoint "after install"

      - name: "Q1: where did it install?"
        run: |
          $candidates = @("$env:LMS_HOME\bin\lms.exe", "$env:USERPROFILE\.lmstudio\bin\lms.exe")
          foreach ($c in $candidates) { Write-Host ("{0}  exists={1}" -f $c, (Test-Path $c)) }
          Write-Host "C:\...\.lmstudio exists: $(Test-Path "$env:USERPROFILE\.lmstudio")"
          $lms = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $lms) {
            Get-ChildItem C:\Users, D:\ -Recurse -Filter lms.exe -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "found: $($_.FullName)" }
            throw "lms.exe not found at either location."
          }
          if ($lms -like "$env:LMS_HOME*") { Write-Host "OK: the pointer moved the install to $env:LMS_HOME" }
          else { Write-Host "::warning::The pointer did NOT move the install. lms.exe is at $lms" }
          "LMS=$lms" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: "Q2: did the user PATH change?"
        run: |
          $before = Get-Content "$env:RUNNER_TEMP\user-path-before.txt" -Raw
          $after = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($before.Trim() -eq "$after".Trim()) { Write-Host "OK: user PATH unchanged." }
          else { Write-Host "::warning::User PATH changed."; Write-Host "after: $after" }

      - name: "Q3: size of LM Studio itself (no model yet)"
        run: |
          function SizeOf($p) {
            if (-not (Test-Path $p)) { return "absent" }
            $b = (Get-ChildItem -LiteralPath $p -Recurse -Force -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
            "{0:N0} MB" -f ($b / 1MB)
          }
          Write-Host "$env:LMS_HOME : $(SizeOf $env:LMS_HOME)"
          Write-Host "$env:USERPROFILE\.lmstudio : $(SizeOf "$env:USERPROFILE\.lmstudio")"
          Get-ChildItem -Force $env:LMS_HOME -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)  $(SizeOf $_.FullName)" }

      - name: "Q4: start the daemon and server, start a REST download"
        run: |
          . "$env:RUNNER_TEMP\helpers.ps1"
          & $env:LMS daemon up
          Checkpoint "after daemon up"
          & $env:LMS server start --port 1234
          Checkpoint "after server start"
          $r = Invoke-RestMethod -Method Post -Uri http://localhost:1234/api/v1/models/download `
                 -ContentType "application/json" -Body (@{ model = $env:MODEL } | ConvertTo-Json)
          $r | ConvertTo-Json -Depth 5
          if (-not $r.job_id) { throw "No job_id (status: $($r.status))." }
          "JOB_ID=$($r.job_id)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: "Q4 + Q5: watch progress, then kill the daemon part-way"
        run: |
          $deadline = (Get-Date).AddMinutes(30)
          do {
            Start-Sleep -Seconds 5
            $s = Invoke-RestMethod "http://localhost:1234/api/v1/models/download/status/$env:JOB_ID"
            Write-Host ("{0}  {1:N0} / {2:N0} MB  {3:N1} MB/s  eta={4}" -f $s.status, ($s.downloaded_bytes / 1MB),
              ($s.total_size_bytes / 1MB), ($s.bytes_per_second / 1MB), $s.estimated_completion)
          } until ($s.downloaded_bytes -ge 800MB -or $s.status -ne 'downloading' -or (Get-Date) -gt $deadline)
          $s | ConvertTo-Json -Depth 5
          if ($s.status -ne 'downloading') { Write-Host "::warning::Download left 'downloading' before the interrupt test: $($s.status)" }
          Write-Host "--- killing the daemon mid-download (the app being closed) ---"
          & $env:LMS daemon down
          Start-Sleep -Seconds 5
          Write-Host "Partial files on disk:"
          Get-ChildItem $env:LMS_HOME, "$env:USERPROFILE\.lmstudio" -Recurse -File -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.Length -gt 50MB } | ForEach-Object { Write-Host ("  {0}  {1:N0} MB" -f $_.FullName, ($_.Length / 1MB)) }

      - name: "Q5: daemon back up: does the same download resume?"
        run: |
          & $env:LMS daemon up
          & $env:LMS server start --port 1234
          try {
            $old = Invoke-RestMethod "http://localhost:1234/api/v1/models/download/status/$env:JOB_ID"
            Write-Host "Old job after restart:"; $old | ConvertTo-Json -Depth 5
          } catch { Write-Host "Old job id is gone after the restart: $($_.Exception.Message)" }
          $r = Invoke-RestMethod -Method Post -Uri http://localhost:1234/api/v1/models/download `
                 -ContentType "application/json" -Body (@{ model = $env:MODEL } | ConvertTo-Json)
          Write-Host "New download request:"; $r | ConvertTo-Json -Depth 5
          if ($r.status -eq 'already_downloaded') { Write-Host "::warning::Reported already_downloaded after an interrupted download." ; exit 0 }
          $first = $true
          $deadline = (Get-Date).AddMinutes(90)
          do {
            Start-Sleep -Seconds 10
            $s = Invoke-RestMethod "http://localhost:1234/api/v1/models/download/status/$($r.job_id)"
            if ($first) {
              Write-Host ("FIRST STATUS AFTER RESTART: {0:N0} MB already downloaded" -f ($s.downloaded_bytes / 1MB))
              $first = $false
            }
            Write-Host ("{0}  {1:N0} / {2:N0} MB" -f $s.status, ($s.downloaded_bytes / 1MB), ($s.total_size_bytes / 1MB))
          } until ($s.status -ne 'downloading' -or (Get-Date) -gt $deadline)
          $s | ConvertTo-Json -Depth 5
          if ($s.status -ne 'completed') { throw "Download ended as '$($s.status)'." }

      - name: "Q1: where did the model land?"
        run: |
          Get-ChildItem $env:LMS_HOME, "$env:USERPROFILE\.lmstudio" -Recurse -Filter *.gguf -Force -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host ("  {0}  {1:N0} MB" -f $_.FullName, ($_.Length / 1MB)) }
          & $env:LMS ls

      - name: "Q6: REST load with Elite Intel's settings"
        run: |
          $body = @{ model = $env:MODEL; context_length = 8192; flash_attention = $true; echo_load_config = $true } | ConvertTo-Json
          $r = Invoke-RestMethod -Method Post -Uri http://localhost:1234/api/v1/models/load -ContentType "application/json" -Body $body -TimeoutSec 900
          $r | ConvertTo-Json -Depth 6
          Write-Host "--- as /api/v1/models reports it ---"
          (Invoke-RestMethod http://localhost:1234/api/v1/models).models |
            Where-Object { $_.key -eq $env:MODEL } | ForEach-Object { $_.loaded_instances | ConvertTo-Json -Depth 6 }
          $ids = (Invoke-RestMethod http://localhost:1234/v1/models).data.id
          Write-Host "/v1/models: $($ids -join ', ')"
          . "$env:RUNNER_TEMP\helpers.ps1"; Checkpoint "after download and load"

      - name: "Q7: uninstall: stop, daemon down, delete the home and the pointer"
        run: |
          & $env:LMS server stop
          & $env:LMS unload --all
          & $env:LMS daemon down
          Start-Sleep -Seconds 5
          Write-Host "Processes still running that look like LM Studio:"
          Get-Process | Where-Object { $_.Name -match 'lm|llm|lms' } | ForEach-Object { Write-Host "  $($_.Name) ($($_.Id)) $($_.Path)" }
          Remove-Item -Recurse -Force $env:LMS_HOME
          Remove-Item -Force "$env:USERPROFILE\.lmstudio-home-pointer"

      - name: "Q7: what is left behind?"
        run: |
          . "$env:RUNNER_TEMP\helpers.ps1"; Checkpoint "after uninstall"

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LMS_HOME: /mnt/lmstudio
      LMS_NO_MODIFY_PATH: '1'

    steps:
      - name: "Baseline: what exists before the install"
        run: |
          cat > "$RUNNER_TEMP/helpers.sh" <<'EOF'
          snapshot() { for d in "$HOME" "$HOME/.config" "$HOME/.cache" "$HOME/.local/share"; do ls -A1 "$d" 2>/dev/null | sed "s|^|$d/|"; done | sort; }
          profiles() { for f in .bashrc .profile .bash_profile .zshrc; do [ -f "$HOME/$f" ] && sha256sum "$HOME/$f"; done; true; }
          # Prints what changed since the baseline: the shell profiles and the home folders.
          checkpoint() {
            if diff -q "$RUNNER_TEMP/profiles-before.txt" <(profiles) >/dev/null; then echo "CHECKPOINT [$1] shell profiles unchanged"
            else echo "::warning::CHECKPOINT [$1] a shell profile changed"; diff "$RUNNER_TEMP/profiles-before.txt" <(profiles) || true; fi
            if diff -q "$RUNNER_TEMP/before.txt" <(snapshot) >/dev/null; then echo "CHECKPOINT [$1] home folders unchanged"
            else diff "$RUNNER_TEMP/before.txt" <(snapshot) | sed "s|^|CHECKPOINT [$1] |" || true; fi
          }
          EOF
          . "$RUNNER_TEMP/helpers.sh"
          snapshot > "$RUNNER_TEMP/before.txt"
          profiles > "$RUNNER_TEMP/profiles-before.txt"
          cat "$RUNNER_TEMP/profiles-before.txt"

      - name: "Q1: write the home pointer to /mnt (a second disk), then install with LMS_NO_MODIFY_PATH=1"
        run: |
          sudo mkdir -p "$LMS_HOME" && sudo chown "$(id -u):$(id -g)" "$LMS_HOME"
          printf '%s' "$LMS_HOME" > "$HOME/.lmstudio-home-pointer"
          curl -fsSL https://lmstudio.ai/install.sh | bash
          . "$RUNNER_TEMP/helpers.sh"; checkpoint "after install"

      - name: "Q1: where did it install?"
        run: |
          for c in "$LMS_HOME/bin/lms" "$HOME/.lmstudio/bin/lms"; do echo "$c exists=$([ -x "$c" ] && echo yes || echo no)"; done
          echo "~/.lmstudio exists: $([ -e "$HOME/.lmstudio" ] && echo yes || echo no)"
          if [ -x "$LMS_HOME/bin/lms" ]; then LMS="$LMS_HOME/bin/lms"; echo "OK: the pointer moved the install"
          elif [ -x "$HOME/.lmstudio/bin/lms" ]; then LMS="$HOME/.lmstudio/bin/lms"; echo "::warning::The pointer did NOT move the install"
          else find / -name lms -type f 2>/dev/null | head; exit 1; fi
          echo "LMS=$LMS" >> "$GITHUB_ENV"

      - name: "Q3: size of LM Studio itself (no model yet)"
        run: |
          du -sh "$LMS_HOME" "$HOME/.lmstudio" 2>/dev/null || true
          du -sh "$LMS_HOME"/* 2>/dev/null || true

      - name: "Q4: daemon, server, REST download with progress"
        run: |
          . "$RUNNER_TEMP/helpers.sh"
          "$LMS" daemon up
          checkpoint "after daemon up"
          "$LMS" server start --port 1234
          checkpoint "after server start"
          r=$(curl -s -X POST http://localhost:1234/api/v1/models/download -H 'Content-Type: application/json' -d "{\"model\":\"$MODEL\"}")
          echo "$r" | jq .
          job=$(echo "$r" | jq -r .job_id)
          [ "$job" != "null" ] || exit 1
          end=$((SECONDS + 5400))
          while :; do
            sleep 10
            s=$(curl -s "http://localhost:1234/api/v1/models/download/status/$job")
            echo "$s" | jq -c '{status, mb: (.downloaded_bytes/1048576|floor), total_mb: ((.total_size_bytes // 0)/1048576|floor), mbps: ((.bytes_per_second // 0)/1048576)}'
            st=$(echo "$s" | jq -r .status)
            [ "$st" = "downloading" ] && [ $SECONDS -lt $end ] || break
          done
          [ "$st" = "completed" ] || { echo "Download ended as $st"; exit 1; }

      - name: "Q1: where did the model land?"
        run: |
          # find exits 1 when a start folder is missing (round 2 died here: the pointer worked, so no ~/.lmstudio).
          find "$LMS_HOME" "$HOME/.lmstudio" -name '*.gguf' -exec ls -la {} \; 2>/dev/null || true
          "$LMS" ls

      - name: "Q6: REST load with Elite Intel's settings"
        run: |
          curl -s -X POST http://localhost:1234/api/v1/models/load -H 'Content-Type: application/json' \
            -d "{\"model\":\"$MODEL\",\"context_length\":8192,\"flash_attention\":true,\"echo_load_config\":true}" | jq .
          curl -s http://localhost:1234/v1/models | jq -c '[.data[].id]'
          . "$RUNNER_TEMP/helpers.sh"; checkpoint "after download and load"

      - name: "Q7: uninstall and look for leftovers"
        run: |
          "$LMS" server stop || true
          "$LMS" unload --all || true
          "$LMS" daemon down || true
          sleep 5
          echo "Processes that look like LM Studio:"; pgrep -af 'llmster|lms' || echo "  none"
          rm -rf "$LMS_HOME" "$HOME/.lmstudio-home-pointer"
          . "$RUNNER_TEMP/helpers.sh"; checkpoint "after uninstall"
